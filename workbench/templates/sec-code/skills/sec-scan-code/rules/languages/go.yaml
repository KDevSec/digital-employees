      攻击者可以注入恶意模板表达式，可能导致RCE。

    detection:
      taint_sinks:
        - "template.Must(.*request"
        - "html/template.*request"
        - "template.Parse(.*request"

      steps:
        - "定位模板解析或执行调用"
        - "检查模板内容是否来自用户输入"
        - "检查模板名称是否可控"
        - "判断是否可注入表达式"

      safety_conditions:
        - "模板内容为硬编码"
        - "模板名称使用白名单"
        - "使用text/template而非html/template处理非HTML"

    remediation:
      principle: "模板内容必须硬编码，模板名称使用白名单"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "模板内容硬编码"
        - "模板名称使用白名单映射"
        - "用户数据作为数据传入"

    patterns:
      - pattern: "template\\.Must\\(.*request|html/template.*request"
        description: "Template with user input"
    safe_patterns:
      - "template\\.HTML"
      - "template\\.JS"

  - category: ldap-injection
    owasp: A05
    severity: HIGH

    description: |
      LDAP注入：用户输入直接拼接到LDAP查询过滤器。
      攻击者可以绕过认证或获取未授权数据。

    detection:
      taint_sinks:
        - "ldap.Search(.*+"
        - "ldap.Search(.*fmt.Sprintf"

      steps:
        - "定位LDAP搜索调用"
        - "检查过滤器是否使用字符串拼接"
        - "追溯拼接内容的来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "使用参数化LDAP查询"
        - "输入经过ldap.EscapeFilter转义"
        - "使用白名单验证"

    remediation:
      principle: "使用ldap.EscapeFilter转义用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用ldap.EscapeFilter转义"
        - "或使用参数化查询"
        - "限制特殊字符"

    patterns:
      - pattern: "ldap\\.Search\\(.*\\+|ldap\\.Search\\(.*fmt\\.Sprintf"
        description: "LDAP search with string concatenation"
    safe_patterns:
      - "ldap\\.EscapeFilter"
      - "sanitize"

  - category: nosql-injection
    owasp: A05
    severity: HIGH

    description: |
      NoSQL注入：用户输入直接用于MongoDB等NoSQL查询。
      攻击者可以注入查询操作符，绕过条件或获取未授权数据。

    detection:
      taint_sinks:
        - "bson.M{.*request"
        - "bson.D{.*request"
        - "collection.Find(.*request"

      steps:
        - "定位NoSQL查询调用"
        - "检查查询条件是否包含用户输入"
        - "检查是否过滤操作符"
        - "判断是否可注入$where等"

      safety_conditions:
        - "输入经过类型验证"
        - "过滤危险操作符"
        - "使用白名单验证"

    remediation:
      principle: "验证输入类型，过滤危险操作符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证输入为预期类型"
        - "过滤$where等操作符"
        - "使用白名单限制字段"

    patterns:
      - pattern: "bson\\.M\\{.*request|bson\\.D\\{.*request"
        description: "MongoDB query with user-controlled input"
    safe_patterns:
