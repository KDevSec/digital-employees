  # ===== A04 - Cryptographic Failures (was A02 in 2021) =====
  - category: weak-hash
    owasp: A04
    severity: HIGH

    description: |
      弱哈希算法：使用MD5或SHA1等不安全的哈希算法。
      攻击者可以构造碰撞，破坏数据完整性验证。

    detection:
      taint_sinks:
        - "md5.Sum("
        - "md5.New("
        - "sha1.Sum("
        - "sha1.New("

      steps:
        - "定位哈希函数调用"
        - "识别使用的哈希算法"
        - "判断是否用于安全目的"
        - "评估碰撞风险"

      safety_conditions:
        - "使用SHA256或更强算法"
        - "不用于密码存储"
        - "不用于完整性验证"

    remediation:
      principle: "使用SHA256/SHA512/BLAKE2等安全哈希算法"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换为sha256或sha512"
        - "密码存储使用bcrypt/argon2"
        - "更新已有哈希值"

    patterns:
      - pattern: "md5\\.Sum\\(|md5\\.New\\(|sha1\\.Sum\\(|sha1\\.New\\("
        description: "MD5/SHA1 hash function"
    safe_patterns:
      - "sha256"
      - "sha512"
      - "blake2b"

  - category: hardcoded-secret
    owasp: A04
    severity: HIGH

    description: |
      硬编码密钥：代码中硬编码密码、API密钥或私钥。
      攻击者可以从代码仓库获取密钥，访问受保护资源。

    detection:
      taint_sinks:
        - "(password|secret|apiKey|token|privateKey)\\s*:=\\s*\"[^\"]+\""
        - "dsn.*:=.*\".*:.*@.*\""

      steps:
        - "扫描代码中的字符串赋值"
        - "检查是否为敏感变量名"
        - "检查值是否为硬编码"
        - "判断是否泄露到版本控制"

      safety_conditions:
        - "密钥从环境变量读取"
        - "密钥从密钥管理服务读取"
        - "不提交到版本控制"

    remediation:
      principle: "密钥必须从环境变量或密钥管理服务读取"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用os.Getenv读取密钥"
        - "或使用密钥管理服务"
        - "轮换已泄露的密钥"

    patterns:
      - pattern: "(password|secret|apiKey|token|privateKey)\\s*:=\\s*\"[^\"]+\""
        description: "Hardcoded secret string"
      - pattern: "dsn.*:=.*\".*:.*@.*\""
        description: "Database DSN with credentials"
    safe_patterns:
      - "os\\.Getenv"
      - "viper\\.Get"

  - category: insecure-random
    owasp: A04
    severity: MEDIUM

    description: |
      不安全随机数：使用math/rand生成安全相关随机数。
      攻击者可以预测随机数序列，破坏安全机制。

    detection:
      taint_sinks:
        - "math/rand."
        - "rand.Int"
        - "rand.Read"

      steps:
        - "定位随机数生成调用"
        - "检查是否使用math/rand"
        - "判断是否用于安全目的"
        - "评估可预测性风险"

      safety_conditions:
        - "使用crypto/rand"
        - "不用于生成密钥/令牌"
        - "不用于安全决策"

    remediation:
      principle: "安全相关随机数必须使用crypto/rand"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换为crypto/rand"
        - "使用rand.Read填充字节"
        - "确保足够的随机性"

    patterns:
      - pattern: "math/rand\\."
        description: "math/rand (use crypto/rand for security)"
    safe_patterns:
      - "crypto/rand"
      - "rand\\.Read"

  - category: weak-encryption
    owasp: A04
    severity: HIGH

    description: |
      弱加密算法：使用DES、RC4或AES-ECB等不安全的加密方式。
      攻击者可以破解加密内容，获取敏感信息。

    detection:
      taint_sinks:
        - "des.NewCipher"
        - "rc4.NewCipher"
        - "aes.NewCipher.*ECB"

      steps:
        - "定位加密函数调用"
        - "识别加密算法和模式"
        - "判断是否为弱算法"
        - "评估破解风险"

      safety_conditions:
        - "使用AES-GCM"
        - "使用ChaCha20-Poly1305"
        - "不使用ECB模式"

    remediation:
      principle: "使用AES-GCM或ChaCha20-Poly1305等安全加密"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用AES-GCM模式"
        - "生成随机IV/Nonce"
        - "正确处理认证标签"

    patterns:
      - pattern: "des\\.NewCipher|rc4\\.NewCipher"
