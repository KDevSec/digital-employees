        - "检查是否使用HTTP而非HTTPS"
        - "检查是否传输敏感数据"
        - "判断是否可被窃听"

      safety_conditions:
        - "使用HTTPS"
        - "敏感数据加密后传输"
        - "验证TLS证书"

    remediation:
      principle: "敏感数据必须通过HTTPS传输"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用https://"
        - "配置TLS证书验证"
        - "禁用不安全的TLS版本"

    patterns:
      - pattern: "http://.*(password|token|secret|key|credential)"
        description: "Sensitive data over HTTP (not HTTPS)"
    safe_patterns:
      - "https://"
      - "tls\\."

  # ===== A05 - Injection (was A03 in 2021) =====
  - category: sql-injection
    owasp: A05
    severity: CRITICAL

    description: |
      SQL注入：用户输入直接拼接到SQL查询字符串。
      攻击者可以注入恶意SQL，读取、修改或删除数据库数据。

    detection:
      taint_sinks:
        - "fmt.Sprintf(.*SELECT"
        - "fmt.Sprintf(.*INSERT"
        - "fmt.Sprintf(.*UPDATE"
        - "fmt.Sprintf(.*DELETE"
        - "db.Exec(.*+"
        - "db.Query(.*+"

      steps:
        - "定位数据库查询操作"
        - "检查是否使用字符串拼接"
        - "追溯拼接内容的来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "使用参数化查询($1, ?)"
        - "使用ORM的安全方法"
        - "输入经过验证和转义"

    remediation:
      principle: "使用参数化查询，禁止字符串拼接SQL"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用$1, $2参数占位符"
        - "或使用sql.Named命名参数"
        - "移除字符串拼接"

    patterns:
      - pattern: "fmt\\.Sprintf\\(.*SELECT|fmt\\.Sprintf\\(.*INSERT|fmt\\.Sprintf\\(.*UPDATE|fmt\\.Sprintf\\(.*DELETE"
        description: "fmt.Sprintf in SQL query construction"
      - pattern: "db\\.Exec\\(.*\\+|db\\.Query\\(.*\\+"
        description: "String concatenation in database call"
    safe_patterns:
      - "db\\.Exec\\(.*\\$1|db\\.Query\\(.*\\$1"
      - "sql\\.Named"

  - category: command-injection
    owasp: A05
    severity: CRITICAL

    description: |
      命令注入：用户输入直接拼接到系统命令。
      攻击者可以注入任意命令，实现远程代码执行。

    detection:
      taint_sinks:
        - "exec.Command(.*+"
        - "exec.Command(.*fmt.Sprintf"
        - "exec.Command(\"sh\".*-c"

      steps:
        - "定位exec.Command调用"
        - "检查参数是否使用字符串拼接"
        - "追溯拼接内容的来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "参数作为独立参数传递"
        - "不使用shell执行"
        - "输入经过严格白名单验证"

    remediation:
      principle: "命令参数作为独立参数传递，禁止shell执行"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "参数单独传递，不拼接"
        - "禁止使用sh -c执行"
        - "使用白名单限制允许的命令"

    patterns:
      - pattern: "exec\\.Command\\(.*\\+|exec\\.Command\\(.*fmt\\.Sprintf"
        description: "exec.Command with string concatenation"
      - pattern: "exec\\.Command\\(\"sh\".*-c"
        description: "exec.Command with shell execution"
    safe_patterns:
      - "exec\\.Command\\("
      - "syscall\\.Exec"

  - category: template-injection
    owasp: A05
    severity: CRITICAL

    description: |
