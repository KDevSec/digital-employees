  - category: time-bomb
    owasp: SUPPLY-CHAIN-ATTACKS
    severity: HIGH

    description: |
      时间炸弹：代码中存在基于时间的触发逻辑，可能在特定日期或时间后执行恶意操作。
      包括time.Now日期比较、超长time.Sleep、time.AfterFunc超长回调、
      cron定时任务、crontab操作等模式。

    detection:
      taint_sinks:
        - "time.Now()"
        - "time.Sleep("
        - "time.AfterFunc("
        - "cron.AddFunc("
        - "os.StartProcess("
        - "exec.Command("

      steps:
        - "定位所有日期/时间比较操作"
        - "检查是否存在硬编码的日期或时间阈值"
        - "检查是否存在超长sleep或定时回调"
        - "检查时间条件后是否执行危险操作"
        - "检查是否存在cron定时任务或crontab操作"

      safety_conditions:
        - "时间比较用于正常的业务逻辑"
        - "sleep用于合理的等待场景"
        - "定时任务有明确的业务用途和注释"
        - "代码在测试文件中"

    remediation:
      principle: "移除时间炸弹逻辑，所有定时操作必须有明确的业务用途和审计日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "需要定时任务"
          use: "使用受监控的调度系统，添加审计日志"
        - scenario: "需要过期检查"
          use: "使用配置化的过期策略，添加告警机制"

      requirements:
        - "移除硬编码的日期/时间触发条件"
        - "所有定时操作必须可配置和可审计"
        - "禁止超长定时后执行危险操作"

    patterns:
      - pattern: "time\\.Now\\(\\)\\.After\\(time\\.Date\\("
        description: "Date comparison with hardcoded date - potential time bomb"
        confidence: 7
      - pattern: "time\\.Sleep\\(.*time\\.Hour\\s*\\*\\s*\\d{2,}"
        description: "Extremely long sleep (>24 hours) - potential time bomb delay"
        confidence: 8
      - pattern: "time\\.AfterFunc\\(.*time\\.Hour\\s*\\*\\s*\\d{2,}"
        description: "Extremely long delayed callback - potential time bomb"
        confidence: 8
      - pattern: "cron\\.(AddFunc|AddJob|Schedule)\\("
        description: "Cron job scheduling - check for malicious payloads"
        confidence: 5
      - pattern: "exec\\.Command\\(.*crontab"
        description: "Crontab manipulation via exec.Command - suspicious scheduled task"
        confidence: 8
      - pattern: "os\\.StartProcess\\(.*crontab"
        description: "Crontab manipulation via os.StartProcess - suspicious scheduled task"
        confidence: 8
      - pattern: "time\\.Now\\(\\).*exec\\.Command\\("
        description: "Time check followed by exec.Command - potential time bomb"
        confidence: 8
      - pattern: "time\\.Now\\(\\).*os\\.StartProcess\\("
        description: "Time check followed by StartProcess - potential time bomb"
        confidence: 8

    safe_patterns:
      - "test"
      - "testing"
      - "mock"
      - "time\\.Minute"
      - "time\\.Second"
      - "config"
      - "cache"
