      - pattern: "aes\\.NewCipher.*ECB|cipher\\.NewECB"
        description: "AES ECB mode"
    safe_patterns:
      - "aes\\.NewCipher.*GCM|cipher\\.NewGCM"

  - category: plaintext-transmission
    owasp: A04
    severity: HIGH

    description: |
      明文传输：敏感数据通过HTTP而非HTTPS传输。
      攻击者可以窃听网络流量，获取敏感信息。

    detection:
