# =====================================================
# Go 安全编码规范规则
# 来源：产品安全编码规范-Go V2.0.md
# 生成时间：2026-05-27
# 版本：2.1
# 说明：支持大模型上下文分析和修复方案生成
# =====================================================

language: go
file_extensions: [".go"]
version: "2.1"

# =====================================================
# 扫描输出格式要求（重要）
# =====================================================
# 发现漏洞后，必须按以下格式输出：
#
# ## 漏洞报告
#
# **漏洞类型**: [category名称]
# **OWASP分类**: [owasp编号]
# **严重级别**: [severity]
# **文件位置**: [文件名:行号]
#
# **漏洞描述**:
# [描述该漏洞的原理和危害]
#
# **漏洞代码**:
# ```go
# [原始漏洞代码]
# ```
#
# **数据流分析**:
# - 污点源: [用户输入来源]
# - 污点汇聚: [危险函数调用]
# - 数据流路径: [描述数据如何从源头流到汇聚点]
#
# **修复方案**:
#
# 修复原则: [简述修复原则]
#
# 修复后代码:
# ```go
# [根据原始代码生成的修复后代码，保持原有逻辑，只修复漏洞点]
# ```
#
# 修复说明: [解释修复代码的改动点]
#
# =====================================================

# 全局配置：用户输入源（污点源）
taint_sources:
  - name: "net/http请求"
    patterns:
      - "r.URL.Query()"
      - "r.URL.Query().Get("
      - "r.FormValue("
      - "r.Form.Get("
      - "r.PostFormValue("
      - "r.Body"
      - "r.Header.Get("
      - "r.Header"
      - "r.Cookie("
      - "r.Cookies()"
      - "r.URL.Path"
      - "r.URL.RawQuery"

  - name: "Gin框架请求"
    patterns:
      - "c.Query("
      - "c.PostForm("
      - "c.Param("
      - "c.GetQuery("
      - "c.GetPostForm("
      - "c.Bind("
      - "c.ShouldBind("
      - "c.JSON("
      - "c.GetHeader("
      - "c.Cookie("

  - name: "Echo框架请求"
    patterns:
      - "e.QueryParam("
      - "e.FormValue("
      - "e.Param("
      - "e.Bind("
      - "e.Request().Body"
      - "e.Request().Header"

  - name: "命令行参数"
    patterns:
      - "os.Args"
      - "flag."

  - name: "环境变量"
    patterns:
      - "os.Getenv("
      - "os.Environ("
      - "os.LookupEnv("

  - name: "文件读取"
    patterns:
      - "os.ReadFile("
      - "os.Open("
      - "io.ReadAll("
      - "ioutil.ReadFile("
      - "ioutil.ReadAll("

rules:
  # ===== A01 - Broken Access Control (2025: now includes SSRF) =====
  - category: missing-auth
    owasp: A01
    severity: CRITICAL

    description: |
      缺少认证检查：HTTP处理函数未添加认证中间件。
      攻击者可以绕过认证直接访问受保护资源，导致未授权访问。

    detection:
      taint_sinks:
        - "http.HandleFunc("
        - "http.Handle("
        - "mux.HandleFunc("
        - "router.HandleFunc("

      steps:
        - "定位HTTP处理函数注册"
        - "检查是否使用认证中间件包装"
        - "检查处理函数内部是否有认证检查"
        - "判断是否允许未认证访问"

      safety_conditions:
        - "使用认证中间件包装处理函数"
        - "处理函数内部有认证检查逻辑"
        - "路由配置包含认证要求"

    remediation:
      principle: "所有敏感端点必须经过认证中间件验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加认证中间件"
        - "验证JWT/Session有效性"
        - "拒绝未认证请求"

    patterns:
      - pattern: "http\\.HandleFunc\\(|http\\.Handle\\(|r\\.HandleFunc\\("
        description: "HTTP handler without auth middleware"
      - pattern: "mux\\.HandleFunc\\(|router\\.HandleFunc\\("
        description: "Router handler without auth middleware"
    safe_patterns:
      - "authMiddleware"
      - "RequireAuth"
      - "jwt\\.Parse"
      - "session\\.Check"

  - category: privilege-escalation
    owasp: A01
    severity: HIGH

    description: |
      权限提升风险：使用硬编码字符串比较进行权限检查。
      攻击者可能通过修改请求参数绕过权限检查，获取更高权限。

    detection:
      taint_sinks:
        - "role.*==.*\"admin\""
        - "Role.*==.*\"admin\""
        - "IsAdmin"
        - "isSuperuser"

      steps:
        - "定位权限检查代码"
        - "检查是否使用硬编码比较"
        - "判断权限数据来源是否可信"
        - "检查是否可被篡改"

      safety_conditions:
        - "使用权限检查函数而非直接比较"
        - "权限数据来自可信源"
        - "权限检查不可绕过"

    remediation:
      principle: "使用权限检查函数进行细粒度权限验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用HasPermission/CheckPermission函数"
        - "权限检查基于用户ID和资源ID"
        - "拒绝权限不足的请求"

    patterns:
      - pattern: "role.*==.*\"admin\"|Role.*==.*\"admin\""
        description: "Hardcoded role string comparison"
      - pattern: "IsAdmin|isSuperuser"
        description: "Boolean flag check for admin access"
    safe_patterns:
      - "HasPermission"
      - "CheckPermission"

  - category: insecure-direct-object-reference
    owasp: A01
    severity: HIGH

    description: |
      不安全的直接对象引用：使用用户可控的ID直接访问数据库对象。
      攻击者可以通过修改ID访问其他用户的数据，导致水平越权。

    detection:
      taint_sinks:
        - "db.Find("
        - "db.First("
        - "r.URL.Query().Get(\"id\")"

      steps:
        - "定位数据库查询操作"
        - "检查查询参数是否来自用户输入"
        - "检查是否有所有权验证"
        - "判断是否可访问他人数据"

      safety_conditions:
        - "验证当前用户对资源的所有权"
        - "使用CheckOwnership函数"
        - "查询条件包含用户ID限制"

    remediation:
      principle: "验证当前用户对请求资源的所有权"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加所有权检查"
        - "查询条件包含currentUser限制"
        - "拒绝访问他人资源"

    patterns:
      - pattern: "db\\.Find\\(.*r\\.URL\\.Query|db\\.First\\(.*r\\.URL\\.Query"
        description: "GORM lookup with user-controlled ID without ownership check"
      - pattern: "r\\.URL\\.Query\\.Get\\(\"id\"\\)"
        description: "Direct object reference via query parameter"
    safe_patterns:
      - "currentUser"
      - "owner"
      - "CheckOwnership"

  - category: ssrf-url
    owasp: A01
    severity: HIGH

    description: |
      服务端请求伪造(SSRF)：使用用户可控的URL发起服务端请求。
      攻击者可以访问内部服务、云元数据端点、导致信息泄露或RCE。

    detection:
      taint_sinks:
        - "http.Get("
        - "http.Post("
        - "http.NewRequest("

      steps:
        - "定位HTTP客户端请求"
        - "检查URL参数是否来自用户输入"
        - "检查是否有URL验证"
        - "判断是否可访问内网"

      safety_conditions:
        - "URL经过白名单验证"
        - "禁止访问内网IP"
        - "使用AllowedDomains限制"

    remediation:
      principle: "验证并限制用户可控的请求URL，禁止访问内网资源"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用URL白名单验证"
        - "禁止私有IP地址访问"
        - "解析URL后验证主机名"

    patterns:
      - pattern: "http\\.Get\\(.*r\\.|http\\.Post\\(.*r\\."
        description: "net/http request with user-controlled URL"
      - pattern: "http\\.NewRequest\\(.*r\\."
        description: "http.NewRequest with user-controlled URL"
    safe_patterns:
      - "ValidateURL"
      - "AllowedDomains"
      - "url\\.Parse"

  - category: ssrf-dns
    owasp: A01
    severity: MEDIUM

    description: |
      DNS重绑定攻击：使用用户输入进行DNS解析。
      攻击者可以通过DNS重绑定绕过IP检查，访问内网服务。

    detection:
      taint_sinks:
        - "net.LookupHost("
        - "net.LookupIP("
        - "net.LookupAddr("

      steps:
        - "定位DNS解析调用"
        - "检查主机名是否来自用户输入"
        - "检查解析结果是否再次验证"
        - "判断是否存在TOCTOU问题"

      safety_conditions:
        - "主机名经过白名单验证"
        - "解析后再次验证IP地址"
        - "使用AllowedHosts限制"

    remediation:
      principle: "验证主机名并检查解析结果，防止DNS重绑定"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用主机名白名单"
        - "解析后验证IP是否为私有地址"
        - "禁用DNS缓存或设置短TTL"

    patterns:
      - pattern: "net\\.LookupHost\\(.*r\\.|net\\.LookupIP\\(.*r\\."
        description: "DNS resolution with user input"
    safe_patterns:
      - "ValidateHostname"
      - "AllowedHosts"

  # ===== A02 - Security Misconfiguration (was A05 in 2021) =====
  - category: default-credentials
    owasp: A02
    severity: HIGH

    description: |
      默认凭据：代码中硬编码默认密码或使用弱默认凭据。
      攻击者可以使用已知默认凭据登录系统，获取未授权访问。

    detection:
      taint_sinks:
        - "password.*=.*\"admin\""
        - "password.*=.*\"123456\""
        - "password.*=.*\"password\""

      steps:
        - "扫描代码中的密码赋值"
        - "检查是否为硬编码字符串"
        - "检查是否为常见弱密码"
        - "判断是否可从外部获取"

      safety_conditions:
        - "密码从环境变量读取"
        - "密码从配置文件读取"
        - "密码不为常见弱密码"

    remediation:
      principle: "凭据必须从环境变量或安全配置源读取"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用os.Getenv读取凭据"
        - "禁止硬编码密码"
        - "首次运行强制修改默认密码"

    patterns:
      - pattern: "password.*=.*\"admin\"|password.*=.*\"123456\"|password.*=.*\"password\""
        description: "Default/hardcoded password"
    safe_patterns:
      - "os\\.Getenv"
      - "viper\\.Get"

  - category: verbose-errors
    owasp: A02
    severity: MEDIUM

    description: |
      详细错误信息泄露：将错误详情直接返回给用户。
      攻击者可以从错误信息中获取系统内部信息，辅助进一步攻击。

    detection:
      taint_sinks:
        - "fmt.Fprintf(.*err.Error()"
        - "json.Marshal(.*err"
        - "w.Write(.*err.Error()"

      steps:
        - "定位错误处理代码"
        - "检查错误信息是否返回给用户"
        - "检查是否包含堆栈信息"
        - "判断是否泄露敏感信息"

      safety_conditions:
        - "错误信息记录到日志"
        - "返回通用错误消息"
        - "不返回堆栈信息"

    remediation:
      principle: "错误详情记录到日志，返回通用错误消息给用户"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用log/slog记录错误详情"
        - "返回通用错误消息"
        - "区分用户错误和系统错误"

    patterns:
      - pattern: "fmt\\.Fprintf\\(.*err\\.Error|json\\.Marshal\\(.*err"
        description: "Error details exposed in response"
    safe_patterns:
      - "log\\."
      - "slog\\."

  - category: cors-wildcard
    owasp: A02
    severity: MEDIUM

    description: |
      CORS通配符配置：Access-Control-Allow-Origin设置为通配符*。
      允许任意源访问API，可能导致跨站请求伪造或数据泄露。

    detection:
      taint_sinks:
        - "AllowOrigins.*\\*"
        - "Access-Control-Allow-Origin.*\\*"

      steps:
        - "定位CORS配置"
        - "检查AllowOrigins是否为*"
        - "检查是否区分公开和私有API"
        - "判断是否需要凭证支持"

      safety_conditions:
        - "AllowOrigins明确指定域名"
        - "不使用通配符*"
        - "需要凭证时不使用通配符"

    remediation:
      principle: "明确指定允许的源，不使用通配符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "列出允许的域名列表"
        - "动态验证Origin头"
        - "需要凭证时禁止通配符"

    patterns:
      - pattern: "AllowOrigins.*\\*|Access-Control-Allow-Origin.*\\*"
        description: "CORS wildcard origin"
    safe_patterns:
      - "AllowedOrigins"
      - "AllowOrigins"

  - category: debug-enabled
    owasp: A02
    severity: HIGH

    description: |
      调试模式启用：生产环境启用调试功能或暴露调试端点。
      攻击者可以获取敏感信息、执行调试操作、访问pprof端点。

    detection:
      taint_sinks:
        - "pprof"
        - "net/http/pprof"
        - "gin.SetMode(gin.DebugMode)"

      steps:
        - "定位调试相关配置"
        - "检查是否在生产环境启用"
        - "检查pprof端点是否暴露"
        - "判断是否可外部访问"

      safety_conditions:
        - "生产环境禁用调试模式"
        - "pprof端点仅限本地访问"
        - "使用gin.ReleaseMode"

    remediation:
      principle: "生产环境禁用调试功能和端点"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用gin.ReleaseMode"
        - "移除或保护pprof端点"
        - "通过环境变量控制调试模式"

    patterns:
      - pattern: "pprof|net/http/pprof"
        description: "Go pprof debug endpoint exposed"
      - pattern: "gin\\.SetMode\\(gin\\.DebugMode\\)"
        description: "Gin debug mode"
    safe_patterns:
      - "gin\\.ReleaseMode"
      - "production"

  - category: unnecessary-features
    owasp: A02
    severity: MEDIUM

    description: |
      不必要功能启用：生产环境暴露API文档或调试接口。
      攻击者可以从文档获取API结构、参数信息，辅助攻击。

    detection:
      taint_sinks:
        - "swagger"
        - "redoc"
        - "api-docs"

      steps:
        - "定位API文档相关配置"
        - "检查是否在生产环境启用"
        - "检查是否需要认证保护"
        - "判断是否暴露敏感信息"

      safety_conditions:
        - "生产环境禁用API文档"
        - "文档端点需要认证"
        - "文档不包含敏感信息"

    remediation:
      principle: "生产环境禁用或保护API文档端点"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "通过环境变量控制文档启用"
        - "文档端点添加认证保护"
        - "移除敏感API文档"

    patterns:
      - pattern: "swagger|redoc|api-docs"
        description: "API documentation endpoint exposed"
    safe_patterns:
      - "production"
      - "disabled"

  # ===== A03 - Supply Chain Failures (was A06 in 2021) =====
  - category: known-vulnerability
    owasp: A03
    severity: HIGH

    description: |
      已知漏洞依赖：使用已知存在安全漏洞的依赖版本。
      攻击者可以利用已知漏洞进行攻击，可能导致RCE。

    detection:
      taint_sinks:
        - "golang.org/x/crypto.*0.0"
        - "go.mod版本检查"

      steps:
        - "检查go.mod依赖版本"
        - "对比已知漏洞数据库"
        - "识别过时或漏洞版本"
        - "判断是否有安全更新"

      safety_conditions:
        - "依赖版本为最新稳定版"
        - "依赖无已知漏洞"
        - "定期更新依赖"

    remediation:
      principle: "更新依赖到安全版本，定期检查漏洞公告"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "更新依赖到安全版本"
        - "使用govulncheck检查"
        - "定期更新和审计依赖"

    patterns:
      - pattern: "golang\\.org/x/crypto.*0\\.0"
        description: "Potentially outdated crypto package"
    safe_patterns:
      - "latest"

  - category: outdated-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      过时依赖：使用过时的Go模块版本。
      可能缺少安全修复，存在已知漏洞风险。

    detection:
      taint_sinks:
        - "go.mod.*v0\\.[0-3]\\."

      steps:
        - "检查go.mod依赖版本"
        - "对比最新稳定版本"
        - "识别过时版本"
        - "评估更新风险"

      safety_conditions:
        - "依赖版本接近最新"
        - "无重大版本落后"
        - "定期更新策略"

    remediation:
      principle: "定期更新依赖，保持与最新稳定版本接近"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "更新依赖到较新版本"
        - "测试兼容性"
        - "建立定期更新流程"

    patterns:
      - pattern: "go\\.mod.*v0\\.[0-3]\\."
        description: "Potentially outdated Go module version"
    safe_patterns:
      - "latest"

  - category: insecure-pipeline
    owasp: A03
    severity: HIGH

    description: |
      不安全CI/CD管道：在构建过程中下载依赖未验证。
      攻击者可以劫持依赖源，注入恶意代码。

    detection:
      taint_sinks:
        - "exec.Command(.*go.*get"
        - "exec.Command(.*curl"

      steps:
