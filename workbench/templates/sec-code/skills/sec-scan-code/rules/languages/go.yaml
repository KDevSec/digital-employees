  # ===== A06 - Insecure Design (was A04 in 2021) =====
  - category: missing-rate-limit
    owasp: A06
    severity: HIGH

    description: |
      缺少速率限制：敏感端点未实施速率限制。
      攻击者可以进行暴力破解、枚举攻击或资源耗尽。

    detection:
      taint_sinks:
        - "http.HandleFunc.*login"
        - "router.POST.*login"
        - "http.HandleFunc.*auth"

      steps:
        - "定位登录或认证端点"
        - "检查是否有速率限制中间件"
        - "检查是否有IP限制"
        - "判断是否可暴力破解"

      safety_conditions:
        - "使用速率限制中间件"
        - "基于IP和用户限制"
        - "限制失败次数"

    remediation:
      principle: "敏感端点必须实施速率限制"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加速率限制中间件"
        - "基于IP和用户ID限制"
        - "设置合理的限制阈值"

    patterns:
      - pattern: "http\\.HandleFunc.*login|router\\.POST.*login"
        description: "Login endpoint without rate limiting"
    safe_patterns:
      - "ratelimit"
      - "throttle"
      - "limiter"

  - category: missing-lockout
    owasp: A06
    severity: HIGH

    description: |
      缺少账户锁定：密码验证失败后未实施账户锁定。
      攻击者可以进行在线暴力破解攻击。

    detection:
      taint_sinks:
        - "CheckPassword"
        - "VerifyPassword"
        - "Authenticate"

      steps:
        - "定位密码验证函数"
        - "检查是否有失败计数"
        - "检查是否有锁定机制"
        - "判断是否可无限尝试"

      safety_conditions:
        - "失败次数达到阈值后锁定"
        - "锁定时间逐渐增加"
        - "记录失败日志"

    remediation:
      principle: "实施账户锁定机制，限制失败尝试次数"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "记录失败次数"
        - "达到阈值后锁定账户"
        - "设置锁定时间"

    patterns:
      - pattern: "CheckPassword|VerifyPassword|Authenticate"
        description: "Password verification without attempt counting"
    safe_patterns:
      - "lockout"
      - "MAX_ATTEMPTS"

  - category: business-logic-flaw
    owasp: A06
    severity: HIGH

    description: |
      业务逻辑缺陷：价格、金额等业务参数来自用户输入且未验证。
      攻击者可以修改业务参数，造成经济损失。

    detection:
      taint_sinks:
        - "price.*=.*r\\."
        - "amount.*=.*r\\."
        - "discount.*=.*r\\."

      steps:
        - "定位业务参数赋值"
        - "检查是否来自用户输入"
        - "检查是否有范围验证"
        - "判断是否可被篡改"

      safety_conditions:
        - "业务参数从服务端获取"
        - "输入经过范围验证"
        - "敏感操作二次确认"

    remediation:
      principle: "业务参数必须从服务端获取或严格验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "价格从数据库获取"
        - "输入范围验证"
        - "添加业务一致性检查"

    patterns:
      - pattern: "price.*=.*r\\.|amount.*=.*r\\.|discount.*=.*r\\."
        description: "Price/amount/discount from request without validation"
    safe_patterns:
      - "Validate"
      - "Min"
      - "Max"

  - category: trust-boundary-violation
    owasp: A06
    severity: HIGH

    description: |
      信任边界违反：用户输入直接存入会话或上下文。
      攻击者可以注入恶意数据，污染信任存储。

    detection:
      taint_sinks:
        - "session[.*r\\."
        - "session.Set(.*r\\."
        - "context.Set(.*r\\."

      steps:
        - "定位会话或上下文写入"
        - "检查写入值是否来自用户输入"
        - "检查是否经过验证"
        - "判断是否污染信任存储"

      safety_conditions:
        - "写入前验证输入"
        - "区分信任和非信任数据"
        - "使用类型断言"

    remediation:
      principle: "用户输入存入会话前必须验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证输入格式和范围"
        - "使用类型断言"
        - "区分信任级别"

    patterns:
      - pattern: "session\\[.*r\\.|session\\.Set\\(.*r\\."
        description: "Session data from request without validation"
    safe_patterns:
      - "Validate"
      - "Sanitize"

  # ===== A07 - Identification and Authentication Failures =====
  - category: weak-password
    owasp: A07
    severity: MEDIUM

    description: |
      弱密码策略：密码长度或复杂度要求过低。
      攻击者可以更容易进行离线暴力破解。

    detection:
      taint_sinks:
        - "len(.*password.*)\\s*<\\s*[1-6]"

      steps:
        - "定位密码长度检查"
        - "检查最小长度要求"
        - "检查复杂度要求"
        - "评估破解难度"

      safety_conditions:
        - "最小长度 >= 8"
        - "要求复杂度"
        - "使用强哈希存储"

    remediation:
      principle: "实施强密码策略，最小8位且包含多种字符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "最小长度 >= 8"
        - "包含大小写、数字、特殊字符"
        - "使用bcrypt/argon2存储"

    patterns:
      - pattern: "len\\(.*password.*\\)\\s*<\\s*[1-6]"
        description: "Weak password length check"
    safe_patterns:
      - "bcrypt"
      - "argon2"
      - "scrypt"

  - category: broken-session
    owasp: A07
    severity: HIGH

    description: |
      会话管理缺陷：会话配置不安全或会话数据未验证。
      攻击者可以劫持会话或注入恶意会话数据。

    detection:
      taint_sinks:
        - "session.Set(.*r\\."
        - "session.Values[.*\\]\\s*=\\s*r\\."
        - "cookie.HttpOnly.*false"
        - "cookie.Secure.*false"

      steps:
        - "定位会话配置和操作"
        - "检查Cookie安全属性"
        - "检查会话数据来源"
        - "判断是否可劫持"

      safety_conditions:
        - "HttpOnly = true"
        - "Secure = true"
        - "会话数据经过验证"

    remediation:
      principle: "正确配置会话Cookie属性，验证会话数据"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "设置HttpOnly=true"
        - "设置Secure=true"
        - "验证会话数据来源"

    patterns:
      - pattern: "session\\.Set\\(.*r\\.|session\\.Values\\[.*\\]\\s*=\\s*r\\."
        description: "Session data from request without validation"
      - pattern: "cookie\\.HttpOnly.*false|cookie\\.Secure.*false"
        description: "Insecure cookie settings"
    safe_patterns:
      - "Validate"
      - "cookie\\.Secure.*true"

  - category: credential-exposure
    owasp: A07
    severity: HIGH

    description: |
      凭据暴露：密码等凭据被记录到日志或输出。
      攻击者可以从日志获取凭据信息。

    detection:
      taint_sinks:
        - "log\\..*password"
        - "fmt\\.Print.*password"
        - "slog\\..*password"

      steps:
        - "定位日志或输出语句"
        - "检查是否包含凭据变量"
        - "判断是否泄露敏感信息"
        - "检查日志存储位置"

      safety_conditions:
        - "凭据不记录到日志"
        - "使用脱敏处理"
        - "日志访问控制"

    remediation:
      principle: "凭据不得记录到日志，必须脱敏处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除凭据日志"
        - "使用脱敏函数"
        - "用占位符替代"

    patterns:
      - pattern: "log\\..*password|fmt\\.Print.*password"
        description: "Password in log/output"
    safe_patterns:
      - "sanitize"
      - "mask"

  - category: missing-mfa
    owasp: A07
    severity: MEDIUM

    description: |
      缺少多因素认证：仅使用密码认证。
      攻击者获取密码后可直接登录。

    detection:
      taint_sinks:
        - "Login.*password"
        - "Authenticate.*password"

      steps:
        - "定位登录认证函数"
        - "检查是否有多因素认证"
        - "判断敏感操作是否需要MFA"
        - "评估账户被盗风险"

      safety_conditions:
        - "支持TOTP/WebAuthn"
        - "敏感操作需要MFA"
        - "新设备登录需要MFA"

    remediation:
      principle: "敏感账户和操作应启用多因素认证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "集成TOTP认证"
        - "敏感操作验证MFA"
        - "提供MFA设置选项"

    patterns:
      - pattern: "Login.*password|Authenticate.*password"
        description: "Login with only password, no MFA"
    safe_patterns:
      - "mfa"
      - "totp"
      - "VerifyCode"

  # ===== A08 - Software and Data Integrity Failures =====
  - category: insecure-deserialization
    owasp: A08
    severity: CRITICAL

    description: |
      不安全反序列化：使用gob等不安全的反序列化处理用户输入。
      攻击者可以注入恶意对象，实现远程代码执行。

    detection:
      taint_sinks:
        - "gob.NewDecoder(.*request"
        - "gob.Decode(.*request"
        - "json.Unmarshal(.*interface\\{\\}"

      steps:
        - "定位反序列化调用"
        - "检查数据来源是否为用户输入"
        - "检查是否限制反序列化类型"
        - "判断是否可注入恶意对象"

      safety_conditions:
        - "反序列化到具体结构体"
        - "使用json而非gob"
        - "限制可反序列化的类型"

    remediation:
      principle: "反序列化到具体结构体，避免使用gob处理用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "反序列化到具体struct"
        - "使用json替代gob"
        - "验证反序列化结果"

    patterns:
      - pattern: "gob\\.NewDecoder\\(.*request|gob\\.Decode\\(.*request"
        description: "gob deserialization with user input — RCE risk"
      - pattern: "json\\.Unmarshal\\(.*interface\\{\\}"
        description: "JSON unmarshal into empty interface"
    safe_patterns:
      - "json\\.Unmarshal\\(.*struct"
      - "json\\.Decoder"

  - category: unsigned-update
    owasp: A08
    severity: HIGH

    description: |
      未签名更新：下载更新未验证签名或校验和。
      攻击者可以劫持下载源，注入恶意代码。

    detection:
      taint_sinks:
        - "http.Get(.*download"
        - "http.NewRequest(.*download"

      steps:
        - "定位下载操作"
        - "检查是否有签名验证"
        - "检查是否有校验和验证"
        - "判断是否可被篡改"

      safety_conditions:
        - "验证数字签名"
        - "验证SHA256校验和"
        - "使用HTTPS下载"

    remediation:
      principle: "下载内容必须验证签名或校验和"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证SHA256校验和"
        - "验证数字签名"
        - "使用可信下载源"

    patterns:
      - pattern: "http\\.Get\\(.*download|http\\.NewRequest\\(.*download"
        description: "Download without integrity verification"
    safe_patterns:
      - "sha256"
      - "checksum"
      - "VerifySignature"

  - category: insecure-cicd
    owasp: A08
    severity: HIGH

    description: |
      不安全CI/CD：CI/CD管道中执行未验证的外部命令。
      攻击者可以劫持依赖源，注入恶意代码。

    detection:
      taint_sinks:
        - "exec.Command(.*go.*get"
        - "exec.Command(.*git.*clone"

      steps:
        - "定位CI/CD脚本中的外部命令"
        - "检查是否验证来源"
        - "检查是否使用签名验证"
        - "判断是否可被劫持"

      safety_conditions:
        - "验证依赖签名"
        - "使用私有仓库"
        - "限制执行权限"

    remediation:
      principle: "CI/CD中验证所有外部内容的完整性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用go mod verify"
        - "验证git提交签名"
        - "限制网络访问"

    patterns:
      - pattern: "exec\\.Command\\(.*go.*get|exec\\.Command\\(.*git.*clone"
        description: "CI/CD running go get/git clone without verification"
    safe_patterns:
      - "verify"
      - "checksum"

  - category: integrity-missing
    owasp: A08
    severity: MEDIUM

    description: |
      缺少完整性检查：写入下载内容未验证完整性。
      下载内容可能被篡改。

    detection:
      taint_sinks:
        - "os.Create(.*http"
        - "os.WriteFile(.*download"

      steps:
        - "定位文件写入操作"
        - "检查写入内容来源"
        - "检查是否有完整性验证"
        - "判断是否可被篡改"

      safety_conditions:
        - "验证SHA256校验和"
        - "验证数字签名"
        - "使用HTTPS"

    remediation:
      principle: "写入外部内容前验证完整性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "计算并验证SHA256"
        - "与预期值比较"
        - "验证失败则丢弃"

    patterns:
      - pattern: "os\\.Create\\(.*http|os\\.WriteFile\\(.*download"
        description: "Writing downloaded content without hash check"
    safe_patterns:
      - "sha256"
      - "checksum"

  # ===== A09 - Security Logging and Monitoring Failures =====
  - category: missing-logging
    owasp: A09
    severity: MEDIUM

    description: |
      缺少日志记录：错误发生时未记录日志。
      攻击行为难以检测和审计。

    detection:
      taint_sinks:
        - "if err != nil \\{\\s*return"

      steps:
        - "定位错误处理代码"
        - "检查是否有日志记录"
        - "检查是否静默返回"
        - "判断是否影响审计"

      safety_conditions:
        - "错误记录到日志"
        - "使用结构化日志"
        - "包含上下文信息"

    remediation:
      principle: "所有错误必须记录到日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用log/slog记录错误"
        - "包含错误上下文"
        - "区分错误级别"

    patterns:
      - pattern: "if err != nil \\{\\s*return"
        description: "Error returned without logging"
    safe_patterns:
      - "log\\."
      - "slog\\."

  - category: sensitive-in-log
    owasp: A09
    severity: MEDIUM

    description: |
      日志中敏感信息：密码等敏感信息被记录到日志。
      攻击者可以从日志获取敏感信息。

    detection:
      taint_sinks:
        - "log\\..*password"
        - "slog\\..*password"
        - "fmt\\.Print.*password"

      steps:
        - "定位日志语句"
        - "检查是否包含敏感字段"
        - "判断是否泄露敏感信息"
        - "检查日志访问控制"

      safety_conditions:
        - "敏感信息不记录"
        - "使用脱敏处理"
        - "日志访问控制"

    remediation:
      principle: "敏感信息不得记录到日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感字段日志"
        - "使用脱敏函数"
        - "用占位符替代"

    patterns:
      - pattern: "log\\..*password|slog\\..*password|fmt\\.Print.*password"
        description: "Password in log output"
    safe_patterns:
      - "sanitize"
      - "mask"

  - category: missing-alert
    owasp: A09
    severity: MEDIUM

    description: |
      缺少告警：安全事件发生时未触发告警。
      攻击行为无法及时发现和响应。

    detection:
      taint_sinks:
        - "login.*fail"
        - "authenticate.*fail"
        - "Unauthorized"

      steps:
        - "定位安全事件处理"
        - "检查是否有告警机制"
        - "检查是否记录安全日志"
        - "判断响应时效"

      safety_conditions:
        - "安全事件触发告警"
        - "发送到SIEM"
        - "设置告警阈值"

    remediation:
      principle: "安全事件必须触发告警"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加告警通知"
        - "集成SIEM"
        - "设置告警规则"

    patterns:
      - pattern: "login.*fail|authenticate.*fail|Unauthorized"
        description: "Failed login without alerting"
    safe_patterns:
      - "alert"
      - "notify"

  - category: log-injection
    owasp: A09
    severity: MEDIUM

    description: |
      日志注入：用户输入直接写入日志。
      攻击者可以注入伪造日志条目，掩盖攻击痕迹。

    detection:
      taint_sinks:
        - "log\\..*\\+.*r\\."
        - "slog\\..*r\\.URL"

      steps:
        - "定位日志语句"
        - "检查是否包含用户输入"
        - "检查是否经过转义"
        - "判断是否可注入换行"

      safety_conditions:
        - "用户输入经过转义"
        - "使用结构化日志"
        - "过滤换行符"

    remediation:
      principle: "用户输入写入日志前必须转义"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "转义换行符"
        - "使用结构化日志"
        - "限制日志长度"

    patterns:
      - pattern: "log\\..*\\+.*r\\.|slog\\..*r\\.URL"
        description: "User input in log without sanitization"
    safe_patterns:
      - "sanitize"
      - "validate_input"

  # ===== A10 - Mishandling of Exceptional Conditions (NEW in 2025) =====
  - category: empty-catch
    owasp: A10
    severity: HIGH

    description: |
      空错误处理：错误被静默忽略。
      异常情况未处理，可能导致数据不一致或安全问题。

    detection:
      taint_sinks:
        - "if err != nil \\{\\s*\\}"
        - "defer func\\(\\) \\{.*recover\\(\\).*\\}"

      steps:
        - "定位错误处理代码"
        - "检查是否为空处理"
        - "检查recover是否有处理"
        - "判断是否掩盖问题"

      safety_conditions:
        - "错误记录到日志"
        - "错误向上传递"
        - "recover有处理逻辑"

    remediation:
      principle: "所有错误必须处理，至少记录日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "记录错误日志"
        - "或向上返回错误"
        - "recover后记录panic"

    patterns:
      - pattern: "if err != nil \\{\\s*\\}"
        description: "Empty error handler — error silently swallowed"
      - pattern: "defer func\\(\\) \\{.*recover\\(\\).*\\}"
        description: "Panic recovery without logging"
    safe_patterns:
      - "log\\."
      - "slog\\."
      - "return err"

  - category: broad-exception
    owasp: A10
    severity: MEDIUM

    description: |
      过宽异常捕获：recover捕获所有panic。
      可能掩盖特定问题，难以诊断。

    detection:
      taint_sinks:
        - "recover\\(\\)"

      steps:
        - "定位recover调用"
        - "检查是否有类型判断"
        - "检查是否有日志记录"
        - "判断是否掩盖问题"

      safety_conditions:
        - "区分panic类型"
        - "记录panic详情"
        - "特定panic特定处理"

    remediation:
      principle: "区分处理不同类型的panic"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "判断panic类型"
        - "记录panic详情"
        - "区分处理策略"

    patterns:
      - pattern: "recover\\(\\)"
        description: "Recover catches all panics — may mask specific issues"
    safe_patterns:
      - "recover\\(\\).*if.*err"
      - "specific error check"

  - category: unhandled-edge-case
    owasp: A10
    severity: MEDIUM

    description: |
      未处理边界情况：用户输入用于数组索引或类型转换未检查。
      可能导致panic或越界访问。

    detection:
      taint_sinks:
        - "strconv.Atoi(.*r\\."
        - "strconv.ParseInt(.*r\\."
        - "\\[.*r\\.URL\\.Query"

      steps:
        - "定位类型转换或索引操作"
        - "检查是否有错误检查"
        - "检查是否有边界检查"
        - "判断是否可panic"

      safety_conditions:
        - "检查转换错误"
        - "检查索引边界"
        - "有默认值处理"

    remediation:
      principle: "用户输入操作必须检查错误和边界"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
