  # ===== SUPPLY-CHAIN-ATTACKS - Time Bomb =====
  - category: time-bomb
    owasp: SUPPLY-CHAIN-ATTACKS
    severity: HIGH

    description: |
      时间炸弹：代码中存在基于时间的触发逻辑，可能在特定日期或时间后执行恶意操作。
      包括时间戳比较、超长setTimeout/setInterval、cron定时任务、
      node-cron/node-schedule定时任务库等模式。

    detection:
      taint_sinks:
        - "new Date().getTime()"
        - "Date.now()"
        - "setTimeout("
        - "setInterval("
        - "cron.schedule("
        - "schedule.scheduleJob("

      steps:
        - "定位所有日期/时间比较操作"
        - "检查是否存在硬编码的时间戳阈值"
        - "检查是否存在超长setTimeout/setInterval"
        - "检查时间条件后是否执行危险操作"
        - "检查是否存在可疑的cron定时任务"

      safety_conditions:
        - "时间比较用于正常的业务逻辑（如缓存过期）"
        - "setTimeout/setInterval用于合理的定时任务"
        - "cron任务有明确的业务用途和注释"
        - "代码在测试文件中"

    remediation:
      principle: "移除时间炸弹逻辑，所有定时操作必须有明确的业务用途和审计日志"

