      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用os.path.normpath规范化"
        - "验证路径在预期目录内"

    patterns:
      - pattern: "open\\(.*request|open\\(.*input"
        description: "File open with user-controlled path"
      - pattern: "send_file\\(.*request|send_from_directory\\(.*request"
