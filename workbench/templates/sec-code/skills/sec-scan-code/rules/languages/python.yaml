language: python
file_extensions: [".py", ".pyw"]
version: "3.1"

# =====================================================
# 扫描输出格式要求（重要）
# =====================================================
# 发现漏洞后，必须按以下格式输出：
#
# ## 漏洞报告
#
# **漏洞类型**: [category名称]
# **OWASP分类**: [owasp编号]
# **严重级别**: [severity]
# **文件位置**: [文件名:行号]
#
# **漏洞描述**:
# [描述该漏洞的原理和危害]
#
# **漏洞代码**:
# ```python
# [原始漏洞代码]
# ```
#
# **数据流分析**:
# - 污点源: [用户输入来源]
# - 污点汇聚: [危险函数调用]
# - 数据流路径: [描述数据如何从源头流到汇聚点]
#
# **修复方案**:
#
# 修复原则: [简述修复原则]
#
# 修复后代码:
# ```python
# [根据原始代码生成的修复后代码，保持原有逻辑，只修复漏洞点]
# ```
#
# 修复说明: [解释修复代码的改动点]
#
# =====================================================

# 全局配置：用户输入源（污点源）
taint_sources:
  - name: "Flask请求"
    patterns:
      - "request.args"
      - "request.form"
      - "request.json"
      - "request.data"
      - "request.values"
      - "request.files"
      - "request.cookies"
      - "request.headers"

  - name: "Django请求"
    patterns:
      - "request.GET"
      - "request.POST"
      - "request.body"
      - "request.META"
      - "request.COOKIES"

  - name: "FastAPI请求"
    patterns:
      - "Request."
      - "Form("
      - "Query("
      - "Path("
      - "Body("
      - "Header("
      - "Cookie("

  - name: "标准输入"
    patterns:
      - "input("
      - "sys.argv"
      - "sys.stdin"

  - name: "环境变量"
    patterns:
      - "os.environ"
      - "os.getenv("

  - name: "文件读取"
    patterns:
      - ".read("
      - ".readlines("
      - "open("

  - name: "HTTP请求路径"
    patterns:
      - "self.path"
      - "urlparse"
      - "path.split"
      - "path.split(\"/\")"

  - name: "HTTP请求体"
    patterns:
      - "self.rfile"
      - "self._read_body"
      - "rfile.read"

rules:
  # ===== A01 - Broken Access Control =====
  - category: missing-auth
    owasp: A01
    severity: CRITICAL

    description: |
      缺少认证：路由或视图函数未添加认证装饰器。
      未授权用户可以访问受限资源或执行敏感操作。

    detection:
      taint_sinks:
        - "@app.route("
        - "@app.get("
        - "@app.post("
        - "@router.get("
        - "@router.post("
        - "def get_"
        - "def post_"
        - "class.*Handler"
        - "do_GET"
        - "do_POST"
        - "do_PUT"
        - "do_DELETE"
        - "do_PATCH"

      steps:
        - "定位路由装饰器和视图函数"
        - "检查是否有认证装饰器"
        - "判断是否需要认证保护"

      safety_conditions:
        - "有 @login_required 装饰器"
        - "有 Depends() 认证检查"
        - "有 permission_required 装饰器"
        - "有 _check_auth 方法"
        - "有 require_auth 装饰器"

    remediation:
      principle: "为敏感路由添加认证装饰器"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "Flask路由"
          use: "添加 @login_required 装饰器"

        - scenario: "FastAPI路由"
          use: "添加 Depends(get_current_user) 依赖"

        - scenario: "Django视图"
          use: "添加 @login_required 装饰器或 LoginRequiredMixin"

        - scenario: "原生HTTP服务器"
          use: "在 do_GET/do_POST 开始处添加认证检查方法"

      requirements:
        - "添加认证装饰器"
        - "验证用户身份"
        - "检查用户权限"

    patterns:
      - pattern: "@app\\.(route|get|post|put|delete|patch)\\("
        description: "Flask route without @login_required or auth decorator"
      - pattern: "@router\\.(get|post|put|delete|patch)\\("
        description: "FastAPI route without Depends() auth check"
      - pattern: "def (get|post|put|delete|patch)_.*\\(.*request"
        description: "Django view without @login_required"
      - pattern: "def do_(GET|POST|PUT|DELETE|PATCH)\\(self"
        description: "HTTP handler method without authentication check"
      - pattern: "class.*Handler.*BaseHTTPRequestHandler"
        description: "HTTP request handler class - check for auth"

    safe_patterns:
      - "@login_required"
      - "Depends\\(.*auth"
      - "require_auth"
      - "permission_required"
      - "_check_auth"
      - "current_user"
      - "validate_token"
      - "verify_token"

  - category: privilege-escalation
    owasp: A01
    severity: HIGH

    description: |
      权限提升：使用硬编码的字符串或布尔值进行权限判断。
      攻击者可以通过修改请求或会话数据绕过权限检查。

    detection:
      taint_sinks:
        - "if role =="
        - "if is_admin"
        - "if is_superuser"

      steps:
        - "定位权限检查代码"
        - "检查是否使用硬编码值"
        - "判断是否可被绕过"

      safety_conditions:
        - "使用权限检查函数"
        - "权限值从数据库获取"

    remediation:
      principle: "使用权限检查函数而非硬编码值判断权限"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 has_permission 函数"
        - "权限值从数据库或配置获取"
        - "避免直接比较硬编码字符串"

    patterns:
      - pattern: "if.*role.*==.*['\"]admin['\"]"
        description: "Hardcoded role string comparison"
      - pattern: "if.*is_admin|if.*is_superuser"
        description: "Boolean flag check for admin access"

    safe_patterns:
      - "has_permission"
      - "check_permission"

  - category: insecure-direct-object-reference
    owasp: A01
    severity: HIGH

    description: |
      不安全的直接对象引用：使用用户提供的ID直接访问对象，未验证所有权。
      攻击者可以访问其他用户的数据。

    detection:
      taint_sinks:
        - ".get("
        - "Model.query.get("
        - ".get_by_id("
        - "int(path"
        - "int(path.split"

      steps:
        - "定位对象查询代码"
        - "检查ID是否来自用户输入"
        - "判断是否验证了所有权"

      safety_conditions:
        - "查询时过滤当前用户"
        - "验证对象所有权"
        - "有 is_member 检查"
        - "有 ownership 验证"

    remediation:
      principle: "查询对象时验证当前用户是否为所有者"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "查询时添加 user=current_user 条件"
        - "验证对象所有权后返回"

    patterns:
      # Flask/Django patterns
      - pattern: "\\.get\\(.*request\\.(args|form|json|data)"
        description: "Object lookup with user-controlled ID without ownership check"
      - pattern: "Model\\.query\\.get\\(.*request"
        description: "SQLAlchemy query with user-controlled ID"
      # 通用 patterns - URL路径解析ID
      - pattern: "int\\(.*path.*split"
        description: "URL path parameter parsed as int without ownership check"
      - pattern: "\\.get_by_id\\([^)]*\\)"
        description: "Direct object lookup by ID without ownership verification"
      - pattern: "_svc\\.get_by_id\\("
        description: "Service method lookup by ID - check for auth"
      - pattern: "_by_id\\(.*\\)"
        description: "Generic lookup by ID pattern"

    safe_patterns:
      - "filter_by.*user"
      - "owner"
      - "current_user"
      - "is_member"
      - "is_author"
      - "check_permission"
      - "verify_ownership"

  - category: ssrf-url
    owasp: A01
    severity: HIGH

    description: |
      SSRF服务端请求伪造：使用用户输入构造请求URL。
      攻击者可以访问内部资源、发起攻击或绕过防火墙。

    detection:
      taint_sinks:
        - "requests.get("
        - "requests.post("
        - "urllib.request.urlopen("
        - "httpx.get("

      steps:
        - "定位HTTP请求函数调用"
        - "追溯URL参数来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "URL使用白名单验证"
        - "限制允许的域名"

    remediation:
      principle: "使用白名单验证请求URL，限制可访问的域名"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证URL格式和协议"
        - "使用域名白名单"
        - "禁止访问内网地址"

    patterns:
      - pattern: "requests\\.(get|post|put|delete|patch|head)\\(.*request"
        description: "requests library with user-controlled URL"
      - pattern: "urllib\\.request\\.urlopen\\(.*request"
        description: "urllib with user-controlled URL"
      - pattern: "httpx\\.(get|post|Client)\\(.*request"
        description: "httpx with user-controlled URL"

    safe_patterns:
      - "validate_url"
      - "ALLOWED_DOMAINS"
      - "urlparse"

  - category: ssrf-dns
    owasp: A01
    severity: MEDIUM

    description: |
      DNS SSRF：使用用户输入进行DNS解析。
      攻击者可以进行DNS重绑定攻击或信息泄露。

    detection:
      taint_sinks:
        - "socket.getaddrinfo("
        - "socket.gethostbyname("
        - "dns.resolver.query("

      steps:
        - "定位DNS解析调用"
        - "检查参数来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "主机名使用白名单验证"
        - "验证解析结果"

    remediation:
      principle: "使用白名单验证主机名，验证解析结果"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用主机名白名单"
        - "验证解析结果IP地址"

    patterns:
      - pattern: "socket\\.getaddrinfo\\(.*request|socket\\.gethostbyname\\(.*request"
        description: "DNS resolution with user input"
      - pattern: "dns\\.resolver\\.(query|resolve)\\(.*request"
        description: "dnspython with user input"

    safe_patterns:
      - "validate_hostname"
      - "ALLOWED_HOSTS"

  # ===== A02 - Security Misconfiguration =====
  - category: default-credentials
    owasp: A02
    severity: HIGH

    description: |
      默认凭据：代码中硬编码默认密码、密钥或API密钥。
      攻击者可使用默认凭据获取系统访问权限。

    detection:
      taint_sinks:
        - "password ="
        - "SECRET_KEY ="
        - "API_KEY ="

      steps:
        - "扫描硬编码的凭据"
        - "检查是否为默认值"
        - "判断是否应从外部获取"

      safety_conditions:
        - "从环境变量读取"
        - "从配置文件读取"

    remediation:
      principle: "凭据从环境变量或配置文件读取，不在代码中硬编码"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 os.environ 或 os.getenv"
        - "移除硬编码的凭据"

    patterns:
      - pattern: "password.*=.*['\"]admin['\"]|password.*=.*['\"]123456['\"]|password.*=.*['\"]password['\"]"
        description: "Default/hardcoded password"
      - pattern: "SECRET_KEY.*=.*['\"][a-zA-Z0-9]{8,}['\"]"
        description: "Hardcoded Django SECRET_KEY"
      - pattern: "API_KEY.*=.*['\"][a-zA-Z0-9]+['\"]"
        description: "Hardcoded API key"

    safe_patterns:
      - "os\\.environ"
      - "os\\.getenv"
      - "settings\\."

  - category: verbose-errors
    owasp: A02
    severity: MEDIUM

    description: |
      详细错误信息：生产环境启用调试模式，泄露敏感信息。
      攻击者可获取堆栈跟踪、路径、配置等敏感信息。

    detection:
      taint_sinks:
        - "DEBUG = True"
        - "app.config['DEBUG']"

      steps:
        - "定位调试配置"
        - "检查是否为生产环境"
        - "判断是否应关闭"

      safety_conditions:
        - "从环境变量读取调试配置"
        - "生产环境禁用调试"

    remediation:
      principle: "从环境变量读取调试配置，生产环境禁用调试模式"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 os.environ 获取调试配置"
        - "默认值设为 False"

    patterns:
      - pattern: "DEBUG\\s*=\\s*True"
        description: "Debug mode enabled"
      - pattern: "app\\.config\\[.*DEBUG.*\\]\\s*=\\s*True"
        description: "Flask debug mode enabled"

    safe_patterns:
      - "os\\.environ"
      - "os\\.getenv"

  - category: cors-wildcard
    owasp: A02
    severity: MEDIUM

    description: |
      CORS通配符：CORS配置使用通配符允许任意来源。
      攻击者可以从任意域发起跨域请求读取敏感数据。

    detection:
      taint_sinks:
        - "CORS.*\\*"
        - "Access-Control-Allow-Origin"

      steps:
        - "定位CORS配置"
        - "检查是否使用通配符"
        - "判断是否过于宽松"

      safety_conditions:
        - "使用明确的域名列表"
        - "不使用通配符"

    remediation:
      principle: "使用明确的允许域名列表，避免使用通配符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "配置允许的域名列表"
        - "移除通配符配置"

    patterns:
      - pattern: "CORS.*\\*|cors.*origins.*\\*|Access-Control-Allow-Origin.*\\*"
        description: "CORS wildcard origin"
      - pattern: "CORSMiddleware.*allow_origins.*\\[.*\\*.*\\]"
        description: "FastAPI CORS with wildcard"

    safe_patterns:
      - "allowed_origins"
      - "ALLOWED_ORIGINS"

  - category: debug-enabled
    owasp: A02
    severity: HIGH

    description: |
      调试模式启用：Flask应用在调试模式下运行。
      可能导致代码执行（通过调试器）、信息泄露等问题。

    detection:
      taint_sinks:
        - "app.run("
        - "FLASK_DEBUG"

      steps:
        - "定位应用启动代码"
        - "检查调试模式设置"
        - "判断是否为生产环境"

      safety_conditions:
        - "从环境变量读取配置"
        - "生产环境禁用调试"

    remediation:
      principle: "生产环境禁用调试模式，从环境变量读取配置"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除 debug=True 参数"
        - "使用环境变量控制调试模式"

    patterns:
      - pattern: "app\\.run\\(.*debug\\s*=\\s*True"
        description: "Flask app running in debug mode"
      - pattern: "FLASK_DEBUG\\s*=\\s*1|FLASK_ENV.*development"
        description: "Flask debug environment variable"

    safe_patterns:
      - "os\\.environ"

  - category: unnecessary-features
    owasp: A02
    severity: MEDIUM

    description: |
      不必要功能：生产环境暴露API文档端点。
      攻击者可获取API结构、参数等信息辅助攻击。

    detection:
      taint_sinks:
        - "swagger_ui"
        - "redoc_url"
        - "docs_url"

      steps:
        - "定位API文档配置"
        - "检查是否在生产环境暴露"
        - "判断是否应禁用"

      safety_conditions:
        - "生产环境禁用文档端点"
        - "使用环境变量控制"

    remediation:
      principle: "生产环境禁用API文档端点"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "设置 docs_url=None"
        - "设置 redoc_url=None"

    patterns:
      - pattern: "swagger_ui|redoc_url|docs_url"
        description: "API documentation endpoint exposed"

    safe_patterns:
      - "None"

  - category: django-security
    owasp: A02
    severity: HIGH

    description: |
      Django安全配置问题：Django框架的安全配置不正确。
      可能导致会话劫持、CSRF绕过、敏感信息泄露等问题。

    detection:
      taint_sinks:
        - "SECRET_KEY"
        - "ALLOWED_HOSTS"
        - "SESSION_SERIALIZER"
        - "SECURE_SSL_REDIRECT"
        - "SECURE_HSTS_SECONDS"
        - "DEBUG"

      steps:
        - "检查 SECRET_KEY 是否硬编码"
        - "检查 ALLOWED_HOSTS 是否包含通配符"
        - "检查 SESSION_SERIALIZER 是否使用 PickleSerializer"
        - "检查安全相关配置是否正确设置"

      safety_conditions:
        - "SECRET_KEY 从环境变量读取"
        - "ALLOWED_HOSTS 不包含 '*'"
        - "SESSION_SERIALIZER 使用 JSONSerializer"
        - "SECURE_SSL_REDIRECT = True (生产环境)"

    remediation:
      principle: "正确配置Django安全设置，使用环境变量存储敏感配置"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "SECRET_KEY 从环境变量读取"
        - "ALLOWED_HOSTS 明确指定域名"
        - "使用 JSONSerializer 而非 PickleSerializer"
        - "生产环境关闭 DEBUG"
        - "启用 SSL 和 HSTS"

    patterns:
      - pattern: "SECRET_KEY\\s*=\\s*['\"][^'\"]+['\"]"
        description: "Hardcoded Django SECRET_KEY"
      - pattern: "ALLOWED_HOSTS\\s*=\\s*\\[.*\\*.*\\]"
        description: "ALLOWED_HOSTS with wildcard"
      - pattern: "SESSION_SERIALIZER\\s*=\\s*PickleSerializer"
        description: "Using PickleSerializer for sessions (use JSONSerializer)"
      - pattern: "SECURE_SSL_REDIRECT\\s*=\\s*False"
        description: "SSL redirect disabled"
      - pattern: "SECURE_HSTS_SECONDS\\s*=\\s*0"
        description: "HSTS disabled"
      - pattern: "SECURE_HSTS_INCLUDE_SUBDOMAINS\\s*=\\s*False"
        description: "HSTS subdomains not included"

    safe_patterns:
      - "os\\.environ"
      - "os\\.getenv"
      - "JSONSerializer"

  - category: csp-misconfiguration
    owasp: A02
    severity: MEDIUM

    description: |
      CSP配置错误：Content-Security-Policy 配置过于宽松。
      可能导致XSS攻击、数据注入等风险。

    detection:
      taint_sinks:
        - "Content-Security-Policy"
        - "CSP_DEFAULT_SRC"
        - "django-csp配置"

      steps:
        - "定位 CSP 配置"
        - "检查是否包含 unsafe-inline 或 unsafe-eval"
        - "检查是否使用通配符 *"
        - "判断配置是否过于宽松"

      safety_conditions:
        - "不使用 unsafe-inline"
        - "不使用 unsafe-eval"
        - "不使用通配符 *"
        - "使用 nonce 或 hash 替代 unsafe"

    remediation:
      principle: "配置严格的CSP策略，避免 unsafe-inline、unsafe-eval 和通配符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除 unsafe-inline 指令"
        - "移除 unsafe-eval 指令"
        - "使用 nonce- 或 hash- 替代"
        - "明确指定允许的源"

    patterns:
      - pattern: "Content-Security-Policy.*unsafe-inline"
        description: "CSP with unsafe-inline directive"
      - pattern: "Content-Security-Policy.*unsafe-eval"
        description: "CSP with unsafe-eval directive"
      - pattern: "Content-Security-Policy.*\\*"
        description: "CSP with wildcard source"
      - pattern: "CSP_DEFAULT_SRC\\s*=\\s*['\"]\\*['\"]"
        description: "Django CSP default-src wildcard"

    safe_patterns:
      - "self"
      - "nonce-"
      - "strict-dynamic"

  - category: file-permission
    owasp: A02
    severity: MEDIUM

    description: |
      文件权限管理：设置过于宽松的文件权限。
      可能导致其他用户读取或修改敏感文件。

    detection:
      taint_sinks:
        - "os.chmod("
        - "os.mkdir("
        - "umask("

      steps:
        - "定位文件权限设置操作"
        - "检查权限值是否过于宽松"
        - "判断是否允许其他用户读写"

      safety_conditions:
        - "权限不包含其他用户写权限"
        - "敏感文件权限 <= 0o600"
        - "目录权限 <= 0o755"

    remediation:
      principle: "遵循最小权限原则，仅授予必要的权限"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "文件权限: 0o600 或 0o644"
        - "目录权限: 0o755 或 0o700"
        - "敏感文件: 0o600"

    patterns:
      - pattern: "os\\.chmod\\(.*0o777|os\\.chmod\\(.*0777"
        description: "Setting file permission to 777 (world-writable)"
      - pattern: "os\\.mkdir\\(.*mode\\s*=\\s*0o777"
        description: "Creating directory with 777 permission"
      - pattern: "umask\\(0\\)|umask\\(0000\\)"
        description: "Setting umask to 0 (insecure)"

    safe_patterns:
      - "0o755"
      - "0o644"
      - "0o600"

  - category: hardcoded-separator
    owasp: A02
    severity: LOW

    description: |
      硬编码文件分隔符：在代码中硬编码 Windows 或 Unix 文件分隔符。
      导致跨平台兼容性问题。

    detection:
      taint_sinks:
        - "硬编码的反斜杠或正斜杠字符"

      steps:
        - "定位硬编码的文件分隔符"
        - "检查是否应使用 os.path.sep"
        - "判断是否影响跨平台兼容性"

      safety_conditions:
        - "使用 os.path.join()"
        - "使用 os.path.sep"
        - "使用 pathlib"

    remediation:
      principle: "使用 os.path.join 或 pathlib 处理路径，避免硬编码分隔符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 os.path.join() 拼接路径"
        - "使用 os.path.sep 获取分隔符"
        - "使用 pathlib.Path 处理路径"

    patterns:
      - pattern: "\\\\\""
        description: "Hardcoded Windows backslash separator in double-quoted string"
      - pattern: "'\\\\'"
        description: "Hardcoded Windows backslash separator in single-quoted string"

    safe_patterns:
      - "os.path.join"
      - "os.path.sep"
      - "pathlib"

  - category: response-security
    owasp: A02
    severity: MEDIUM

    description: |
      HTTP响应安全：缺少必要的安全响应头或响应类型设置不正确。
      可能导致XSS、点击劫持、MIME类型混淆等风险。

    detection:
      taint_sinks:
        - "X-Frame-Options"
        - "X-Content-Type-Options"
        - "Content-Type"
        - "HttpResponse("

      steps:
        - "检查响应头是否设置 X-Frame-Options"
        - "检查是否设置 X-Content-Type-Options: nosniff"
        - "检查 Content-Type 是否正确"
        - "判断响应内容是否经过编码处理"

      safety_conditions:
        - "设置 X-Frame-Options"
        - "设置 X-Content-Type-Options: nosniff"
        - "HTML响应经过转义处理"

    remediation:
      principle: "设置必要的安全响应头，正确处理响应内容"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "设置 X-Frame-Options: DENY 或 SAMEORIGIN"
        - "设置 X-Content-Type-Options: nosniff"
        - "HTML内容使用 bleach 或 escape 处理"
        - "正确设置 Content-Type"

    patterns:
      - pattern: "X-Frame-Options.*DENY|X-Frame-Options.*SAMEORIGIN"
        description: "X-Frame-Options header should be set"
      - pattern: "X-Content-Type-Options.*nosniff"
        description: "X-Content-Type-Options should be set"
      - pattern: "Content-Type.*text/html.*response"
        description: "HTML content type without sanitization"
      - pattern: "HttpResponse\\(.*request"
        description: "HttpResponse with user input"

    safe_patterns:
      - "bleach\\.clean"
      - "escape"
      - "markupsafe"

  - category: verbose-output
    owasp: A09
    severity: MEDIUM

    description: |
      详细输出风险：使用 print、sys.stdout 直接输出而非使用日志系统。
      可能泄露敏感信息，且难以管理和审计。

    detection:
      taint_sinks:
        - "print("
        - "sys.stdout.write("
        - "sys.stderr.write("
        - "pprint.pprint("

      steps:
        - "定位 print 或 stdout 输出语句"
        - "检查输出内容是否可能包含敏感信息"
        - "判断是否应使用日志系统替代"

      safety_conditions:
        - "使用 logging 模块"
        - "输出内容不包含敏感信息"
        - "DEBUG 模式下才输出详细信息"

    remediation:
      principle: "使用 logging 模块替代 print，便于管理和控制输出级别"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换 print 为 logging 调用"
        - "设置合适的日志级别"
        - "敏感信息使用脱敏处理"

    patterns:
      - pattern: "print\\((?!.*#|.*debug)"
        description: "Using print() instead of logging"
      - pattern: "sys\\.stdout\\.write\\(|sys\\.stderr\\.write\\("
        description: "Direct stdout/stderr output"
      - pattern: "pprint\\.pprint\\("
        description: "Pretty print output (may leak sensitive data)"

    safe_patterns:
      - "logging\\."
      - "logger\\."

  # ===== A03 - Supply Chain Failures =====
  - category: known-vulnerability
    owasp: A03
    severity: HIGH

    description: |
      已知漏洞：使用存在已知漏洞的依赖版本。
      攻击者可利用公开的漏洞利用代码进行攻击。

    detection:
      taint_sinks:
        - "Flask=="
        - "Django=="
        - "requests=="

      steps:
        - "检查依赖版本声明"
        - "对比已知漏洞数据库"
        - "判断是否存在已知漏洞"

      safety_conditions:
        - "使用最新稳定版本"
        - "定期更新依赖"

    remediation:
      principle: "升级到安全版本，使用版本范围而非固定版本"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "升级到安全版本"
        - "使用 >= 或 ~= 版本范围"

    patterns:
      - pattern: "Flask==[01]\\.|Django==[12]\\.[012]\\."
        description: "Known vulnerable Flask/Django version"
      - pattern: "requests==2\\.[0-9][^0-9]|urllib3==1\\.[0-9][^0-9]"
        description: "Potentially outdated requests/urllib3 version"

    safe_patterns:
      - ">=|~="

  - category: outdated-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      过时依赖：固定依赖版本可能导致无法获取安全补丁。
      应使用版本范围以获取安全更新。

    detection:
      taint_sinks:
        - "=="

      steps:
        - "检查依赖版本约束"
        - "判断是否固定版本"
        - "评估更新策略"

      safety_conditions:
        - "使用版本范围"
        - "定期更新依赖"

    remediation:
      principle: "使用版本范围以便获取安全补丁"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 >= 或 ~= 版本范围"

    patterns:
      - pattern: "==[0-9]+\\.[0-9]+\\.[0-9]+"
        description: "Pinned exact version (may miss security patches)"

    safe_patterns:
      - ">=|~="

  - category: insecure-pipeline
    owasp: A03
    severity: HIGH

    description: |
      不安全流水线：CI/CD中下载依赖未验证完整性。
      攻击者可能通过供应链攻击植入恶意代码。

    detection:
      taint_sinks:
        - "subprocess.run(.*curl"
        - "pip install.*--no-verify"

      steps:
        - "定位依赖下载代码"
        - "检查是否有验证机制"
        - "判断是否存在风险"

      safety_conditions:
        - "验证哈希值"
        - "使用安全下载方式"

    remediation:
      principle: "下载依赖时验证完整性，使用安全下载方式"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证下载文件的哈希值"
        - "使用 pip 的哈希验证功能"

    patterns:
      - pattern: "subprocess\\.run\\(.*curl|subprocess\\.run\\(.*wget"
        description: "Downloading dependencies via subprocess without verification"
      - pattern: "pip install.*--no-verify|pip install.*--trusted-host"
        description: "pip install with verification disabled"

    safe_patterns:
      - "hash"
      - "verify"
      - "checksum"

  - category: unverified-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      未验证依赖：从Git URL安装依赖未验证哈希。
      可能安装被篡改的代码。

    detection:
      taint_sinks:
        - "pip install.*git+"

      steps:
        - "定位pip安装命令"
        - "检查是否有哈希验证"
        - "判断是否安全"

      safety_conditions:
        - "使用哈希验证"
        - "使用PyPI官方源"

    remediation:
      principle: "使用哈希验证或从PyPI官方源安装"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加哈希验证"
        - "优先使用PyPI"

    patterns:
      - pattern: "pip install.*-e git\\+|pip install.*git\\+https"
        description: "Installing from git URL without hash verification"

    safe_patterns:
      - "hash"
      - "verify"

  # ===== A04 - Cryptographic Failures =====
  - category: weak-hash
    owasp: A04
    severity: HIGH

    description: |
      弱哈希算法：使用MD5或SHA1等已被破解的哈希算法。
      攻击者可以构造碰撞，伪造数据。

    detection:
      taint_sinks:
        - "hashlib.md5("
        - "hashlib.sha1("
        - "MD5("

      steps:
        - "定位哈希函数调用"
        - "检查使用的算法"
        - "判断是否为弱算法"

      safety_conditions:
        - "使用 SHA256 或更强算法"
        - "使用 blake2"

    remediation:
      principle: "使用SHA256或更强的哈希算法"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "密码哈希"
          use: "使用 bcrypt、argon2 或 pbkdf2"

        - scenario: "数据完整性"
          use: "使用 SHA256 或 blake2"

      requirements:
        - "替换 MD5/SHA1 为 SHA256 或更强"
        - "密码存储使用专用哈希函数"

    patterns:
      - pattern: "hashlib\\.md5\\(|hashlib\\.sha1\\("
        description: "MD5/SHA1 hash function"
      - pattern: "MD5\\(|MD5\\.new"
        description: "Crypto MD5"

    safe_patterns:
      - "sha256|sha384|sha512|blake2"

  - category: hardcoded-secret
    owasp: A04
    severity: HIGH

    description: |
      硬编码密钥：在代码中硬编码密码、密钥、令牌等敏感信息。
      导致敏感信息泄露。

    detection:
      taint_sinks:
        - "password ="
        - "secret ="
        - "api_key ="
        - "token ="
        - "private_key ="
        - "DATABASE_URL"

      steps:
        - "扫描代码中的字符串赋值"
        - "检查变量名是否包含敏感关键词"
        - "判断是否为硬编码的敏感信息"

      safety_conditions:
        - "从环境变量读取"
        - "从配置文件读取"

    remediation:
      principle: "敏感信息从环境变量或配置文件读取"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 os.environ 或 os.getenv"
        - "移除硬编码的敏感信息"

    patterns:
      - pattern: "(password|secret|api_key|token|private_key)\\s*=\\s*['\"][^'\"]+['\"]"
        description: "Hardcoded secret string"
      - pattern: "DATABASE_URL.*=.*['\"]postgres.*://.*:.*@"
        description: "Database URL with credentials"

    safe_patterns:
      - "os\\.environ"
      - "os\\.getenv"
      - "settings\\."

  - category: insecure-random
    owasp: A04
    severity: MEDIUM

    description: |
      不安全的随机数：使用random模块用于安全敏感场景。
      攻击者可以预测随机数。

    detection:
      taint_sinks:
        - "random.random("
        - "random.randint("
        - "random.choice("

      steps:
        - "定位随机数生成调用"
        - "判断是否用于安全场景"
        - "检查是否使用secrets模块"

      safety_conditions:
        - "使用 secrets 模块"
        - "使用 SystemRandom"

    remediation:
      principle: "安全敏感场景使用secrets模块"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换 random 为 secrets"
        - "使用 SystemRandom"

    patterns:
      - pattern: "random\\.(random|randint|choice|shuffle)\\("
        description: "Insecure random module (use secrets for security)"

    safe_patterns:
      - "secrets\\."
      - "SystemRandom"

  - category: weak-encryption
    owasp: A04
    severity: HIGH

    description: |
      弱加密：使用DES、RC4等弱加密算法或ECB模式。
      攻击者可以解密数据。

    detection:
      taint_sinks:
        - "DES."
        - "MODE_ECB"
        - "Blowfish"
        - "RC4"

      steps:
        - "定位加密函数调用"
        - "检查算法和模式"
        - "判断是否为弱算法"

      safety_conditions:
        - "使用 AES"
        - "使用 GCM 或 CBC 模式"

    remediation:
      principle: "使用AES加密和GCM/CBC模式"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 AES.new 创建加密器"
        - "使用 MODE_GCM 或 MODE_CBC"

    patterns:
      - pattern: "DES\\.|AES.*MODE_ECB|Blowfish|RC4|ARC4"
        description: "Weak cipher or ECB mode"

    safe_patterns:
      - "MODE_GCM|MODE_CBC"
      - "AES\\.new"

  - category: plaintext-transmission
    owasp: A04
    severity: HIGH

    description: |
      明文传输：敏感数据通过HTTP而非HTTPS传输。
      数据可能被窃听。

    detection:
      taint_sinks:
        - "http://"
        - "SMTP("
        - "FTP("

      steps:
        - "检查URL协议"
        - "判断是否传输敏感数据"
        - "检查是否使用加密协议"

      safety_conditions:
        - "使用 HTTPS"
        - "使用 SMTP_SSL"
        - "使用 FTPS"

    remediation:
      principle: "敏感数据使用加密传输"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "URL使用 https://"
        - "邮件使用 SMTP_SSL"
        - "文件传输使用 FTPS"

    patterns:
      - pattern: "http://.*(password|token|secret|key|credential)"
        description: "Sensitive data over HTTP (not HTTPS)"
      - pattern: "SMTP\\(.*port.*25|FTP\\(.*21"
        description: "Unencrypted protocol for sensitive data"

    safe_patterns:
      - "https://"
      - "SMTP_SSL"
      - "ftps"

  - category: weak-signature
    owasp: A04
    severity: HIGH

    description: |
      弱签名算法：使用不安全的密钥长度或签名算法。
      攻击者可以伪造签名，破坏数据完整性和认证。

    detection:
      taint_sinks:
        - "DSA.generate("
        - "RSA.generate("
        - "ECDSA.generate("

      steps:
        - "定位密钥生成调用"
        - "检查密钥长度参数"
        - "判断是否满足最低安全要求"
        - "RSA/DSA: 至少2048位; ECDSA: 至少NIST256p"

      safety_conditions:
        - "RSA/DSA 密钥长度 >= 2048"
        - "ECDSA 使用 NIST256p 或更强曲线"

    remediation:
      principle: "使用足够强度的密钥长度，RSA/DSA至少2048位"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "RSA: 密钥长度 >= 2048"
        - "DSA: 密钥长度 >= 2048"
        - "ECDSA: 使用 NIST256p 或更强"

    patterns:
      - pattern: "DSA\\.generate\\(.*[0-9]{1,3}\\)"
        description: "DSA key with insufficient key length (<2048 bits)"
      - pattern: "RSA\\.generate\\(.*[0-9]{1,3}\\)"
        description: "RSA key with insufficient key length (<2048 bits)"
      - pattern: "ECDSA\\.generate\\(.*NIST192p|ECDSA\\.generate\\(.*NIST224p"
        description: "ECDSA with weak curve"

    safe_patterns:
      - "2048"
      - "3072"
      - "4096"
      - "NIST256p"
      - "NIST384p"

  - category: sensitive-data-exposure
    owasp: A04
    severity: HIGH

    description: |
      敏感数据暴露：密码、密钥、令牌等敏感信息被输出到日志、响应或控制台。
      导致敏感信息泄露，可能被用于进一步攻击。

    detection:
      taint_sinks:
        - "print("
        - "logging."
        - "logger."
        - "response["
        - "json("
        - "return.*password"

      steps:
        - "定位输出语句（print、logging、response）"
        - "检查输出内容是否包含敏感变量"
        - "追溯敏感变量的来源"
        - "判断是否经过脱敏处理"

      safety_conditions:
        - "敏感数据经过脱敏(mask/redact)"
        - "敏感数据不输出到日志"
        - "响应中不包含敏感字段"

    remediation:
      principle: "敏感数据不输出到日志、控制台或响应，必须脱敏处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感数据的输出语句"
        - "使用脱敏函数处理敏感数据"
        - "日志中用占位符替代敏感数据"
        - "响应中排除敏感字段"

    patterns:
      - pattern: "print\\(.*password|print\\(.*token|print\\(.*secret"
        description: "Printing sensitive data to console"
      - pattern: "response\\[.*password\\]|json\\(.*password"
        description: "Returning sensitive data in response"
      - pattern: "open\\(.*'w'.*password|open\\(.*'w'.*token"
        description: "Writing sensitive data to file"
      - pattern: "cache\\..*password|redis\\..*password"
        description: "Caching sensitive data without encryption"

    safe_patterns:
      - "mask"
      - "redact"
      - "sanitize"
      - "encrypt"

  # ===== A05 - Injection =====
  - category: sql-injection
    owasp: A05
    severity: CRITICAL

    description: |
      SQL注入：使用字符串拼接或格式化构造SQL语句。
      攻击者可以执行任意SQL命令，读取、修改或删除数据。

    detection:
      taint_sinks:
        - "execute("
        - "raw("
        - "cursor.execute("

      steps:
        - "定位SQL执行函数"
        - "检查参数构造方式"
        - "判断是否使用参数化查询"

      safety_conditions:
        - "使用参数化查询"
        - "使用 ORM 安全方法"

    remediation:
      principle: "使用参数化查询，禁止字符串拼接SQL"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "原生SQL"
          use: "使用 ? 或 :name 占位符"

        - scenario: "ORM查询"
          use: "使用 filter() 等安全方法"

      requirements:
        - "使用参数化查询"
        - "禁止字符串拼接或格式化"

    patterns:
      - pattern: "execute\\(.*%s|execute\\(.*\\.format|execute\\(.*f['\"]"
        description: "String formatting in SQL execute"
      - pattern: "raw\\(.*%s|raw\\(.*\\.format|raw\\(.*f['\"]"
        description: "Raw SQL query with string formatting"
      - pattern: "cursor\\.execute\\(.*\\+"
        description: "String concatenation in cursor.execute"

    safe_patterns:
      - "execute\\(.*\\?"
      - "execute\\(.*:\\w+[^+]*\\)"
      - "text\\(.*:"

  - category: command-injection
    owasp: A05
    severity: CRITICAL

    description: |
      命令注入：使用os.system、os.popen或subprocess.shell=True执行命令。
      攻击者可以执行任意系统命令。

    detection:
      taint_sinks:
        - "os.system("
        - "os.popen("
        - "subprocess.run("
        - "eval("
        - "exec("

      steps:
        - "定位命令执行函数"
        - "检查是否使用shell=True"
        - "追溯命令参数来源"

      safety_conditions:
        - "使用数组形式传递参数"
        - "shell=False"
        - "使用shlex.quote转义"

    remediation:
      principle: "使用数组形式传递命令参数，禁用shell=True"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除 shell=True"
        - "使用数组形式传递参数"
        - "避免 eval/exec"

    patterns:
      - pattern: "os\\.system\\("
        description: "os.system() with potential user input"
      - pattern: "os\\.popen\\("
        description: "os.popen() with potential user input"
      - pattern: "subprocess\\.(call|run|Popen)\\(.*shell\\s*=\\s*True"
        description: "subprocess with shell=True"
      - pattern: "eval\\("
        description: "eval() with potential user input"
      - pattern: "exec\\("
        description: "exec() with potential user input"

    safe_patterns:
      - "subprocess\\.run\\("
      - "shlex\\.quote"

  - category: code-evaluation
    owasp: A05
    severity: CRITICAL

    description: |
      代码动态评估漏洞：使用 eval()、exec()、compile() 等函数执行用户控制的代码字符串。
      攻击者可以注入任意Python代码，导致远程代码执行(RCE)。

    detection:
      taint_sinks:
        - "eval("
        - "exec("
        - "compile("
        - "ast.literal_eval("

      steps:
        - "定位代码中的 eval/exec/compile 调用"
        - "追溯第一个参数的来源"
        - "判断参数是否直接或间接来自用户输入"
        - "检查是否经过白名单验证或安全处理"

      safety_conditions:
        - "参数是硬编码字符串常量"
        - "参数经过严格的白名单验证"
        - "使用 ast.literal_eval 且输入已验证"

    remediation:
      principle: "禁止使用 eval/exec 执行用户输入，使用安全的替代方案"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "解析JSON数据"
          use: "json.loads()"

        - scenario: "解析字面量"
          use: "ast.literal_eval() 配合输入验证"

        - scenario: "动态函数调用"
          use: "使用字典映射到允许的函数"

      requirements:
        - "移除 eval/exec 调用"
        - "使用安全的解析方法"
        - "如必须动态执行，使用白名单限制"

    patterns:
      - pattern: "eval\\(.*request|eval\\(.*input"
        description: "eval() with user-controlled input"
      - pattern: "exec\\(.*request|exec\\(.*input"
        description: "exec() with user-controlled input"
      - pattern: "compile\\(.*request|compile\\(.*input"
        description: "compile() with user-controlled input"
      - pattern: "ast\\.literal_eval\\(.*request"
        description: "ast.literal_eval with request data"

    safe_patterns:
      - "ast\\.literal_eval\\(['\\\"]"
      - "json\\.loads"

  - category: template-injection
    owasp: A05
    severity: CRITICAL

    description: |
      模板注入(SSTI)：用户输入直接拼接到模板字符串中。
      攻击者可以执行任意代码。

    detection:
      taint_sinks:
        - "Template("
        - "render_template_string("

      steps:
        - "定位模板渲染函数"
        - "检查模板内容来源"
        - "判断是否包含用户输入"

      safety_conditions:
        - "使用 render_template"
        - "启用 autoescape"
        - "使用沙箱环境"

    remediation:
      principle: "使用render_template渲染模板文件，避免拼接用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 render_template 替代 render_template_string"
        - "避免在模板字符串中拼接用户输入"

    patterns:
      - pattern: "Template\\(.*\\+|Template\\(.*%s|Template\\(.*\\.format"
        description: "Jinja2 Template with string concatenation/formatting"
      - pattern: "render_template_string\\(.*\\+|render_template_string\\(.*%s"
        description: "Flask render_template_string with user input"
      - pattern: "\\{\\{.*__class__|\\{\\{.*__mro__|\\{\\{.*__subclasses__"
        description: "SSTI payload patterns in templates"

    safe_patterns:
      - "render_template\\("
      - "autoescape"
      - "sandboxed"

  - category: ldap-injection
    owasp: A05
    severity: HIGH

    description: |
      LDAP注入：用户输入直接拼接到LDAP查询中。
      攻击者可以绕过认证或获取敏感数据。

    detection:
      taint_sinks:
