    detection:
      taint_sinks:
        - "smtplib.SMTP.sendmail("
        - "EmailMessage.set_content("
        - "EmailMessage.set_subject("
        - "MIMEText("
        - "MIMEMultipart("

      steps:
        - "定位邮件发送相关调用"
        - "追溯邮件头、收件人、内容的来源"
        - "判断是否包含用户输入"
        - "检查是否包含换行符等特殊字符"

      safety_conditions:
        - "邮件头不包含换行符(\\n, \\r)"
        - "收件人地址经过验证"
        - "使用邮件验证库"

    remediation:
      principle: "验证和过滤邮件相关输入，防止注入换行符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除输入中的换行符"
        - "验证邮件地址格式"
        - "限制邮件头长度"
        - "使用白名单验证收件人"

    patterns:
      - pattern: "smtplib\\.SMTP\\(.*sendmail\\(.*request"
        description: "SMTP sendmail with user-controlled parameters"
      - pattern: "EmailMessage\\(.*request|MIMEText\\(.*request"
        description: "Email construction with user input"
      - pattern: "\\n.*Bcc:|\\n.*Cc:|\\r\\n.*To:"
        description: "Email header injection patterns"
      - pattern: "set_content\\(.*request|set_subject\\(.*request"
        description: "Email content with user input"

    safe_patterns:
      - "email_validator"
      - "validate_email"

  - category: regex-injection
    owasp: A05
    severity: MEDIUM

    description: |
      正则表达式注入：用户输入直接用于构造正则表达式模式。
      攻击者可以注入恶意正则导致ReDoS(正则拒绝服务)攻击。

    detection:
      taint_sinks:
        - "re.compile("
        - "re.search("
        - "re.match("
        - "re.findall("
        - "re.sub("

      steps:
        - "定位正则表达式编译或匹配调用"
        - "追溯第一个参数(模式)的来源"
        - "判断模式是否包含用户输入"
        - "检查是否使用 re.escape 处理"

      safety_conditions:
        - "模式是硬编码字符串常量"
        - "用户输入经过 re.escape 处理"
        - "使用白名单限制模式"

    remediation:
      principle: "不要让用户控制正则表达式模式，对用户输入使用 re.escape"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "模式使用硬编码常量"
        - "动态部分使用 re.escape 处理"
        - "限制正则复杂度，避免回溯爆炸"

    patterns:
      - pattern: "re\\.compile\\(.*request|re\\.compile\\(.*input"
        description: "Regex compilation with user-controlled pattern"
      - pattern: "re\\.(search|match|findall)\\(.*request.*\\)"
        description: "re.search/match/findall with user-controlled pattern"

    safe_patterns:
      - "re\\.escape"
      - "whitelist"

  # ===== A06 - Insecure Design =====
  - category: missing-rate-limit
    owasp: A06
    severity: HIGH

    description: |
      缺少速率限制：登录等敏感端点未实施速率限制。
      攻击者可以进行暴力破解攻击。

    detection:
      taint_sinks:
        - "@app.post("
        - "@router.post("
        - "login"

      steps:
        - "定位登录端点"
        - "检查是否有速率限制"
        - "判断是否需要保护"

      safety_conditions:
        - "使用限流装饰器"
        - "使用 limiter"

    remediation:
      principle: "为登录等敏感端点添加速率限制"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加限流装饰器"
        - "配置速率限制策略"

    patterns:
      - pattern: "@app\\.(route|post).*login|@router\\.post.*login"
        description: "Login endpoint without rate limiting"

    safe_patterns:
      - "limiter"
      - "rate_limit"
      - "throttle"

  - category: missing-lockout
    owasp: A06
    severity: HIGH

    description: |
      缺少账户锁定：密码验证失败后无账户锁定机制。
      攻击者可以进行暴力破解攻击。

    detection:
      taint_sinks:
        - "check_password"
        - "verify_password"
        - "authenticate"

      steps:
        - "定位密码验证函数"
        - "检查是否有失败计数"
        - "判断是否有锁定机制"

      safety_conditions:
        - "实施账户锁定"
        - "限制失败次数"

    remediation:
      principle: "实施账户锁定机制，限制失败尝试次数"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "记录失败尝试次数"
        - "达到阈值后锁定账户"

    patterns:
      - pattern: "check_password|verify_password|authenticate"
        description: "Password verification without attempt counting"

    safe_patterns:
      - "lockout"
      - "MAX_ATTEMPTS"
      - "rate_limit"

  - category: business-logic-flaw
    owasp: A06
    severity: HIGH

    description: |
      业务逻辑缺陷：价格、数量等关键业务参数来自用户输入未验证。
      攻击者可以篡改价格或数量获利。

    detection:
      taint_sinks:
