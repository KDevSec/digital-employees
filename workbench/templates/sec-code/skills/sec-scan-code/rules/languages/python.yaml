        description: "Crontab manipulation via os.system - suspicious scheduled task"
        confidence: 8
      - pattern: "subprocess\\.(call|Popen)\\(.*crontab\\b"
        description: "Crontab manipulation via subprocess - suspicious scheduled task"
        confidence: 8
