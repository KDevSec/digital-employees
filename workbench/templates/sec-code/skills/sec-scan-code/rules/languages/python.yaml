        description: "Schedule library periodic task - check for malicious payloads"
        confidence: 5
      - pattern: "datetime\\.now\\(\\).*os\\.system\\("
        description: "Date check followed by system command - potential time bomb"
        confidence: 8
      - pattern: "time\\.time\\(\\).*subprocess\\.(call|Popen)\\("
        description: "Timestamp check followed by subprocess - potential time bomb"
