  - category: xml-external-entity
    owasp: A05
    severity: HIGH

    description: |
      XML外部实体攻击(XXE)：解析XML时允许加载外部实体。
      攻击者可以读取本地文件、发起SSRF攻击、导致拒绝服务。

    detection:
      taint_sinks:
        - "etree.parse("
        - "xml.etree.ElementTree.parse("
        - "minidom.parse("
        - "pulldom.parse("
        - "etree.XMLParser("

      steps:
        - "定位XML解析调用"
        - "检查解析器配置"
        - "判断是否禁用了外部实体解析"
        - "检查 resolve_entities 是否设为 False"

      safety_conditions:
        - "使用 defusedxml 库"
        - "resolve_entities=False"
        - "使用 lxml 且禁用外部实体"

    remediation:
      principle: "禁用XML外部实体解析，使用安全的XML解析器"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "解析XML"
          use: "使用 defusedxml 库"

        - scenario: "使用lxml"
          use: "设置 resolve_entities=False"

      requirements:
        - "禁用外部实体解析"
        - "禁用DTD处理"
        - "限制实体扩展深度"

    patterns:
      - pattern: "etree\\.parse\\(.*resolve_entities\\s*=\\s*True"
        description: "lxml parse with external entities enabled"
      - pattern: "xml\\.etree\\.ElementTree\\.parse\\("
        description: "ElementTree parse without XXE protection"
      - pattern: "etree\\.XMLParser\\(.*resolve_entities\\s*=\\s*True"
        description: "XMLParser with external entities enabled"
      - pattern: "minidom\\.parse\\(|pulldom\\.parse\\("
        description: "XML parsing without XXE protection"

    safe_patterns:
      - "resolve_entities\\s*=\\s*False"
      - "defusedxml"

  - category: email-injection
    owasp: A05
    severity: MEDIUM

