  # ===== A07 - Identification and Authentication Failures =====
  - category: weak-password
    owasp: A07
    severity: MEDIUM

    description: |
      弱密码策略：密码长度要求过短或复杂度不足。
      攻击者可以更容易进行暴力破解。

    detection:
      taint_sinks:
        - "len(password)"
        - "min_length"

      steps:
        - "定位密码验证代码"
        - "检查长度和复杂度要求"
        - "判断是否足够安全"

      safety_conditions:
        - "密码长度 >= 8"
        - "要求复杂度"

    remediation:
      principle: "实施强密码策略，最小长度8位并要求复杂度"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "密码最小长度 >= 8"
        - "要求包含数字、字母、特殊字符"

    patterns:
      - pattern: "len\\(.*password.*\\)\\s*<\\s*[1-6]"
        description: "Weak password length check"
      - pattern: "min_length.*[1-5]"
        description: "Password minimum length too short"

    safe_patterns:
      - "bcrypt"
      - "argon2"
      - "pbkdf2"

  - category: broken-session
    owasp: A07
    severity: HIGH

    description: |
      会话管理缺陷：会话Cookie未设置安全属性。
      可能导致会话劫持。

    detection:
      taint_sinks:
        - "session["
        - "SESSION_COOKIE_SECURE"
        - "SESSION_COOKIE_HTTPONLY"

      steps:
        - "定位会话配置"
        - "检查Cookie安全属性"
        - "判断是否安全"

      safety_conditions:
        - "SESSION_COOKIE_SECURE = True"
        - "SESSION_COOKIE_HTTPONLY = True"

    remediation:
      principle: "设置Cookie安全属性：Secure和HttpOnly"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "设置 SESSION_COOKIE_SECURE = True"
        - "设置 SESSION_COOKIE_HTTPONLY = True"

    patterns:
      - pattern: "session\\[.*request|session\\.update.*request"
        description: "Session data from request without validation"
      - pattern: "SESSION_COOKIE_SECURE\\s*=\\s*False|SESSION_COOKIE_HTTPONLY\\s*=\\s*False"
        description: "Insecure session cookie settings"

    safe_patterns:
      - "validate"
      - "SESSION_COOKIE_SECURE\\s*=\\s*True"

  - category: credential-exposure
    owasp: A07
    severity: HIGH

    description: |
      凭据泄露：密码或其他凭据输出到日志或响应中。
      导致凭据泄露。

    detection:
      taint_sinks:
        - "print("
        - "logger."
        - "json("

      steps:
        - "定位输出语句"
        - "检查是否包含敏感数据"
        - "判断是否可能泄露"

      safety_conditions:
        - "脱敏处理"
        - "不输出敏感数据"

    remediation:
      principle: "敏感数据脱敏或不输出"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感数据输出"
        - "使用脱敏函数"

    patterns:
      - pattern: "print\\(.*password|log\\(.*password|logger\\..*password"
        description: "Password in print/log output"
      - pattern: "json\\(.*password|response\\(.*password"
        description: "Password in API response"

    safe_patterns:
      - "sanitize"
      - "mask"
      - "redact"

  - category: missing-mfa
    owasp: A07
    severity: MEDIUM

    description: |
      缺少多因素认证：仅使用密码进行认证。
      增加账户被盗风险。

    detection:
      taint_sinks:
        - "login"
        - "authenticate"

      steps:
        - "定位认证函数"
        - "检查是否有MFA"
        - "判断是否需要增强"

      safety_conditions:
        - "实施MFA"
        - "支持TOTP等"

    remediation:
      principle: "为敏感操作实施多因素认证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加MFA验证"
        - "支持TOTP或其他MFA方式"

    patterns:
      - pattern: "login.*password|authenticate.*password"
        description: "Login with only password, no MFA"

    safe_patterns:
      - "mfa"
      - "totp"
      - "verify_code"

  # ===== A08 - Software and Data Integrity Failures =====
  - category: insecure-deserialization
    owasp: A08
    severity: CRITICAL

    description: |
      不安全的反序列化：使用pickle、yaml.load等不安全的反序列化函数。
      攻击者可以执行任意代码。

    detection:
      taint_sinks:
        - "pickle.loads("
        - "yaml.load("
        - "marshal.loads("

      steps:
        - "定位反序列化函数"
        - "检查是否使用安全方法"
        - "判断数据来源"

      safety_conditions:
        - "使用 yaml.safe_load"
        - "使用 json.loads"

    remediation:
      principle: "使用安全的反序列化方法：json或yaml.safe_load"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 json.loads 替代 pickle.loads"
        - "使用 yaml.safe_load 替代 yaml.load"

    patterns:
      - pattern: "pickle\\.loads\\("
        description: "pickle.loads() — arbitrary code execution risk"
      - pattern: "yaml\\.load\\(.*Loader\\s*=\\s*yaml\\.FullLoader|yaml\\.load\\(.*Loader\\s*=\\s*yaml\\.SafeLoader"
        description: "yaml.load with potentially unsafe loader"
      - pattern: "marshal\\.loads\\("
        description: "marshal.loads() — unsafe deserialization"

    safe_patterns:
      - "yaml\\.safe_load"
      - "json\\.loads"
      - "pickle\\.HIGHEST_PROTOCOL"

  - category: unsigned-update
    owasp: A08
    severity: HIGH

    description: |
      未签名更新：下载文件后未验证完整性或签名。
      可能安装被篡改的代码。

    detection:
      taint_sinks:
        - "requests.get("
        - "urllib.request.urlopen("

      steps:
        - "定位下载代码"
        - "检查是否有验证"
        - "判断是否安全"

      safety_conditions:
        - "验证哈希值"
        - "验证签名"

    remediation:
      principle: "下载后验证文件完整性或签名"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证下载文件的哈希值"
        - "验证数字签名"

    patterns:
      - pattern: "requests\\.get\\(.*download|urllib\\.request\\.urlopen\\(.*download"
        description: "Download without integrity verification"

    safe_patterns:
      - "hashlib"
      - "checksum"
      - "verify_signature"

  - category: insecure-cicd
    owasp: A08
    severity: HIGH

    description: |
      不安全的CI/CD：CI/CD中执行未验证的代码或命令。
      可能导致供应链攻击。

    detection:
      taint_sinks:
        - "subprocess.run(.*git"
        - "subprocess.run(.*pip"

      steps:
        - "定位CI/CD相关代码"
        - "检查是否有验证"
        - "判断是否安全"

      safety_conditions:
        - "验证命令来源"
        - "使用签名验证"

    remediation:
      principle: "CI/CD中验证执行的命令和代码"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证远程代码来源"
        - "使用签名验证"

    patterns:
      - pattern: "subprocess\\.run\\(.*git.*clone|subprocess\\.run\\(.*pip.*install"
        description: "CI/CD running git/pip without verification"

    safe_patterns:
      - "verify"
      - "checksum"
      - "signature"

  - category: integrity-missing
    owasp: A08
    severity: MEDIUM

    description: |
      完整性检查缺失：写入下载内容时未验证哈希。
      可能写入被篡改的内容。

    detection:
      taint_sinks:
        - "open("
        - "requests"
        - "urllib"

      steps:
        - "定位文件写入代码"
        - "检查是否有哈希验证"
        - "判断是否安全"

      safety_conditions:
        - "验证哈希值"

    remediation:
      principle: "写入下载内容前验证哈希"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "写入前验证哈希值"

    patterns:
      - pattern: "open\\(.*'w'.*requests|open\\(.*'w'.*urllib"
        description: "Writing downloaded content without hash check"

    safe_patterns:
      - "hashlib"
      - "checksum"

  - category: insecure-tempfile
    owasp: A08
    severity: MEDIUM

    description: |
      不安全临时文件：使用不安全的方式创建临时文件。
      可能导致竞态条件、信息泄露、符号链接攻击。

    detection:
      taint_sinks:
        - "open('/tmp/"
        - "tempfile.mktemp("
        - "NamedTemporaryFile(delete=False)"

      steps:
        - "定位临时文件创建操作"
        - "检查是否使用安全的 tempfile 方法"
        - "判断是否使用硬编码路径"
        - "检查文件权限设置"

      safety_conditions:
        - "使用 tempfile.mkstemp()"
        - "使用 tempfile.TemporaryFile()"
        - "不使用硬编码路径"
        - "临时文件自动清理"

    remediation:
      principle: "使用 tempfile 模块的安全方法创建临时文件"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 tempfile.mkstemp() 创建临时文件"
        - "使用 tempfile.TemporaryFile() 创建自动清理的临时文件"
        - "设置适当的文件权限"
        - "确保临时文件在使用后被删除"

    patterns:
      - pattern: "open\\(['\"]/tmp/"
        description: "Hardcoded /tmp path (use tempfile module)"
      - pattern: "tempfile\\.mktemp\\("
        description: "mktemp() is deprecated and insecure"
      - pattern: "NamedTemporaryFile\\(.*delete\\s*=\\s*False"
        description: "NamedTemporaryFile with delete=False"

    safe_patterns:
      - "tempfile\\.mkstemp"
      - "tempfile\\.TemporaryFile"
      - "tempfile\\.NamedTemporaryFile\\("

  # ===== A09 - Security Logging and Monitoring Failures =====
  - category: missing-logging
    owasp: A09
    severity: MEDIUM

    description: |
      日志缺失：异常被静默捕获未记录，或整个项目缺少安全事件日志。
      可能错过安全事件。

    detection:
      taint_sinks:
        - "except.*:"
        - "pass"
        - "class.*Handler"
        - "do_GET"
        - "do_POST"

      steps:
        - "定位异常处理代码或HTTP处理类"
        - "检查是否有日志记录"
        - "判断是否静默处理"

      safety_conditions:
        - "使用 logger 记录异常"
        - "项目有 logging 配置"

    remediation:
      principle: "异常必须记录日志或适当处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加日志记录"
        - "避免空except块"

    patterns:
      - pattern: "except.*:\\s*pass"
        description: "Empty except block (swallowed exception)"
      - pattern: "except Exception.*:\\s*$"
        description: "Broad exception catch without logging"
      # 通用 patterns - HTTP处理器缺少日志
      - pattern: "class.*Handler.*:\\s*$"
        description: "Handler class - check for logging import"
      - pattern: "import json.*import os[^\\n]*$"
        description: "Imports without logging module"

    safe_patterns:
      - "logger\\."
      - "logging\\."
      - "log\\."
      - "import logging"
      - "getLogger"

  - category: sensitive-in-log
    owasp: A09
    severity: MEDIUM

    description: |
      日志中记录敏感信息：密码、令牌等输出到日志。
      导致敏感信息泄露。

    detection:
      taint_sinks:
        - "logger."
        - "logging."
        - "log("

      steps:
        - "定位日志输出"
        - "检查是否包含敏感信息"
        - "判断是否需要脱敏"

      safety_conditions:
        - "脱敏处理"
        - "不记录敏感信息"

    remediation:
      principle: "日志中不记录敏感信息或脱敏处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感信息的日志输出"
        - "使用脱敏函数"

    patterns:
      - pattern: "logger\\..*password|logging\\..*password|log\\(.*password"
        description: "Password in log output"
      - pattern: "logger\\..*token|logging\\..*token|log\\(.*token"
        description: "Token in log output"

    safe_patterns:
      - "sanitize"
      - "mask"
      - "redact"

  - category: missing-alert
    owasp: A09
    severity: MEDIUM

    description: |
      缺少告警：安全事件（如登录失败）未触发告警。
      可能错过攻击检测。

    detection:
      taint_sinks:
        - "failed.*login"
        - "login.*fail"
        - "authenticate.*fail"

      steps:
        - "定位认证相关代码"
        - "检查是否有告警机制"
        - "判断是否需要告警"

      safety_conditions:
        - "发送安全告警"

    remediation:
      principle: "安全事件触发告警通知"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加告警通知机制"

    patterns:
      - pattern: "failed.*login|login.*fail|authenticate.*fail"
        description: "Failed login without alerting mechanism"

    safe_patterns:
      - "alert"
      - "notify"
      - "send_alert"

  - category: log-injection
    owasp: A09
    severity: MEDIUM

    description: |
      日志注入：用户输入直接写入日志未经验证。
      攻击者可以注入伪造的日志条目。

    detection:
      taint_sinks:
        - "logger."
        - "logging."

      steps:
        - "定位日志输出"
        - "检查内容来源"
        - "判断是否验证"

      safety_conditions:
        - "验证用户输入"
        - "过滤换行符"

    remediation:
      principle: "日志内容验证或过滤特殊字符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证日志内容"
        - "过滤换行符等特殊字符"

    patterns:
      - pattern: "logger\\..*%s.*request|logging\\..*%s.*request"
        description: "User input in log without sanitization"

    safe_patterns:
      - "sanitize"
      - "validate_input"

  - category: sensitive-comment
    owasp: A09
    severity: LOW

    description: |
      注释敏感信息：代码注释中包含密码、密钥、账号等敏感信息。
      可能导致敏感信息泄露。

    detection:
      taint_sinks:
        - "# password"
        - "# key"
        - "# secret"
        - "# admin"

      steps:
        - "扫描代码注释"
        - "检查是否包含敏感关键词"
        - "判断是否包含实际的敏感值"

      safety_conditions:
        - "注释不包含敏感信息"
        - "敏感信息使用占位符描述"

    remediation:
      principle: "移除注释中的敏感信息，使用通用描述替代"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "删除注释中的密码、密钥等"
        - "使用占位符如 '***' 或 '<secret>'"
        - "敏感配置说明使用文档而非代码注释"

    patterns:
      - pattern: "#.*password\\s*[:=]|#.*passwd\\s*[:=]"
        description: "Password in comment"
      - pattern: "#.*api.?key\\s*[:=]|#.*secret.?key\\s*[:=]"
        description: "API key or secret in comment"
      - pattern: "#.*token\\s*[:=]|#.*access.?token\\s*[:=]"
        description: "Token in comment"
      - pattern: "#.*TODO.*password|#.*FIXME.*password"
        description: "TODO/FIXME with password reference"
      - pattern: "#.*admin.*password|#.*root.*password"
        description: "Admin/root password reference in comment"

    safe_patterns:
      - "# TODO: secure"
      - "# FIXME: validation"

  # ===== A10 - Mishandling of Exceptional Conditions =====
  - category: empty-catch
    owasp: A10
    severity: HIGH

    description: |
      空catch块：异常被静默捕获不做任何处理。
      可能隐藏安全问题和程序错误。

    detection:
      taint_sinks:
        - "except.*:"
        - "pass"
        - "..."

      steps:
        - "定位except块"
        - "检查处理内容"
        - "判断是否为空"

      safety_conditions:
        - "记录日志"
        - "重新抛出异常"

    remediation:
      principle: "异常必须记录日志或适当处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加日志记录"
        - "或重新抛出异常"

    patterns:
      - pattern: "except.*:\\s*pass"
        description: "Empty except block — exception silently swallowed"
      - pattern: "except.*:\\s*\\.\\.\\."
        description: "Except block with only ellipsis"

    safe_patterns:
      - "logger\\."
      - "logging\\."
      - "raise"

  - category: broad-exception
    owasp: A10
    severity: MEDIUM

    description: |
      宽泛异常捕获：捕获Exception或BaseException基类。
      可能掩盖特定错误，影响调试和安全检测。

    detection:
      taint_sinks:
        - "except Exception"
        - "except BaseException"

      steps:
        - "定位except块"
        - "检查捕获的异常类型"
        - "判断是否过于宽泛"

      safety_conditions:
        - "捕获具体异常类型"

    remediation:
      principle: "捕获具体的异常类型而非基类"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "捕获具体的异常类型"
        - "分别处理不同异常"

    patterns:
      - pattern: "except Exception\\s*:"
        description: "Catching base Exception class — masks specific failures"
      - pattern: "except BaseException\\s*:"
        description: "Catching BaseException — masks KeyboardInterrupt/SystemExit"

    safe_patterns:
      - "except ValueError"
      - "except IOError"
      - "except TypeError"

  - category: unhandled-edge-case
    owasp: A10
    severity: MEDIUM

    description: |
      未处理的边界情况：用户输入直接用于类型转换或索引。
      可能导致程序崩溃或异常。

    detection:
      taint_sinks:
        - "int("
        - "[]"
        - "float("
        - ".split("

      steps:
        - "定位类型转换或索引操作"
        - "检查是否有错误处理"
        - "判断是否需要保护"

      safety_conditions:
        - "使用try/except"
        - "使用验证函数"

    remediation:
      principle: "对可能失败的操作添加错误处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加try/except处理"
        - "或添加验证逻辑"

    patterns:
      - pattern: "int\\(.*request|int\\(.*input"
        description: "Direct int conversion from user input without try/except"
      - pattern: "\\[.*request.*\\]|\\[.*input.*\\]"
        description: "Direct indexing with user input without bounds check"
      # 通用 patterns - URL路径int转换
      - pattern: "int\\(.*path.*split"
        description: "URL path int conversion without try/except"
      - pattern: "= int\\([^)]*split"
        description: "Direct int conversion from split result"
      - pattern: "int\\(.*\\[.*\\]"
        description: "Int conversion from list/index access"

    safe_patterns:
      - "try"
      - "validate"
      - "if.*is not None"
      - "except"
      - "ValueError"

  - category: error-information-leak
