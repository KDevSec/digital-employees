        - "amount ="
        - "quantity ="

      steps:
        - "定位业务参数来源"
        - "检查是否有验证"
        - "判断是否可被篡改"

      safety_conditions:
        - "从数据库或后端获取"
        - "验证参数范围"

    remediation:
      principle: "关键业务参数从后端获取或严格验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "从数据库获取价格等关键参数"
        - "验证数量范围"

    patterns:
      - pattern: "price.*=.*request|amount.*=.*request|discount.*=.*request"
        description: "Price/amount/discount from request without validation"
      - pattern: "quantity.*=.*request\\.json"
        description: "Quantity from request without bounds check"

    safe_patterns:
      - "validate"
