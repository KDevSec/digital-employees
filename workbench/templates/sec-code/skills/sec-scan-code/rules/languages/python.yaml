      - "ldap3\\."

  - category: nosql-injection
    owasp: A05
    severity: HIGH

    description: |
      NoSQL注入：用户输入直接用于MongoDB等NoSQL查询。
      攻击者可以绕过查询条件或执行任意操作。

    detection:
      taint_sinks:
        - "$where"
        - "find("
        - "find_one("

      steps:
        - "定位NoSQL查询函数"
        - "检查查询条件来源"
        - "判断是否包含用户输入"

      safety_conditions:
        - "验证和清理用户输入"
        - "避免使用$where"

    remediation:
      principle: "验证用户输入，避免使用$where操作符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证和清理用户输入"
        - "禁止使用$where执行JavaScript"

    patterns:
      - pattern: "\\$where.*request|\\$where.*input"
        description: "MongoDB $where with user input"
      - pattern: "find\\(.*request|find_one\\(.*request"
