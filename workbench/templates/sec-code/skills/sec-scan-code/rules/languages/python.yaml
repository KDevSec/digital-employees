        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 escape_filter_chars 转义"
        - "使用参数化LDAP查询"

    patterns:
      - pattern: "search_s\\(.*%s|search_s\\(.*\\.format|search_s\\(.*f['\"]"
        description: "LDAP search with string formatting"

    safe_patterns:
