  # ===== SUPPLY-CHAIN-ATTACKS - Time Bomb =====
  - category: time-bomb
    owasp: SUPPLY-CHAIN-ATTACKS
    severity: HIGH

    description: |
      时间炸弹：代码中存在基于时间的触发逻辑，可能在特定日期或时间后执行恶意操作。
      包括硬编码日期比较、Unix时间戳比较、超长sleep后执行操作、
      可疑crontab操作、定时任务框架配合可疑操作等模式。

    detection:
      taint_sinks:
        - "datetime.now()"
        - "time.time()"
        - "time.sleep("
        - "os.system("
        - "subprocess.call("
        - "subprocess.Popen("
        - "schedule.every("

      steps:
        - "定位所有日期/时间比较操作"
        - "检查是否存在硬编码的日期或时间戳阈值"
        - "检查是否存在超长sleep（数天以上）"
        - "检查时间条件后是否执行危险操作"
        - "检查是否存在可疑的crontab操作"

      safety_conditions:
        - "时间比较用于正常的业务逻辑（如许可证过期检查）"
        - "sleep用于合理的等待场景（如重试间隔）"
        - "定时任务有明确的业务用途和注释"
        - "代码在测试文件中"

    remediation:
      principle: "移除时间炸弹逻辑，所有定时操作必须有明确的业务用途和审计日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "需要定时任务"
          use: "使用受监控的调度系统，添加审计日志"
        - scenario: "需要过期检查"
          use: "使用配置化的过期策略，添加告警机制"

      requirements:
        - "移除硬编码的日期/时间触发条件"
        - "所有定时操作必须可配置和可审计"
        - "禁止超长sleep后执行危险操作"

    patterns:
      - pattern: "datetime\\.now\\(\\)\\s*>\\s*datetime\\("
