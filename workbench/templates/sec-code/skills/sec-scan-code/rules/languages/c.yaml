  # ===== A05 - Injection (was A03 in 2021) =====
  - category: unsafe-string-function
    owasp: A05
    severity: HIGH

    description: |
      不安全的字符串函数：使用 strcpy、strcat、sprintf、gets 等无长度限制的字符串函数。
      可能导致缓冲区溢出，攻击者可执行任意代码。

    detection:
      taint_sinks:
        - "strcpy("
        - "strcat("
        - "sprintf("
        - "gets("
        - "wcscpy("
        - "sscanf("

      steps:
        - "定位不安全的字符串函数调用"
        - "检查目标缓冲区大小"
        - "判断源数据长度是否可控"
        - "检查是否使用了安全的替代函数"

      safety_conditions:
        - "使用 strncpy/strncat/snprintf"
        - "使用 strcpy_s/strcat_s/sprintf_s"
        - "目标缓冲区大小经过验证"

    remediation:
      principle: "使用带长度限制的安全字符串函数"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "字符串复制"
          use: "strncpy(dest, src, sizeof(dest) - 1) 或 strcpy_s"

        - scenario: "字符串拼接"
          use: "strncat(dest, src, sizeof(dest) - strlen(dest) - 1)"

        - scenario: "格式化输出"
          use: "snprintf(buffer, sizeof(buffer), fmt, ...)"

      requirements:
        - "替换 strcpy 为 strncpy 或 strcpy_s"
        - "替换 strcat 为 strncat 或 strcat_s"
        - "替换 sprintf 为 snprintf 或 sprintf_s"
        - "禁止使用 gets，使用 fgets"

    patterns:
      - pattern: "\\bstrcpy\\s*\\(|\\bstrcat\\s*\\(|\\bsprintf\\s*\\("
        description: "使用不安全的字符串函数 (strcpy/strcat/sprintf)"
      - pattern: "\\bwcscpy\\s*\\(|\\bmbscpy\\s*\\("
        description: "使用不安全的宽字符串函数"
      - pattern: "\\bgets\\s*\\("
        description: "使用不安全的 gets 函数"
      - pattern: "\\bsscanf\\s*\\([^,]*,%[^0-9]"
        description: "sscanf 未限制字符串长度"

    safe_patterns:
      - "strncpy"
      - "strncat"
      - "snprintf"
      - "strcpy_s"
      - "strcat_s"
      - "sprintf_s"

