# =====================================================
# C/C++ 安全编码规范规则
# 来源：产品安全编码规范-C V2.0 + C++扩展规则
# 生成时间：2026-05-28
# 版本：3.1
# 说明：支持大模型上下文分析和修复方案生成
# =====================================================

language: c
file_extensions: [".c", ".h", ".cpp", ".hpp", ".cc", ".cxx", ".hxx"]
version: "3.1"

# =====================================================
# 扫描输出格式要求（重要）
# =====================================================
# 发现漏洞后，必须按以下格式输出：
#
# ## 漏洞报告
#
# **漏洞类型**: [category名称]
# **OWASP分类**: [owasp编号]
# **严重级别**: [severity]
# **文件位置**: [文件名:行号]
#
# **漏洞描述**:
# [描述该漏洞的原理和危害]
#
# **漏洞代码**:
# ```c
# [原始漏洞代码]
# ```
#
# **数据流分析**:
# - 污点源: [用户输入来源]
# - 污点汇聚: [危险函数调用]
# - 数据流路径: [描述数据如何从源头流到汇聚点]
#
# **修复方案**:
#
# 修复原则: [简述修复原则]
#
# 修复后代码:
# ```c
# [根据原始代码生成的修复后代码，保持原有逻辑，只修复漏洞点]
# ```
#
# 修复说明: [解释修复代码的改动点]
#
# =====================================================

# 全局配置：用户输入源（污点源）
taint_sources:
  - name: "命令行参数"
    patterns:
      - "argv"
      - "argc"
      - "getopt("
      - "getopt_long("

  - name: "环境变量"
    patterns:
      - "getenv("
      - "environ"
      - "__environ"

  - name: "标准输入"
    patterns:
      - "scanf("
      - "fscanf("
      - "sscanf("
      - "gets("
      - "fgets("
      - "getchar("
      - "getc("
      - "fgetc("
      - "read("
      - "fread("

  - name: "网络输入"
    patterns:
      - "recv("
      - "recvfrom("
      - "recvmsg("
      - "accept("
      - "read("

  - name: "文件输入"
    patterns:
      - "fopen("
      - "open("
      - "fread("
      - "fgets("
      - "fscanf("

  - name: "Web请求"
    patterns:
      - "request"
      - "input"
      - "param"
      - "query"

rules:
  # ===== A01 - Broken Access Control (2025: now includes SSRF) =====
  - category: missing-auth
    owasp: A01
    severity: CRITICAL

    description: |
      缺少身份验证：请求处理函数未进行身份验证检查。
      攻击者可以绕过身份验证直接访问受保护资源或执行敏感操作。

    detection:
      taint_sinks:
        - "handle_request("
        - "process_request("
        - "handle_"

      steps:
        - "定位请求处理函数"
        - "检查函数开头是否有身份验证检查"
        - "判断是否缺少身份验证逻辑"

      safety_conditions:
        - "函数开头调用 check_permission 或 verify_access"
        - "存在身份验证检查逻辑"

    remediation:
      principle: "所有请求处理函数必须在开头进行身份验证检查"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加身份验证检查函数调用"
        - "验证失败时返回错误或重定向"
        - "记录未授权访问尝试"

    patterns:
      - pattern: "handle_request\\("
        description: "Request handler without auth check"
    safe_patterns:
      - "check_permission"
      - "verify_access"
      - "is_authenticated"

  - category: privilege-escalation
    owasp: A01
    severity: HIGH

    description: |
      权限提升漏洞：使用硬编码的角色字符串或UID检查进行权限验证。
      攻击者可能通过修改请求参数或利用逻辑缺陷提升权限。

    detection:
      taint_sinks:
        - "strcmp("
        - "strncmp("
        - "uid"
        - "getuid("

      steps:
        - "定位角色检查或UID检查代码"
        - "检查是否使用硬编码字符串比较"
        - "判断是否使用安全的权限检查机制"

      safety_conditions:
        - "使用 check_permission 或 has_capability 函数"
        - "权限检查基于角色系统而非硬编码"

    remediation:
      principle: "使用基于角色的权限系统，避免硬编码权限检查"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换硬编码检查为权限验证函数"
        - "使用基于角色的访问控制(RBAC)"
        - "权限检查应集中管理"

    patterns:
      - pattern: "strcmp.*role.*admin|strncmp.*role.*admin"
        description: "Hardcoded role string comparison"
      - pattern: "uid\\s*==\\s*0|getuid\\(\\)\\s*==\\s*0"
        description: "Root UID check instead of capability check"
    safe_patterns:
      - "check_permission"
      - "verify_access"
      - "has_capability"

  - category: insecure-direct-object-reference
    owasp: A01
    severity: HIGH

    description: |
      不安全的直接对象引用：使用用户输入的ID直接访问数据对象，未验证用户是否有权访问该对象。
      攻击者可以通过修改ID参数访问其他用户的数据。

    detection:
      taint_sinks:
        - "get_record("
        - "find_by_id("
        - "query("

      steps:
        - "定位数据查询函数调用"
        - "检查参数是否来自用户输入"
        - "判断是否验证了用户对数据的访问权限"

      safety_conditions:
        - "查询前验证用户是否有权访问该数据"
        - "使用 check_owner 或 verify_access 函数"

    remediation:
      principle: "验证用户对请求的数据对象具有访问权限"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加数据所有权验证"
        - "验证用户有权访问请求的记录"
        - "拒绝未授权的访问请求"

    patterns:
      - pattern: "get_record\\(.*request|find_by_id\\(.*input"
        description: "Record lookup with user-controlled ID without ownership check"
    safe_patterns:
      - "check_owner"
      - "verify_access"

  - category: ssrf-url
    owasp: A01
    severity: HIGH

    description: |
      服务端请求伪造(SSRF)：使用用户控制的URL发起服务端请求。
      攻击者可以访问内部服务、云元数据端点或发起端口扫描。

    detection:
      taint_sinks:
        - "curl_easy_setopt("
        - "neon_request("
        - "http_get("
        - "http_post("

      steps:
        - "定位HTTP客户端调用"
        - "检查URL参数是否来自用户输入"
        - "判断是否进行了URL白名单验证"

      safety_conditions:
        - "URL经过白名单验证"
        - "禁止访问内网IP地址"
        - "使用 ALLOWED_HOSTS 机制"

    remediation:
      principle: "验证用户提供的URL，使用白名单限制允许访问的主机"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "实现URL白名单验证"
        - "禁止访问内网IP和元数据端点"
        - "限制允许的协议(仅HTTP/HTTPS)"

    patterns:
      - pattern: "curl_easy_setopt.*url.*request|curl_easy_setopt.*url.*input"
        description: "libcurl with user-controlled URL"
      - pattern: "neon_request\\(.*input|http_get\\(.*input"
        description: "HTTP client with user-controlled URL"
    safe_patterns:
      - "validate_url"
      - "ALLOWED_HOSTS"
      - "whitelist"

  - category: ssrf-dns
    owasp: A01
    severity: MEDIUM

    description: |
      DNS重绑定攻击：使用用户输入的主机名进行DNS解析，未验证解析结果。
      攻击者可能通过DNS重绑定绕过IP限制访问内网服务。

    detection:
      taint_sinks:
        - "getaddrinfo("
        - "gethostbyname("
        - "res_query("

      steps:
        - "定位DNS解析函数调用"
        - "检查主机名参数是否来自用户输入"
        - "判断是否验证了解析后的IP地址"

      safety_conditions:
        - "验证解析后的IP地址不在内网范围"
        - "使用主机名白名单"

    remediation:
      principle: "验证DNS解析结果，确保不访问内网地址"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证解析后的IP地址"
        - "拒绝内网IP地址(10.x, 172.16-31.x, 192.168.x, 127.x)"
        - "使用主机名白名单"

    patterns:
      - pattern: "getaddrinfo\\(.*input|gethostbyname\\(.*input"
        description: "DNS resolution with user input"
    safe_patterns:
      - "validate_hostname"
      - "ALLOWED_HOSTS"

  # ===== A02 - Security Misconfiguration (was A05 in 2021) =====
  - category: default-credentials
    owasp: A02
    severity: HIGH

    description: |
      默认凭证：代码中包含默认密码或硬编码的凭证。
      攻击者可以使用这些已知凭证获取系统访问权限。

    detection:
      taint_sinks:
        - "password"
        - "passwd"
        - "secret"
        - "credential"

      steps:
        - "扫描代码中的密码赋值语句"
        - "检查是否使用硬编码密码值"
        - "判断是否为常见默认密码"

      safety_conditions:
        - "密码从环境变量或配置文件读取"
        - "无硬编码密码字符串"

    remediation:
      principle: "移除硬编码密码，使用安全的凭证管理方式"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除硬编码密码"
        - "使用环境变量或安全配置存储密码"
        - "首次使用时强制修改默认密码"

    patterns:
      - pattern: "password.*=.*\"admin\"|password.*=.*\"123456\"|password.*=.*\"password\""
        description: "Default/hardcoded password"
    safe_patterns: []

  - category: verbose-errors
    owasp: A02
    severity: MEDIUM

    description: |
      详细错误信息：向用户暴露系统内部的详细错误信息。
      攻击者可利用这些信息了解系统架构、路径、版本等敏感信息。

    detection:
      taint_sinks:
        - "perror("
        - "strerror("
        - "fprintf(stderr,"

      steps:
        - "定位错误处理代码"
        - "检查是否输出详细系统错误信息"
        - "判断错误信息是否暴露给用户"

      safety_conditions:
        - "使用通用错误消息替代系统错误"
        - "详细错误仅记录到日志"

    remediation:
      principle: "向用户返回通用错误消息，详细信息仅记录日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换详细错误为通用消息"
        - "将详细错误记录到服务器日志"
        - "避免暴露文件路径和系统信息"

    patterns:
      - pattern: "perror\\(.*strerror|fprintf\\(stderr.*strerror"
        description: "Error message with system details"
    safe_patterns:
      - "sanitize_error"

  - category: cors-wildcard
    owasp: A02
    severity: MEDIUM

    description: |
      CORS通配符配置：Access-Control-Allow-Origin设置为通配符*。
      允许任意来源的跨域请求，可能导致敏感数据泄露。

    detection:
      taint_sinks:
        - "Access-Control-Allow-Origin"
        - "CORS"

      steps:
        - "定位CORS头设置代码"
        - "检查是否使用通配符*"
        - "判断是否应限制允许的来源"

      safety_conditions:
        - "明确指定允许的来源列表"
        - "不使用通配符*"

    remediation:
      principle: "明确指定允许跨域访问的来源列表，避免使用通配符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换通配符为具体的允许来源"
        - "使用白名单验证来源"
        - "考虑凭证模式的安全性"

    patterns:
      - pattern: "Access-Control-Allow-Origin.*\\*"
        description: "CORS header with wildcard"
    safe_patterns:
      - "allowed_origins"

  - category: debug-enabled
    owasp: A02
    severity: HIGH

    description: |
      调试模式开启：生产环境中启用了调试模式或调试宏。
      可能暴露敏感信息、禁用安全检查或开启调试接口。

    detection:
      taint_sinks:
        - "NDEBUG"
        - "#define DEBUG"
        - "debug_mode"

      steps:
        - "检查是否定义了DEBUG宏"
        - "检查NDEBUG宏是否未定义"
        - "判断是否在生产环境使用"

      safety_conditions:
        - "NDEBUG宏已定义"
        - "DEBUG宏未定义或条件编译"

    remediation:
      principle: "生产环境禁用调试模式，确保NDEBUG已定义"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "定义NDEBUG宏"
        - "移除或注释DEBUG宏定义"
        - "使用条件编译控制调试代码"

    patterns:
      - pattern: "NDEBUG|#define DEBUG"
        description: "Debug macro defined"
    safe_patterns:
      - "NDEBUG"

  - category: unnecessary-features
    owasp: A02
    severity: MEDIUM

    description: |
      不必要的功能：启用了不必要的调试或性能分析功能。
      可能影响性能或暴露敏感信息。

    detection:
      taint_sinks:
        - "setvbuf("
        - "_IONBF"
        - "setbuf("

      steps:
        - "定位调试或性能相关配置"
        - "判断是否在生产环境中必要"
        - "检查是否可能影响安全性"

      safety_conditions:
        - "功能仅在开发/调试时启用"
        - "生产环境禁用不必要的功能"

    remediation:
      principle: "生产环境禁用不必要的调试和性能分析功能"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除或条件编译调试功能"
        - "使用条件判断控制功能开关"

    patterns:
      - pattern: "setvbuf\\(.*_IONBF"
        description: "Unbuffered I/O (performance debug feature)"
    safe_patterns:
      - "production"

  # ===== A03 - Supply Chain Failures (was A06 in 2021) =====
  - category: known-vulnerability
    owasp: A03
    severity: HIGH

    description: |
      已知漏洞依赖：使用存在已知安全漏洞的第三方库版本。
      攻击者可利用已知漏洞攻击系统。

    detection:
      taint_sinks:
        - "openssl"
        - "libcurl"
        - "VERSION"

      steps:
        - "检查依赖库版本号"
        - "比对已知漏洞数据库"
        - "判断是否存在已知漏洞"

      safety_conditions:
        - "使用最新稳定版本"
        - "版本无已知高危漏洞"

    remediation:
      principle: "升级到无已知漏洞的最新稳定版本"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "升级到安全版本"
        - "定期检查漏洞公告"
        - "建立依赖更新流程"

    patterns:
      - pattern: "openssl.*1\\.0\\.[01]|openssl.*1\\.1\\.0[a-f]"
        description: "Known vulnerable OpenSSL version"
      - pattern: "libcurl.*7\\.[0-5][0-9]"
        description: "Potentially outdated libcurl version"
    safe_patterns:
      - "vulnerability"
      - "latest"

  - category: outdated-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      过时的依赖：使用过时的依赖版本，可能缺少安全修复。
      建议使用最新稳定版本。

    detection:
      taint_sinks:
        - "find_package("
        - "VERSION"

      steps:
        - "检查依赖版本配置"
        - "比对最新稳定版本"
        - "判断是否需要更新"

      safety_conditions:
        - "使用相对较新的版本"
        - "版本仍在维护周期内"

    remediation:
      principle: "定期更新依赖到最新稳定版本"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "更新到较新版本"
        - "测试兼容性后升级"

    patterns:
      - pattern: "find_package.*VERSION [0-9]"
        description: "CMake find_package with pinned version"
    safe_patterns:
      - "latest"

  - category: insecure-pipeline
    owasp: A03
    severity: HIGH

    description: |
      不安全的流水线：CI/CD流水线中下载资源未进行完整性验证。
      攻击者可能通过中间人攻击注入恶意代码。

    detection:
      taint_sinks:
        - "system("
        - "curl"
        - "wget"

      steps:
        - "定位下载命令调用"
        - "检查是否验证下载内容的完整性"
        - "判断是否使用安全传输"

      safety_conditions:
        - "下载后验证校验和或签名"
        - "使用HTTPS而非HTTP"

    remediation:
      principle: "验证下载资源的完整性和真实性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加校验和验证"
        - "使用签名验证"
        - "使用HTTPS下载"

    patterns:
      - pattern: "system\\(.*curl|system\\(.*wget"
        description: "Downloading via system() without verification"
    safe_patterns:
      - "verify"
      - "checksum"

  - category: unverified-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      未验证的动态库：从用户输入加载动态库。
      攻击者可能加载恶意库执行任意代码。

    detection:
      taint_sinks:
        - "dlopen("
        - "LoadLibrary("

      steps:
        - "定位动态库加载调用"
        - "检查库路径是否来自用户输入"
        - "判断是否验证了库的来源"

      safety_conditions:
        - "库路径为硬编码或白名单"
