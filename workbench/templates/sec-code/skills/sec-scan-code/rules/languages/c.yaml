        - "无重复释放"

    remediation:
      principle: "释放后置空指针，数组使用 delete[]，避免重复释放"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "free/delete 后立即置 NULL/nullptr"
        - "数组使用 delete[]"
        - "检查指针有效性后再释放"

    patterns:
      - pattern: "\\bdelete\\s+\\w+\\s*;"
        description: "delete 数组应使用 delete[]"
      - pattern: "\\bfree\\s*\\([^)]+)\\s*;[^}]*\\bfree\\s*\\(\\1\\)"
        description: "可能存在 double free"
      - pattern: "\\bfree\\s*\\([^)]+)\\s*;[^}]*\\b\\1\\s*->"
        description: "free 后使用 (UAF)"
      - pattern: "\\bmemcpy\\s*\\([^,]+,\\s*[^,]+,\\s*[^)]+\\)"
        description: "memcpy 可能导致缓冲区溢出"

    safe_patterns:
      - "delete[]"
      - "NULL"
      - "nullptr"
      - "size_check"

  - category: integer-overflow
    owasp: A05
    severity: MEDIUM

    description: |
      整数溢出：内存分配时参数乘法可能导致整数溢出。
      可能导致分配过小的缓冲区，随后的写入造成缓冲区溢出。

    detection:
      taint_sinks:
        - "malloc("
        - "calloc("
        - "realloc("
        - "memcpy("

      steps:
        - "定位内存分配调用"
        - "检查参数是否包含乘法运算"
        - "判断是否可能发生溢出"

      safety_conditions:
        - "使用 SIZE_MAX 检查"
        - "使用安全的乘法函数"

    remediation:
      principle: "在乘法运算前检查是否会导致整数溢出"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "检查乘法结果是否超过 SIZE_MAX"
        - "使用 calloc 替代 malloc(n*size)"
        - "添加溢出检查"

    patterns:
      - pattern: "\\bmalloc\\s*\\(\\s*[^)]+\\s*\\*\\s*[^)]+\\)"
        description: "malloc 参数乘法可能发生整数溢出"
      - pattern: "\\bcalloc\\s*\\(\\s*[^,]+\\s*,\\s*[^)]+\\)"
        description: "calloc 参数需检查溢出"
      - pattern: "\\brealloc\\s*\\(\\s*[^,]+\\s*,\\s*[^)]+\\)"
        description: "realloc 参数需检查溢出"
      - pattern: "\\bmemcpy\\s*\\([^,]+,\\s*[^,]+,\\s*\\w+\\s*\\*\\s*\\w+\\)"
        description: "memcpy 大小参数含乘法运算"

    safe_patterns:
      - "SIZE_MAX"
      - "overflow_check"
      - "safe_mul"
      - "if.*>.*SIZE_MAX"

  - category: off-by-one
    owasp: A05
    severity: MEDIUM

    description: |
      Off-By-One 错误：数组索引或循环边界存在差一错误。
      可能导致越界读写，破坏内存或执行任意代码。

    detection:
      taint_sinks:
        - "array["
        - "for("

      steps:
        - "定位数组索引和循环边界"
        - "检查索引是否可能越界"
        - "判断循环条件是否正确"

      safety_conditions:
        - "循环使用 < 而非 <="
        - "边界检查正确"

    remediation:
      principle: "仔细检查数组边界和循环条件，使用 < 替代 <="

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "循环边界使用正确的比较运算符"
        - "添加边界检查"

    patterns:
      - pattern: "\\[\\s*\\w+\\s*\\+\\s*1\\s*\\]|\\[\\s*\\w+\\s*-\\s*1\\s*\\]"
        description: "数组索引可能存在边界错误"
      - pattern: "\\bfor\\s*\\(.*<=.*\\)"
        description: "循环条件使用 <= 可能导致越界"
      - pattern: "\\bfor\\s*\\(.*<.*-\\s*1\\)"
        description: "循环边界减1可能存在错误"

    safe_patterns:
      - "\\bfor\\s*\\(.*<.*\\)"
      - "size_check"
      - "bounds_check"

  - category: uninitialized-variable
    owasp: A05
    severity: MEDIUM

    description: |
      未初始化变量：局部变量声明后未初始化就使用。
      可能导致不可预测的行为，信息泄露或安全检查绕过。

    detection:
      taint_sinks:
        - "int "
        - "char "
        - "float "
        - "double "
        - "* "

      steps:
        - "定位变量声明"
        - "检查是否有初始化"
        - "判断使用前是否赋值"

      safety_conditions:
        - "声明时初始化"
        - "使用前确保赋值"

    remediation:
      principle: "变量声明时立即初始化，避免使用未定义的值"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "声明时初始化为 0、NULL 或 nullptr"
        - "使用构造函数初始化类成员"

    patterns:
      - pattern: "int\\s+\\w+\\s*;"
        description: "未初始化的整型变量"
      - pattern: "char\\s+\\w+\\s*\\["
        description: "未初始化的字符数组"
      - pattern: "float\\s+\\w+\\s*;|double\\s+\\w+\\s*;"
        description: "未初始化的浮点变量"
      - pattern: "pointer\\s*\\*\\s*\\w+\\s*;"
        description: "未初始化的指针"

    safe_patterns:
      - "= 0"
      - "= NULL"
      - "= nullptr"
      - "{}"

  - category: buffer-overflow
    owasp: A05
    severity: CRITICAL

    description: |
      缓冲区溢出：向缓冲区写入超过其大小的数据。
      攻击者可以覆盖返回地址，执行任意代码。

    detection:
      taint_sinks:
        - "memcpy("
        - "strcpy("
        - "gets("
        - "scanf("

      steps:
        - "定位内存写入操作"
        - "检查目标缓冲区大小"
        - "检查写入数据长度是否可控"
        - "判断是否可能溢出"

      safety_conditions:
        - "使用带长度检查的函数"
        - "目标缓冲区足够大"

    remediation:
      principle: "使用带长度限制的函数，验证写入长度"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 strncpy/snprintf 替代 strcpy/sprintf"
        - "检查 memcpy 的长度参数"
        - "禁止使用 gets"

    patterns:
      - pattern: "\\bmemcpy\\s*\\(\\s*[^,]+\\s*,\\s*[^,]+\\s*,\\s*\\w+\\s*\\)"
        description: "memcpy 需检查目标缓冲区大小"
      - pattern: "\\bstrcpy\\s*\\(\\s*[^,]+\\s*,\\s*[^)]+\\s*\\)"
        description: "strcpy 可能导致缓冲区溢出"
      - pattern: "\\bgets\\s*\\("
        description: "gets 函数极易导致缓冲区溢出"

    safe_patterns:
      - "strncpy"
      - "snprintf"
      - "size_check"
      - "sizeof"

  - category: null-pointer
    owasp: A05
    severity: MEDIUM

    description: |
      空指针解引用：在未检查指针是否为空的情况下使用指针。
      导致程序崩溃或拒绝服务。

    detection:
      taint_sinks:
        - "malloc("
        - "calloc("
        - "new "

      steps:
        - "定位内存分配或指针使用"
        - "检查分配后是否有 NULL 检查"
        - "判断是否可能解引用空指针"

      safety_conditions:
        - "分配后检查返回值"
        - "使用前检查指针"

    remediation:
      principle: "内存分配后检查返回值，使用前检查指针有效性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "malloc/new 后检查是否为 NULL"
        - "使用前检查指针有效性"
        - "返回 NULL 时有错误处理"

    patterns:
      - pattern: "\\bmalloc\\s*\\([^)]+)\\s*;[^}]*\\b\\1\\s*->"
        description: "malloc 后未检查 NULL 就使用"
      - pattern: "\\bnew\\s+\\w+[^}]*->"
        description: "new 后未检查空指针"

    safe_patterns:
      - "if.*==.*NULL"
      - "if.*!=.*NULL"
      - "nullptr_check"

  - category: template-injection
    owasp: A05
    severity: HIGH

    description: |
      模板注入：用户输入直接传递给模板引擎渲染。
      攻击者可以注入模板语法执行任意代码或访问敏感数据。

    detection:
      taint_sinks:
        - "ctemplate("
        - "mustache_render("
        - "render_template("

      steps:
        - "定位模板渲染调用"
        - "检查模板内容是否包含用户输入"
        - "判断是否经过转义处理"

      safety_conditions:
        - "模板内容不包含用户输入"
        - "用户输入经过转义处理"

    remediation:
      principle: "对用户输入进行转义处理，避免直接嵌入模板"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "对用户输入进行HTML转义"
        - "使用模板引擎的自动转义功能"
        - "限制模板中允许的变量"

    patterns:
      - pattern: "ctemplate\\(.*input|mustache_render\\(.*input"
        description: "Template rendering with user input"
    safe_patterns:
      - "sanitize"
      - "escape"

  - category: ldap-injection
    owasp: A05
    severity: HIGH

    description: |
      LDAP注入：用户输入直接拼接到LDAP查询中。
      攻击者可以绕过认证或获取未授权的目录数据。

    detection:
      taint_sinks:
        - "ldap_search("
        - "ldap_search_s("
        - "ldap_search_ext("

      steps:
        - "定位LDAP搜索调用"
        - "检查过滤条件是否包含用户输入"
        - "判断是否经过转义处理"

      safety_conditions:
        - "LDAP过滤器参数经过转义"
        - "使用ldap_escape处理用户输入"

    remediation:
      principle: "对LDAP查询中的用户输入进行转义处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用ldap_escape转义特殊字符"
        - "使用参数化LDAP查询"
        - "限制查询范围"

    patterns:
      - pattern: "ldap_search\\(.*input|ldap_search_s\\(.*input"
        description: "LDAP search with user input"
    safe_patterns:
      - "sanitize"
      - "ldap_escape"

  - category: nosql-injection
    owasp: A05
    severity: HIGH

    description: |
      NoSQL注入：用户输入直接用于构造NoSQL查询。
      攻击者可以绕过查询逻辑或执行未授权操作。

    detection:
      taint_sinks:
        - "bson_append("
        - "mongoc_collection_find("
        - "mongo_find("

      steps:
        - "定位NoSQL查询构造代码"
        - "检查查询条件是否包含用户输入"
        - "判断是否经过验证处理"

      safety_conditions:
        - "查询条件经过白名单验证"
        - "用户输入经过类型检查"

    remediation:
      principle: "验证和转义NoSQL查询中的用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证输入的类型和格式"
        - "使用白名单限制允许的字段"
        - "转义特殊字符"

    patterns:
      - pattern: "bson_append\\(.*input"
        description: "BSON query construction with user input"
    safe_patterns:
      - "sanitize"
      - "validate_input"

  # ===== A06 - Insecure Design (was A04 in 2021) =====
  - category: missing-rate-limit
    owasp: A06
    severity: HIGH

    description: |
      缺少速率限制：登录等敏感操作未实现速率限制。
      攻击者可以进行暴力破解或拒绝服务攻击。

    detection:
      taint_sinks:
        - "handle_login"
        - "login("
        - "authenticate("

      steps:
        - "定位登录处理函数"
        - "检查是否实现速率限制"
        - "判断是否可以无限次尝试"

      safety_conditions:
        - "实现速率限制机制"
        - "达到限制后锁定账户"

    remediation:
      principle: "实现速率限制，限制单位时间内的尝试次数"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加速率限制检查"
        - "记录失败尝试次数"
        - "超过限制后拒绝请求"

    patterns:
      - pattern: "handle_login"
        description: "Login handler without rate limiting"
    safe_patterns:
      - "rate_limit"
      - "MAX_ATTEMPTS"

  - category: missing-lockout
    owasp: A06
    severity: HIGH

    description: |
      缺少账户锁定：密码验证失败后未实现账户锁定机制。
      攻击者可以进行无限次密码暴力破解。

    detection:
      taint_sinks:
        - "check_password"
        - "verify_password"
        - "password_verify("

      steps:
        - "定位密码验证代码"
        - "检查是否计数失败尝试"
        - "判断是否实现账户锁定"

      safety_conditions:
        - "失败次数达到阈值后锁定账户"
        - "锁定需要时间解锁或管理员解锁"

    remediation:
      principle: "实现账户锁定机制，多次失败后临时锁定账户"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "记录失败尝试次数"
        - "达到阈值后锁定账户"
        - "实现解锁机制"

    patterns:
      - pattern: "check_password|verify_password"
        description: "Password verification without attempt counting"
    safe_patterns:
      - "lockout"
      - "MAX_ATTEMPTS"

  - category: business-logic-flaw
    owasp: A06
    severity: HIGH

    description: |
      业务逻辑缺陷：关键业务参数(如价格、数量)来自用户输入且未验证。
      攻击者可以篡改关键业务数据获利。

    detection:
      taint_sinks:
        - "price"
        - "amount"
        - "quantity"
        - "total"

      steps:
        - "定位业务参数赋值代码"
        - "检查是否来自用户输入"
        - "判断是否有服务端验证"

      safety_conditions:
        - "关键业务参数由服务端计算"
        - "用户输入经过严格验证"

    remediation:
      principle: "关键业务参数由服务端计算和验证，不信任用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "价格等关键参数由服务端确定"
        - "验证用户输入的合理性范围"
        - "添加业务规则验证"

    patterns:
      - pattern: "price.*=.*request|amount.*=.*request"
        description: "Price/amount from request without validation"
    safe_patterns:
      - "validate"

  - category: trust-boundary-violation
    owasp: A06
    severity: HIGH

    description: |
      信任边界违规：未经验证直接将用户数据写入会话。
      攻击者可能伪造会话数据或提升权限。

    detection:
      taint_sinks:
        - "strcpy("
        - "memcpy("
        - "session"

      steps:
        - "定位会话数据写入代码"
        - "检查数据来源是否为用户输入"
        - "判断是否经过验证"

      safety_conditions:
        - "会话数据经过验证后写入"
        - "敏感会话数据由服务端生成"

    remediation:
      principle: "验证所有进入信任边界的用户数据"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证用户输入的会话数据"
        - "敏感数据由服务端生成"
        - "使用签名或加密保护会话"

    patterns:
      - pattern: "strcpy.*session.*request|memcpy.*session.*request"
        description: "Session data from request without validation"
    safe_patterns:
      - "validate"

  - category: thread-safety
    owasp: A06
    severity: MEDIUM

    description: |
      线程安全：多线程访问共享变量未使用同步机制。
      可能导致竞态条件、数据损坏或不可预测的行为。

    detection:
      taint_sinks:
        - "std::thread("
        - "pthread_create("

      steps:
        - "定位线程创建"
        - "识别线程间共享的变量"
        - "检查是否使用互斥锁等同步机制"

      safety_conditions:
        - "使用 std::mutex 保护共享变量"
        - "使用 std::atomic 类型"

    remediation:
      principle: "使用互斥锁或原子操作保护共享变量"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 std::mutex 或 pthread_mutex"
        - "使用 std::lock_guard 自动管理锁"
        - "考虑使用 std::atomic"

    patterns:
      - pattern: "\\bstd::thread\\s*\\(|\\bpthread_create\\s*\\("
        description: "线程创建需确保共享变量的线程安全"
      - pattern: "\\bstd::mutex\\s*\\w+\\s*;"
        description: "互斥量声明"
      - pattern: "\\bstd::atomic\\s*<"
        description: "原子操作"

    safe_patterns:
      - "std::mutex"
      - "std::lock_guard"
      - "std::atomic"
      - "pthread_mutex_lock"

  # ===== A07 - Identification and Authentication Failures =====
  - category: weak-password
    owasp: A07
    severity: MEDIUM

    description: |
      弱密码策略：密码长度或复杂度要求过低。
      用户容易设置弱密码，增加被破解风险。

    detection:
      taint_sinks:
        - "strlen("
        - "password"
        - "MIN_LEN"

      steps:
        - "定位密码长度检查代码"
        - "检查最小长度要求"
        - "判断是否满足安全标准"

      safety_conditions:
        - "密码最小长度 >= 8"
        - "要求包含多种字符类型"

    remediation:
      principle: "强制要求足够强度的密码(至少8位，包含多种字符类型)"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "密码最小长度 >= 8"
        - "要求大小写字母、数字、特殊字符"
        - "检查常见弱密码"

    patterns:
      - pattern: "strlen.*password.*<.*[1-6]"
        description: "Weak password length check"
    safe_patterns:
      - "bcrypt"
      - "CRYPT_sha256"

  - category: broken-session
    owasp: A07
    severity: HIGH

    description: |
      会话管理缺陷：会话数据未经验证来自用户输入。
      可能导致会话劫持或会话固定攻击。

    detection:
      taint_sinks:
        - "strcpy("
        - "memcpy("
        - "session"

      steps:
        - "定位会话处理代码"
        - "检查会话ID或数据来源"
        - "判断是否可以伪造"

      safety_conditions:
        - "会话ID由服务端生成"
        - "会话数据经过验证"

    remediation:
      principle: "会话ID由服务端使用安全随机数生成，数据经过验证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用安全随机数生成会话ID"
        - "验证会话数据完整性"
        - "登录后重新生成会话ID"

    patterns:
      - pattern: "strcpy.*session.*request|memcpy.*session.*request"
        description: "Session data from request without validation"
    safe_patterns:
      - "validate"

  - category: credential-exposure
    owasp: A07
    severity: HIGH

    description: |
      凭证泄露：密码等凭证在日志、输出或比较中暴露。
      可能导致凭证被获取或通过时序攻击破解。

    detection:
      taint_sinks:
        - "printf("
        - "fprintf("
        - "send("
        - "strcmp("

      steps:
        - "定位密码输出或比较代码"
        - "检查是否泄露密码"
        - "判断比较是否为常量时间"

      safety_conditions:
        - "密码不输出到日志或响应"
        - "使用常量时间比较函数"

    remediation:
      principle: "密码不输出到任何地方，使用常量时间比较函数"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除密码输出语句"
        - "使用CRYPTO_memcmp或constant_time_compare"
        - "日志中脱敏处理"

    patterns:
      - pattern: "printf.*password|fprintf.*password|send.*password"
        description: "Password in output"
      - pattern: "strcmp.*password.*input"
        description: "Plain text password comparison"
    safe_patterns:
      - "constant_time_compare"
      - "CRYPTO_memcmp"

  - category: missing-mfa
    owasp: A07
    severity: MEDIUM

    description: |
      缺少多因素认证：仅使用密码认证，未实现MFA。
      密码泄露后攻击者可直接访问账户。

    detection:
      taint_sinks:
        - "authenticate("
        - "login("
        - "password"

      steps:
        - "定位认证函数"
        - "检查是否支持MFA"
        - "判断是否仅依赖密码"

      safety_conditions:
        - "实现MFA机制"
        - "敏感操作需要二次验证"

    remediation:
      principle: "实现多因素认证，提高账户安全性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加TOTP或短信验证"
        - "敏感操作需要MFA"
        - "提供MFA绑定/解绑功能"

    patterns:
      - pattern: "authenticate.*password|login.*password"
        description: "Login with only password, no MFA"
    safe_patterns:
      - "verify_totp"
      - "check_mfa"

  # ===== A08 - Software and Data Integrity Failures =====
  - category: insecure-deserialization
    owasp: A08
    severity: CRITICAL

    description: |
      不安全的反序列化：直接复制网络数据到内存结构。
      可能导致缓冲区溢出、代码执行或数据篡改。

    detection:
      taint_sinks:
        - "memcpy("
        - "strcpy("
        - "reinterpret_cast<"

      steps:
        - "定位从网络读取数据的代码"
        - "检查是否直接复制到内存结构"
        - "判断是否有边界检查"

      safety_conditions:
        - "数据经过验证后处理"
        - "使用边界检查"

    remediation:
      principle: "验证所有网络数据，使用安全的解析方法"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证数据长度和格式"
        - "使用安全的解析函数"
        - "添加边界检查"

    patterns:
      - pattern: "memcpy.*network|memcpy.*socket"
        description: "Copying network data directly without validation"
    safe_patterns:
      - "validate"
      - "bounds_check"

  - category: insecure-tempfile
    owasp: A08
    severity: MEDIUM

    description: |
      不安全的临时文件：使用不安全的方式创建临时文件。
      可能导致竞态条件、信息泄露或符号链接攻击。

    detection:
      taint_sinks:
        - "tmpnam("
        - "tempnam("
        - "mktemp("
        - "\"/tmp/"
        - "fopen("
        - "open("

      steps:
        - "定位临时文件创建"
        - "检查是否使用安全函数"
        - "判断是否存在竞态风险"

      safety_conditions:
        - "使用 mkstemp"
        - "使用 tmpfile"

    remediation:
      principle: "使用 mkstemp 或 tmpfile 创建安全的临时文件"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 mkstemp 创建临时文件"
        - "使用 mkdtemp 创建临时目录"
        - "禁止使用 tmpnam/mktemp"

    patterns:
      - pattern: "\\btmpnam\\s*\\(|\\btempnam\\s*\\("
        description: "使用不安全的临时文件名函数"
      - pattern: "\"/tmp/\"|\"\\\\TEMP\\\\\""
        description: "硬编码临时文件路径"
      - pattern: "\\bmktemp\\s*\\("
        description: "使用不安全的 mktemp 函数"

    safe_patterns:
      - "mkstemp"
      - "mkdtemp"
      - "tmpfile"

  - category: unsigned-update
    owasp: A08
    severity: HIGH

    description: |
      未签名的更新：下载更新文件未验证完整性或签名。
      攻击者可能通过中间人攻击注入恶意代码。

    detection:
      taint_sinks:
        - "curl"
        - "wget"
        - "URLDownloadToFile"
        - "download("

      steps:
        - "定位文件下载代码"
        - "检查是否验证校验和或签名"
        - "判断是否存在完整性检查"

      safety_conditions:
        - "下载后验证SHA256校验和"
        - "验证数字签名"

    remediation:
      principle: "下载文件后必须验证校验和或数字签名"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加SHA256校验和验证"
        - "验证数字签名"
        - "拒绝未通过验证的文件"

    patterns:
      - pattern: "curl.*download|wget|URLDownloadToFile"
        description: "Download without integrity verification"
    safe_patterns:
      - "SHA256_Verify"
      - "checksum"
      - "verify_signature"

  - category: insecure-cicd
    owasp: A08
    severity: HIGH

    description: |
      不安全的CI/CD：流水线执行未验证的外部命令。
      攻击者可能通过供应链攻击注入恶意代码。

    detection:
      taint_sinks:
        - "system("
        - "popen("
        - "exec("

      steps:
        - "定位CI/CD脚本执行代码"
        - "检查是否验证执行的命令"
        - "判断是否存在完整性检查"

      safety_conditions:
        - "验证命令来源和完整性"
        - "使用签名验证"

    remediation:
      principle: "验证CI/CD执行的命令和代码的完整性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证代码签名"
        - "限制可执行的命令"
        - "记录审计日志"

    patterns:
      - pattern: "system\\(.*git.*pull|system\\(.*make.*install"
        description: "CI/CD running git/make without verification"
    safe_patterns:
      - "verify"
      - "checksum"

  - category: integrity-missing
    owasp: A08
    severity: MEDIUM

    description: |
      缺少完整性验证：网络数据写入文件未验证完整性。
      数据可能被篡改或损坏。

    detection:
      taint_sinks:
        - "fopen("
        - "fwrite("
        - "recv("

      steps:
        - "定位网络数据写入文件的代码"
        - "检查是否有完整性检查"
        - "判断是否可能被篡改"

      safety_conditions:
        - "写入后验证校验和"
        - "使用签名验证"

    remediation:
      principle: "网络数据写入文件后验证完整性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加校验和验证"
        - "使用数字签名"
        - "检测数据篡改"

    patterns:
      - pattern: "fopen.*write.*recv|fwrite.*socket"
        description: "Writing network data to file without integrity check"
    safe_patterns:
      - "checksum"
      - "signature_verify"

  # ===== A09 - Security Logging and Monitoring Failures =====
  - category: missing-logging
    owasp: A09
    severity: MEDIUM

    description: |
      缺少日志记录：错误发生时未记录日志。
      无法进行安全审计和事件分析。

    detection:
      taint_sinks:
        - "if.*error"
        - "if.*fail"
        - "return -1"

      steps:
        - "定位错误处理代码"
        - "检查是否记录日志"
        - "判断是否应记录审计信息"

      safety_conditions:
        - "错误发生时记录日志"
        - "使用syslog或审计模块"

    remediation:
      principle: "所有错误和异常情况必须记录日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加错误日志记录"
        - "使用syslog或审计模块"
        - "记录足够的上下文信息"

    patterns:
      - pattern: "if.*error.*return|if.*fail.*return"
        description: "Error returned without logging"
    safe_patterns:
      - "audit"
      - "syslog"
      - "log_error"

  - category: sensitive-in-log
    owasp: A09
    severity: MEDIUM

    description: |
      日志中包含敏感信息：密码等敏感数据被记录到日志。
      可能导致凭证泄露。

    detection:
      taint_sinks:
        - "printf("
        - "fprintf("
        - "syslog("
        - "password"

      steps:
        - "定位日志记录代码"
        - "检查是否记录敏感数据"
        - "判断是否需要脱敏处理"

      safety_conditions:
        - "日志不包含密码等敏感信息"
        - "敏感数据脱敏后记录"

    remediation:
      principle: "敏感数据不记录到日志，或脱敏后记录"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感数据的日志记录"
        - "对敏感数据进行脱敏处理"
        - "使用占位符替代敏感值"

    patterns:
      - pattern: "printf.*password|fprintf.*password|syslog.*password"
        description: "Sensitive data in log output"
    safe_patterns:
      - "sanitize"

  - category: missing-alert
    owasp: A09
    severity: MEDIUM

    description: |
      缺少告警：安全事件(如登录失败)未触发告警。
      无法及时发现安全攻击。

    detection:
      taint_sinks:
        - "login.*fail"
        - "auth.*fail"
        - "access.*denied"

      steps:
        - "定位安全事件处理代码"
        - "检查是否触发告警"
        - "判断是否需要通知"

      safety_conditions:
        - "安全事件触发告警"
        - "实现告警通知机制"

    remediation:
      principle: "安全事件应触发告警和通知"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加告警触发逻辑"
        - "实现通知机制"
        - "记录安全事件详情"

    patterns:
      - pattern: "login.*fail|auth.*fail|access.*denied"
        description: "Failed login without alerting"
    safe_patterns:
      - "alert"
      - "notify"

  - category: log-injection
    owasp: A09
    severity: MEDIUM

    description: |
      日志注入：用户输入直接写入日志未经验证。
      攻击者可以注入伪造日志条目或进行日志注入攻击。

    detection:
      taint_sinks:
        - "syslog("
        - "printf("
        - "fprintf("

      steps:
        - "定位日志记录代码"
        - "检查是否包含用户输入"
        - "判断是否进行了转义处理"

      safety_conditions:
        - "用户输入经过验证后记录"
        - "转义换行符等特殊字符"

    remediation:
      principle: "验证和转义写入日志的用户输入"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证用户输入格式"
        - "转义换行符等特殊字符"
        - "使用结构化日志格式"

    patterns:
      - pattern: "syslog.*%s.*input|printf.*%s.*request"
        description: "User input in log without sanitization"
    safe_patterns:
      - "validate_input"

  - category: sensitive-comment
    owasp: A09
    severity: LOW

    description: |
      注释敏感信息：代码注释中包含密码、密钥等敏感信息。
      可能导致敏感信息泄露。

    detection:
      taint_sinks:
        - "// password"
        - "// key"
        - "// secret"

      steps:
        - "扫描代码注释"
        - "检查是否包含敏感关键词"
        - "判断是否包含实际敏感值"

      safety_conditions:
        - "注释不包含敏感信息"

    remediation:
      principle: "移除注释中的敏感信息"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "删除注释中的敏感信息"
        - "使用通用描述替代"

    patterns:
      - pattern: "//.*password\\s*[:=]|//.*passwd\\s*[:=]"
        description: "注释中包含密码信息"
      - pattern: "//.*key\\s*[:=]|//.*secret\\s*[:=]"
        description: "注释中包含密钥信息"
      - pattern: "/\\*.*password.*\\*/|/\\*.*secret.*\\*/"
        description: "块注释中的敏感信息"

    safe_patterns:
      - "// TODO"
      - "// FIXME"

  # ===== A10 - Mishandling of Exceptional Conditions (NEW in 2025) =====
  - category: empty-catch
    owasp: A10
    severity: HIGH

    description: |
      空错误处理：错误被捕获但未进行任何处理。
      可能隐藏严重问题，导致难以调试和安全问题。

    detection:
      taint_sinks:
        - "if.*error.*{"
        - "catch.*{"

      steps:
        - "定位错误处理代码块"
        - "检查处理块是否为空"
        - "判断是否应该处理错误"

      safety_conditions:
        - "错误处理块包含日志或错误返回"
        - "不忽略错误继续执行"

    remediation:
      principle: "所有错误必须被正确处理，至少记录日志或返回错误"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加错误日志记录"
        - "返回适当的错误码"
        - "进行必要的清理操作"

    patterns:
      - pattern: "if.*error.*\\{\\s*\\}|catch.*\\{\\s*\\}"
        description: "Empty error handler — error silently swallowed"
    safe_patterns:
      - "log_error"
      - "syslog"
      - "return error"

  - category: broad-exception
    owasp: A10
    severity: MEDIUM

    description: |
      过宽的异常捕获：使用catch-all捕获所有异常。
      可能隐藏特定错误，难以诊断问题。

    detection:
      taint_sinks:
        - "catch.*..."
        - "catch.*Exception"

      steps:
        - "定位异常捕获代码"
        - "检查是否捕获所有异常类型"
        - "判断是否应分别处理"

      safety_conditions:
        - "捕获特定的异常类型"
        - "使用switch处理不同错误码"

    remediation:
      principle: "捕获特定的异常类型，分别处理不同错误"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "分别捕获特定异常"
        - "对不同错误进行不同处理"
        - "确保不隐藏未知错误"

    patterns:
      - pattern: "catch.*\\.{3}"
        description: "Catch-all handler — masks specific failures"
    safe_patterns:
      - "catch specific_error"
      - "switch.*error_code"

  - category: unhandled-edge-case
    owasp: A10
    severity: MEDIUM

    description: |
      未处理的边界情况：用户输入用于数值转换或数组索引未检查边界。
      可能导致整数溢出、越界访问或意外行为。

    detection:
      taint_sinks:
        - "atoi("
        - "atol("
        - "strtol("
        - "array["

      steps:
        - "定位数值转换或数组访问代码"
        - "检查是否有边界验证"
        - "判断是否可能越界"

      safety_conditions:
        - "转换前检查输入有效性"
        - "数组访问前检查索引范围"

    remediation:
      principle: "验证用户输入用于数值转换或数组访问时的边界"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用strtol并检查返回值"
        - "数组索引前验证范围"
        - "检查数值是否在合理范围内"

    patterns:
      - pattern: "atoi\\(.*input|atol\\(.*input|strtol\\(.*input"
        description: "Number parsing from user input without error check"
      - pattern: "\\[.*input.*\\]"
        description: "Direct array indexing with user input without bounds check"
    safe_patterns:
      - "if.*<.*MAX"
      - "validate"
      - "bounds_check"

  - category: error-information-leak
    owasp: A10
    severity: MEDIUM

    description: |
      错误信息泄露：向用户暴露详细的系统错误信息。
      可能泄露系统内部信息，帮助攻击者了解系统。

    detection:
      taint_sinks:
        - "perror("
        - "strerror("
        - "send("
        - "write("

      steps:
        - "定位错误输出代码"
        - "检查是否向用户发送详细错误"
        - "判断是否应使用通用消息"

      safety_conditions:
        - "使用通用错误消息"
        - "详细错误仅记录日志"

    remediation:
      principle: "向用户返回通用错误消息，详细信息仅记录日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换详细错误为通用消息"
        - "将详细错误记录到日志"
        - "避免暴露内部实现细节"

    patterns:
