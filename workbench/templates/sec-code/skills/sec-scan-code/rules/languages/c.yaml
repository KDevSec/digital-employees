  # ===== SUPPLY-CHAIN-ATTACKS - Time Bomb =====
  - category: time-bomb
    owasp: SUPPLY-CHAIN-ATTACKS
    severity: HIGH

    description: |
      时间炸弹：代码中存在基于时间的触发逻辑，可能在特定日期或时间后执行恶意操作。
      包括time(NULL)时间戳比较、difftime时间差比较、超长sleep、
      crontab操作、超长alarm等模式。

    detection:
      taint_sinks:
        - "time(NULL)"
        - "difftime("
        - "sleep("
        - "usleep("
        - "alarm("
        - "system("
        - "popen("

      steps:
        - "定位所有时间获取和比较操作"
        - "检查是否存在硬编码的时间戳阈值"
        - "检查是否存在超长sleep或alarm"
        - "检查时间条件后是否执行危险操作"
        - "检查是否存在crontab操作"

      safety_conditions:
        - "时间比较用于正常的业务逻辑"
        - "sleep用于合理的等待场景"
        - "代码在测试文件中"

    remediation:
      principle: "移除时间炸弹逻辑，所有定时操作必须有明确的业务用途和审计日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "需要定时任务"
          use: "使用受监控的调度系统，添加审计日志"
        - scenario: "需要过期检查"
          use: "使用配置化的过期策略，添加告警机制"

      requirements:
        - "移除硬编码的时间触发条件"
        - "所有定时操作必须可配置和可审计"
        - "禁止超长定时后执行危险操作"

    patterns:
      - pattern: "time\\(NULL\\)\\s*>\\s*\\d{9,}"
        description: "Unix timestamp comparison - potential time bomb trigger"
        confidence: 8
      - pattern: "difftime\\(.*\\d{9,}"
        description: "Time difference comparison with large value - potential time bomb"
        confidence: 7
      - pattern: "sleep\\(\\s*\\d{6,}"
        description: "Extremely long sleep (>11 days) - potential time bomb delay"
        confidence: 8
      - pattern: "usleep\\(\\s*\\d{11,}"
        description: "Extremely long usleep - potential time bomb delay"
        confidence: 8
      - pattern: "alarm\\(\\s*\\d{6,}"
        description: "Extremely long alarm (>11 days) - potential time bomb"
        confidence: 8
      - pattern: "system\\(.*crontab\\b"
        description: "Crontab manipulation via system() - suspicious scheduled task"
        confidence: 8
      - pattern: "popen\\(.*crontab\\b"
        description: "Crontab manipulation via popen() - suspicious scheduled task"
        confidence: 8
      - pattern: "time\\(NULL\\).*system\\("
        description: "Time check followed by system() - potential time bomb"
        confidence: 8

    safe_patterns:
      - "test"
      - "mock"
      - "assert"
      - "config"
      - "expire"
      - "cache"
      - "TIMEOUT"
