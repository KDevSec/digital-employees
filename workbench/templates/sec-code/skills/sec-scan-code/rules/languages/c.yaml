        - "sprintf("
        - "snprintf("

      steps:
        - "定位HTML输出代码"
        - "检查是否包含用户输入"
        - "判断是否经过HTML转义"

      safety_conditions:
        - "用户输入经过HTML转义"
        - "使用内容安全策略(CSP)"

    remediation:
      principle: "对输出到HTML的用户输入进行HTML实体编码"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
