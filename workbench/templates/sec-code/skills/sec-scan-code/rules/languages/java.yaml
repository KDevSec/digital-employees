        - "注释不包含敏感信息"

    remediation:
      principle: "移除注释中的敏感信息"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "删除注释中的敏感信息"
        - "使用通用描述替代"

    patterns:
      - pattern: "//.*password\\s*[:=]"
        description: "注释中包含密码"
      - pattern: "//.*admin.*password"
        description: "注释中包含管理员密码"
      - pattern: "//.*jdbc.*password"
        description: "注释中包含数据库密码"

    safe_patterns:
      - "// TODO"
      - "// FIXME"

  # ===== A10 - Mishandling of Exceptional Conditions =====
  - category: empty-catch
    owasp: A10
    severity: HIGH

    description: |
      空catch块：异常被静默捕获不做任何处理。
      可能隐藏安全问题。

    detection:
      taint_sinks:
        - "catch.*{"

      steps:
        - "定位catch块"
        - "检查处理内容"

      safety_conditions:
        - "记录日志"

    remediation:
      principle: "异常必须记录日志或适当处理"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加日志记录"

    patterns:
      - pattern: "catch.*\\{\\s*\\}"
        description: "Empty catch block — exception silently swallowed"
      - pattern: "catch.*\\{\\s*//.*\\}"
        description: "Catch block with only comment"

    safe_patterns:
      - "logger\\."
      - "log\\."
      - "throw"

  - category: broad-exception
    owasp: A10
    severity: MEDIUM

    description: |
      宽泛异常捕获：捕获Exception或Throwable基类。
      可能掩盖特定错误。

    detection:
      taint_sinks:
        - "catch (Exception"
        - "catch (Throwable"

      steps:
        - "定位catch块"
        - "检查捕获的异常类型"

      safety_conditions:
        - "捕获具体异常类型"

    remediation:
      principle: "捕获具体的异常类型"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "捕获具体的异常类型"

    patterns:
      - pattern: "catch\\s*\\(\\s*Exception\\s+"
        description: "Catching base Exception class — masks specific failures"
      - pattern: "catch\\s*\\(\\s*Throwable\\s+"
        description: "Catching Throwable — masks Error classes"

    safe_patterns:
      - "catch IOException"
      - "catch SQLException"
      - "catch IllegalArgumentException"

  - category: unhandled-edge-case
    owasp: A10
    severity: MEDIUM

    description: |
      未处理的边界情况：用户输入直接用于类型转换或索引。
      可能导致程序崩溃。

    detection:
      taint_sinks:
        - "Integer.parseInt("
        - "Long.parseLong("
        - ".get("

