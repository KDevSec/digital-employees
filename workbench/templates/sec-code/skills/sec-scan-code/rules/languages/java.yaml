language: java
file_extensions: [".java", ".kt", ".groovy", ".jsp", ".jspx"]
version: "3.1"

# =====================================================
# 扫描输出格式要求（重要）
# =====================================================
# 发现漏洞后，必须按以下格式输出：
#
# ## 漏洞报告
#
# **漏洞类型**: [category名称]
# **OWASP分类**: [owasp编号]
# **严重级别**: [severity]
# **文件位置**: [文件名:行号]
#
# **漏洞描述**:
# [描述该漏洞的原理和危害]
#
# **漏洞代码**:
# ```java
# [原始漏洞代码]
# ```
#
# **数据流分析**:
# - 污点源: [用户输入来源]
# - 污点汇聚: [危险函数调用]
# - 数据流路径: [描述数据如何从源头流到汇聚点]
#
# **修复方案**:
#
# 修复原则: [简述修复原则]
#
# 修复后代码:
# ```java
# [根据原始代码生成的修复后代码，保持原有逻辑，只修复漏洞点]
# ```
#
# 修复说明: [解释修复代码的改动点]
#
# =====================================================

# 全局配置：用户输入源（污点源）
taint_sources:
  - name: "Spring MVC请求"
    patterns:
      - "@RequestParam"
      - "@PathVariable"
      - "@RequestBody"
      - "@RequestHeader"
      - "@CookieValue"
      - "HttpServletRequest.getParameter"
      - "request.getParameter"

  - name: "JSP请求"
    patterns:
      - "request.getParameter"
      - "request.getAttribute"
      - "request.getHeader"
      - "request.getCookies"

  - name: "Servlet请求"
    patterns:
      - "HttpServletRequest"
      - "getInputStream"
      - "getReader"

  - name: "环境变量"
    patterns:
      - "System.getenv"
      - "System.getProperty"

rules:
  # ===== A01 - Broken Access Control =====
  - category: missing-auth
    owasp: A01
    severity: CRITICAL

    description: |
      缺少认证：Spring端点未添加认证或授权注解。
      未授权用户可以访问受限资源或执行敏感操作。

    detection:
      taint_sinks:
        - "@GetMapping"
        - "@PostMapping"
        - "@PutMapping"
        - "@DeleteMapping"
        - "@RequestMapping"
        - "doGet("
        - "doPost("

      steps:
        - "定位Controller方法"
        - "检查是否有安全注解"
        - "判断是否需要认证保护"

      safety_conditions:
        - "有 @PreAuthorize 装饰器"
        - "有 @Secured 装饰器"
        - "有 @RolesAllowed 装饰器"

    remediation:
      principle: "为敏感端点添加认证和授权注解"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "Spring Security"
          use: "添加 @PreAuthorize 或 @Secured 注解"

        - scenario: "方法级别"
          use: "使用 hasRole() 或 hasAuthority() 表达式"

        - scenario: "Servlet"
          use: "添加过滤器或拦截器验证用户身份"

      requirements:
        - "添加认证注解"
        - "验证用户身份"
        - "检查用户权限"

    patterns:
      - pattern: "@(Get|Post|Put|Delete|Patch)Mapping"
        description: "Spring endpoint without @PreAuthorize or auth check"
      - pattern: "@RequestMapping"
        description: "RequestMapping without security annotation"
      - pattern: "doGet\\s*\\(|doPost\\s*\\("
        description: "Servlet方法需检查认证"

    safe_patterns:
      - "@PreAuthorize"
      - "@Secured"
      - "@RolesAllowed"
      - "SecurityContext"

  - category: privilege-escalation
    owasp: A01
    severity: HIGH

    description: |
      权限提升：使用硬编码字符串进行角色判断。
      攻击者可能绕过权限检查。

    detection:
      taint_sinks:
        - "equals.*role"
        - "equalsIgnoreCase"
        - "getUserPrincipal().getName()"

      steps:
        - "定位权限检查代码"
        - "检查是否使用硬编码值"
        - "判断是否可被绕过"

      safety_conditions:
        - "使用 hasRole 函数"
        - "使用 hasAuthority 函数"

    remediation:
      principle: "使用权限检查函数而非硬编码值判断"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 hasRole() 或 hasAuthority()"
        - "避免直接比较硬编码字符串"

    patterns:
      - pattern: "equals.*role.*admin|equalsIgnoreCase.*admin"
        description: "Hardcoded role string comparison"
      - pattern: "getUserPrincipal\\(\\)\\.getName\\(\\).*=="
        description: "Direct principal name comparison"

    safe_patterns:
      - "hasRole"
      - "hasAuthority"
      - "checkPermission"

  - category: insecure-direct-object-reference
    owasp: A01
    severity: HIGH

    description: |
      不安全的直接对象引用：使用用户提供的ID直接访问对象。
      攻击者可以访问其他用户的数据。

    detection:
      taint_sinks:
        - "findById("
        - "findOne("
        - "getParameter("

      steps:
        - "定位对象查询代码"
        - "检查ID是否来自用户输入"
        - "判断是否验证了所有权"

      safety_conditions:
        - "查询时过滤当前用户"
        - "验证对象所有权"

    remediation:
      principle: "查询对象时验证当前用户是否为所有者"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "查询时添加用户过滤条件"
        - "验证对象所有权后返回"

    patterns:
      - pattern: "findById\\(.*request|findOne\\(.*request"
        description: "JPA lookup with user-controlled ID without ownership check"
      - pattern: "getParameter\\(.*id"
        description: "Direct object reference via request parameter"

    safe_patterns:
      - "owner"
      - "currentUser"
      - "belongsTo"

  - category: ssrf-url
    owasp: A01
    severity: HIGH

    description: |
      SSRF服务端请求伪造：使用用户输入构造请求URL。
      攻击者可以访问内部资源、发起攻击或绕过防火墙。

    detection:
      taint_sinks:
        - "new URL("
        - "HttpURLConnection"
        - "RestTemplate."
        - "HttpClient."

      steps:
        - "定位HTTP请求函数调用"
        - "追溯URL参数来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "URL使用白名单验证"
        - "限制允许的域名"

    remediation:
      principle: "使用白名单验证请求URL，限制可访问的域名"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证URL格式和协议"
        - "使用域名白名单"
        - "禁止访问内网地址"

    patterns:
      - pattern: "URL\\(.*request|HttpURLConnection\\(.*request"
        description: "URL connection with user-controlled URL"
      - pattern: "RestTemplate\\.(get|post|exchange)\\(.*request"
        description: "RestTemplate with user-controlled URL"
      - pattern: "HttpClient\\.(send|get|post)\\(.*request"
        description: "HttpClient with user-controlled URL"

    safe_patterns:
      - "validateUrl"
      - "ALLOWED_DOMAINS"
      - "URLValidator"

  - category: ssrf-dns
    owasp: A01
    severity: MEDIUM

    description: |
      DNS SSRF：使用用户输入进行DNS解析。
      攻击者可以进行DNS重绑定攻击。

    detection:
      taint_sinks:
        - "InetAddress.getByName("
        - "InetAddress.getAllByName("

      steps:
        - "定位DNS解析调用"
        - "检查参数来源"
        - "判断是否来自用户输入"

      safety_conditions:
        - "主机名使用白名单验证"
        - "验证解析结果"

    remediation:
      principle: "使用白名单验证主机名，验证解析结果"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用主机名白名单"
        - "验证解析结果IP地址"

    patterns:
      - pattern: "InetAddress\\.getByName\\(.*request|InetAddress\\.getAllByName\\(.*request"
        description: "DNS resolution with user input"

    safe_patterns:
      - "validateHostname"
      - "ALLOWED_HOSTS"

  # ===== A02 - Security Misconfiguration =====
  - category: default-credentials
    owasp: A02
    severity: HIGH

    description: |
      默认凭据：代码中硬编码默认密码或密钥。
      攻击者可使用默认凭据获取系统访问权限。

    detection:
      taint_sinks:
        - "password ="
        - "secret ="

      steps:
        - "扫描硬编码的凭据"
        - "检查是否为默认值"
        - "判断是否应从外部获取"

      safety_conditions:
        - "从环境变量读取"
        - "从配置文件读取"

    remediation:
      principle: "凭据从环境变量或配置文件读取，不在代码中硬编码"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 System.getenv 或 getProperty"
        - "移除硬编码的凭据"

    patterns:
      - pattern: "password.*=.*\"admin\"|password.*=.*\"123456\"|password.*=.*\"password\""
        description: "Default/hardcoded password"
      - pattern: "secret.*=.*\"[a-zA-Z0-9]+\""
        description: "Hardcoded secret string"

    safe_patterns:
      - "System\\.getenv"
      - "getProperty"
      - "@Value"

  - category: verbose-errors
    owasp: A02
    severity: MEDIUM

    description: |
      详细错误信息：堆栈跟踪输出到客户端。
      可能泄露敏感的系统信息。

    detection:
      taint_sinks:
        - "printStackTrace("
        - "getMessage("
        - "toString("

      steps:
        - "定位异常处理代码"
        - "检查错误输出"
        - "判断是否泄露信息"

      safety_conditions:
        - "使用日志记录"
        - "返回通用错误消息"

    remediation:
      principle: "异常信息记录日志，返回通用错误消息"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 logger 记录异常"
        - "返回通用错误消息"

    patterns:
      - pattern: "e\\.printStackTrace\\(\\)"
        description: "Stack trace printed to output"
      - pattern: "e\\.getMessage\\(\\).*response|e\\.toString\\(\\).*response"
        description: "Exception message in response"

    safe_patterns:
      - "logger\\."
      - "log\\."

  - category: cors-wildcard
    owasp: A02
    severity: MEDIUM

    description: |
      CORS通配符：CORS配置使用通配符允许任意来源。
      攻击者可以从任意域发起跨域请求。

    detection:
      taint_sinks:
        - "allowedOrigins"
        - "CorsConfiguration"
        - "Access-Control-Allow-Origin"

      steps:
        - "定位CORS配置"
        - "检查是否使用通配符"
        - "判断是否过于宽松"

      safety_conditions:
        - "使用明确的域名列表"
        - "不使用通配符"

    remediation:
      principle: "使用明确的允许域名列表，避免使用通配符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "配置允许的域名列表"
        - "移除通配符配置"

    patterns:
      - pattern: "allowedOrigins.*\\*|CorsConfiguration.*\\*"
        description: "CORS wildcard origin"
      - pattern: "Access-Control-Allow-Origin.*\\*"
        description: "CORS header with wildcard"

    safe_patterns:
      - "allowedOrigins"
      - "ALLOWED_ORIGINS"

  - category: debug-enabled
    owasp: A02
    severity: HIGH

    description: |
      调试模式启用：生产环境启用开发工具或调试模式。
      可能泄露敏感信息或存在安全风险。

    detection:
      taint_sinks:
        - "spring.devtools"
        - "debug = true"
        - "trace = true"

      steps:
        - "检查配置"
        - "判断是否为生产环境"
        - "判断是否应关闭"

      safety_conditions:
        - "生产环境禁用调试"

    remediation:
      principle: "生产环境禁用调试模式和开发工具"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除调试配置"
        - "使用生产配置"

    patterns:
      - pattern: "spring\\.devtools|spring-boot-devtools"
        description: "Spring DevTools enabled"
      - pattern: "debug\\s*=\\s*true|trace\\s*=\\s*true"
        description: "Debug/trace mode enabled"

    safe_patterns:
      - "production"
      - "prod"

  - category: unnecessary-features
    owasp: A02
    severity: MEDIUM

    description: |
      不必要功能：生产环境暴露API文档或监控端点。
      攻击者可获取系统信息辅助攻击。

    detection:
      taint_sinks:
        - "SwaggerConfig"
        - "springdoc"
        - "actuator"

      steps:
        - "检查配置"
        - "判断是否需要暴露"
        - "判断是否应禁用"

      safety_conditions:
        - "生产环境禁用"
        - "限制访问"

    remediation:
      principle: "生产环境禁用或限制访问文档和监控端点"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "禁用或限制Swagger"
        - "限制Actuator端点"

    patterns:
      - pattern: "SwaggerConfig|springdoc|swagger-ui"
        description: "Swagger/OpenAPI documentation endpoint exposed"
      - pattern: "actuator"
        description: "Spring Actuator endpoints exposed"

    safe_patterns:
      - "management\\.endpoints\\.web\\.exposure\\.exclude"

  # ===== A03 - Supply Chain Failures =====
  - category: known-vulnerability
    owasp: A03
    severity: HIGH

    description: |
      已知漏洞：使用存在已知漏洞的依赖版本。
      攻击者可利用公开漏洞进行攻击。

    detection:
      taint_sinks:
        - "log4j"
        - "jackson"
        - "spring"

      steps:
        - "检查依赖版本"
        - "对比漏洞数据库"
        - "判断是否存在漏洞"

      safety_conditions:
        - "使用最新稳定版本"

    remediation:
      principle: "升级到安全版本"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "升级到安全版本"

    patterns:
      - pattern: "log4j.*2\\.[01]\\.|jackson.*2\\.[0-9]\\."
        description: "Known vulnerable library version"
      - pattern: "spring.*4\\.|spring.*5\\.[0-3]\\."
        description: "Potentially vulnerable Spring version"

    safe_patterns:
      - ">=|latest"

  - category: outdated-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      过时依赖：固定依赖版本可能导致无法获取安全补丁。

    detection:
      taint_sinks:
        - "version"

      steps:
        - "检查版本约束"
        - "判断是否固定版本"

      safety_conditions:
        - "使用版本范围"

    remediation:
      principle: "使用版本范围以便获取安全补丁"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "使用 >= 版本范围"

    patterns:
      - pattern: "version.*=.*[0-9]+\\.[0-9]+\\.[0-9]+"
        description: "Pinned exact version (may miss security patches)"

    safe_patterns:
      - ">=|latest"

  - category: insecure-pipeline
    owasp: A03
    severity: HIGH

    description: |
      不安全流水线：CI/CD中下载依赖未验证完整性。
      可能导致供应链攻击。

    detection:
      taint_sinks:
        - "Runtime.getRuntime().exec(.*curl"
        - "Runtime.getRuntime().exec(.*wget"

      steps:
        - "定位下载代码"
        - "检查是否有验证"
        - "判断是否安全"

      safety_conditions:
        - "验证哈希值"

    remediation:
      principle: "下载依赖时验证完整性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证下载文件的哈希值"

    patterns:
      - pattern: "Runtime\\.getRuntime\\(\\)\\.exec\\(.*curl|Runtime\\.getRuntime\\(\\)\\.exec\\(.*wget"
        description: "Downloading dependencies via Runtime.exec without verification"

    safe_patterns:
      - "verify"
      - "checksum"

  - category: unverified-dependency
    owasp: A03
    severity: MEDIUM

    description: |
      未验证依赖：动态加载用户指定的类。
      可能加载恶意代码。

    detection:
      taint_sinks:
        - "Class.forName("

      steps:
        - "定位类加载代码"
        - "检查参数来源"
        - "判断是否安全"

      safety_conditions:
        - "使用白名单验证"

    remediation:
      principle: "使用白名单限制可加载的类"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加类名白名单验证"

    patterns:
      - pattern: "Class\\.forName\\(.*request"
        description: "Dynamic class loading from user input"

    safe_patterns:
      - "validate"
      - "whitelist"

  # ===== A04 - Cryptographic Failures =====
  - category: weak-hash
    owasp: A04
    severity: HIGH

    description: |
      弱哈希算法：使用MD5或SHA1等已被破解的哈希算法。
      攻击者可以构造碰撞。

    detection:
      taint_sinks:
        - "MessageDigest.getInstance(\"MD5"
        - "MessageDigest.getInstance(\"SHA1"

      steps:
        - "定位哈希函数调用"
        - "检查使用的算法"
        - "判断是否为弱算法"

      safety_conditions:
        - "使用 SHA-256 或更强"

    remediation:
      principle: "使用SHA-256或更强的哈希算法"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "替换为 SHA-256 或更强算法"

    patterns:
      - pattern: "MessageDigest\\.getInstance\\(\"MD5\"\\)|MessageDigest\\.getInstance\\(\"SHA1\"\\)|MessageDigest\\.getInstance\\(\"SHA-1\"\\)"
        description: "MD5/SHA1 hash algorithm"

    safe_patterns:
      - "SHA-256|SHA-384|SHA-512"

  - category: hardcoded-password
    owasp: A04
    severity: HIGH

    description: |
      硬编码密码：在代码中硬编码数据库密码、API密钥等敏感信息。
      导致敏感信息泄露，攻击者可直接获取密码。

    detection:
      taint_sinks:
        - "= \""
        - "setPassword("
        - "PASSWORD ="

      steps:
        - "扫描代码中的字符串赋值"
