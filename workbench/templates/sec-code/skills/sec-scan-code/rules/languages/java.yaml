      攻击者可以注入伪造的日志条目。

    detection:
      taint_sinks:
        - "logger."
        - "log."
        - "logger.info("
        - "logger.debug("
        - "System.out.println("

      steps:
        - "定位日志输出"
        - "检查内容来源"

      safety_conditions:
        - "验证用户输入"
        - "过滤换行符"
        - "使用参数化日志"

    remediation:
      principle: "日志内容验证或过滤特殊字符"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证日志内容"
        - "过滤用户输入中的换行符"
        - "使用参数化日志格式"

    patterns:
      - pattern: "logger\\..*\\+.*request|log\\..*\\+.*request"
