  # ===== SUPPLY-CHAIN-ATTACKS - Time Bomb =====
  - category: time-bomb
    owasp: SUPPLY-CHAIN-ATTACKS
    severity: HIGH

    description: |
      时间炸弹：代码中存在基于时间的触发逻辑，可能在特定日期或时间后执行恶意操作。
      包括System.currentTimeMillis时间戳比较、LocalDate日期比较、
      ScheduledExecutorService超长调度、Timer超长定时、crontab操作等模式。

    detection:
      taint_sinks:
        - "System.currentTimeMillis()"
        - "LocalDate.now()"
        - "ScheduledExecutorService.schedule("
        - "Timer.schedule("
        - "Runtime.getRuntime().exec("

      steps:
        - "定位所有日期/时间比较操作"
        - "检查是否存在硬编码的时间戳或日期阈值"
        - "检查是否存在超长定时任务调度"
        - "检查时间条件后是否执行危险操作"
        - "检查是否存在crontab操作"

      safety_conditions:
        - "时间比较用于正常的业务逻辑（如许可证过期）"
        - "定时任务有明确的业务用途和注释"
        - "代码在测试文件中"

    remediation:
      principle: "移除时间炸弹逻辑，所有定时操作必须有明确的业务用途和审计日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "需要定时任务"
          use: "使用受监控的调度系统（Quartz等），添加审计日志"
        - scenario: "需要过期检查"
          use: "使用配置化的过期策略，添加告警机制"

      requirements:
        - "移除硬编码的日期/时间触发条件"
        - "所有定时操作必须可配置和可审计"
        - "禁止超长定时后执行危险操作"

    patterns:
      - pattern: "System\\.currentTimeMillis\\(\\)\\s*>\\s*\\d{12,}"
        description: "Timestamp comparison with hardcoded value - potential time bomb"
        confidence: 8
      - pattern: "LocalDate\\.now\\(\\)\\.isAfter\\(LocalDate\\.of\\("
        description: "Date comparison with hardcoded date - potential time bomb"
        confidence: 7
      - pattern: "ScheduledExecutorService.*schedule.*\\d{6,}"
        description: "Extremely long scheduled task - potential time bomb delay"
        confidence: 7
      - pattern: "Timer\\(\\).*schedule.*\\d{6,}"
        description: "Extremely long Timer schedule - potential time bomb delay"
        confidence: 7
      - pattern: "Runtime\\.getRuntime\\(\\)\\.exec\\(.*crontab"
        description: "Crontab manipulation via Runtime.exec - suspicious scheduled task"
        confidence: 8
      - pattern: "new\\s+ProcessBuilder\\(.*crontab"
        description: "Crontab manipulation via ProcessBuilder - suspicious scheduled task"
        confidence: 8
      - pattern: "System\\.currentTimeMillis\\(\\).*Runtime\\.getRuntime\\(\\)"
        description: "Timestamp check followed by exec - potential time bomb"
        confidence: 8
      - pattern: "LocalDate\\.now\\(\\).*ProcessBuilder"
        description: "Date check followed by ProcessBuilder - potential time bomb"
        confidence: 8

    safe_patterns:
      - "test"
      - "mock"
      - "junit"
      - "Duration"
      - "Period"
      - "license"
      - "expire"
      - "cache"
