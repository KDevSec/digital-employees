      - pattern: "createNativeQuery\\(.*\\+|createNativeQuery\\(.*String\\.format"
        description: "Native SQL query with string concatenation"
      - pattern: "Statement\\.execute\\(.*\\+"
        description: "JDBC Statement with string concatenation"
      - pattern: "\".*\\+\\s*\\w+.*\"|\".*\"\\s*\\+\\s*\\w+"
        description: "字符串拼接构造SQL语句"
      - pattern: "createStatement\\(\\)"
        description: "使用Statement而非PreparedStatement"

    safe_patterns:
      - "setParameter"
      - "PreparedStatement"
      - "createNamedQuery"
      - "setString"
      - "setInt"

