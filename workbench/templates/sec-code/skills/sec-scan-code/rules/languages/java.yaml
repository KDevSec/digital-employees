  # ===== A07 - Identification and Authentication Failures =====
  - category: weak-password
    owasp: A07
    severity: MEDIUM

    description: |
      弱密码策略：密码长度要求过短。
      攻击者可以更容易进行暴力破解。

    detection:
      taint_sinks:
        - "length()"
        - ".length"

      steps:
        - "定位密码验证代码"
        - "检查长度要求"

      safety_conditions:
        - "密码长度 >= 8"

    remediation:
      principle: "实施强密码策略，最小长度8位"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "密码最小长度 >= 8"

    patterns:
      - pattern: "length\\(\\)\\s*<\\s*[1-6]|\\.length\\s*<\\s*[1-6]"
        description: "Weak password length check"

    safe_patterns:
      - "BCrypt"
      - "PBKDF2"
      - "SCrypt"

  - category: broken-session
    owasp: A07
    severity: HIGH

    description: |
      会话管理缺陷：会话Cookie未设置安全属性。
      可能导致会话劫持。

    detection:
      taint_sinks:
        - "session.setAttribute("
        - "cookie.setSecure"
        - "cookie.setHttpOnly"
        - "new Cookie("
        - "sendRedirect("

      steps:
        - "定位会话和Cookie配置"
        - "检查安全属性设置"

      safety_conditions:
        - "setSecure(true)"
        - "setHttpOnly(true)"
        - "重定向URL经过验证"

    remediation:
      principle: "设置Cookie安全属性"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "cookie.setSecure(true)"
        - "cookie.setHttpOnly(true)"
        - "验证重定向目标URL"

    patterns:
      - pattern: "session\\.setAttribute\\(.*request|session\\.putValue\\(.*request"
        description: "Session data from request without validation"
      - pattern: "cookie\\.setSecure\\(false\\)|cookie\\.setHttpOnly\\(false\\)"
        description: "Insecure cookie settings"
      - pattern: "new\\s+Cookie\\s*\\([^,]+,\\s*[^)]+\\)"
        description: "Cookie创建需设置安全属性"
      - pattern: "response\\.sendRedirect\\s*\\(.*request"
        description: "重定向URL使用用户输入"

    safe_patterns:
      - "validate"
      - "setSecure\\(true\\)"
      - "setHttpOnly"
      - "setMaxAge"

  - category: credential-exposure
