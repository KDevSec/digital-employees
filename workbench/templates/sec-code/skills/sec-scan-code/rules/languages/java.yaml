        - "实施MFA"

    remediation:
      principle: "为敏感操作实施多因素认证"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加MFA验证"

    patterns:
      - pattern: "authenticate\\(.*password|login\\(.*password"
        description: "Login with only password, no MFA"

    safe_patterns:
      - "mfa"
      - "totp"
      - "verifyCode"

  # ===== A08 - Software and Data Integrity Failures =====
  - category: insecure-deserialization
    owasp: A08
    severity: CRITICAL

    description: |
      不安全的反序列化：使用ObjectInputStream或XMLDecoder反序列化不可信数据。
      攻击者可以执行任意代码。

    detection:
      taint_sinks:
        - "ObjectInputStream.readObject("
        - "XMLDecoder("
        - "Yaml.load("
        - "readObject("

      steps:
        - "定位反序列化函数"
        - "检查是否使用安全方法"
        - "判断数据来源"

      safety_conditions:
        - "使用 SafeConstructor"
        - "使用 ObjectInputFilter"
        - "使用 ValidatingObjectInputStream"
        - "使用 JSON 替代 Java 序列化"

    remediation:
      principle: "使用安全的反序列化方法或限制可反序列化的类"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      alternatives:
        - scenario: "数据序列化"
          use: "使用 JSON (Jackson/Gson)"

        - scenario: "Java序列化"
          use: "使用 ValidatingObjectInputStream 限制类白名单"

      requirements:
        - "使用 SafeConstructor"
        - "配置 ObjectInputFilter"
        - "避免使用 ObjectInputStream 处理不可信数据"
        - "使用 JSON 替代"
        - "配置反序列化类白名单"

    patterns:
      - pattern: "ObjectInputStream\\.readObject\\("
        description: "Java native deserialization — RCE risk"
      - pattern: "XMLDecoder\\("
        description: "XMLDecoder deserialization — RCE risk"
      - pattern: "Yaml\\.load\\(.*request|SnakeYAML.*load\\("
        description: "YAML deserialization with user input"
      - pattern: "ObjectInputStream\\s*\\("
        description: "ObjectInputStream 反序列化不安全"
      - pattern: "readObject\\s*\\("
        description: "readObject 可能导致RCE"

    safe_patterns:
      - "SafeConstructor"
      - "ObjectInputFilter"
      - "ValidatingObjectInputStream"
      - "JSON"
      - "Jackson"

  - category: unsigned-update
    owasp: A08
    severity: HIGH

    description: |
      未签名更新：下载文件后未验证完整性或签名。
      可能安装被篡改的代码。

    detection:
      taint_sinks:
        - "URL("
        - "HttpURLConnection"

      steps:
        - "定位下载代码"
        - "检查是否有验证"

      safety_conditions:
        - "验证签名或哈希"

    remediation:
      principle: "下载后验证文件完整性或签名"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证签名或哈希值"

    patterns:
      - pattern: "URL\\(.*download|HttpURLConnection.*download"
        description: "Download without integrity verification"

    safe_patterns:
      - "Signature"
      - "MessageDigest"
      - "checksum"

  - category: insecure-cicd
    owasp: A08
    severity: HIGH

    description: |
