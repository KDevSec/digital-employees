    detection:
      taint_sinks:
        - "new Socket("
        - "Runtime.getRuntime().exec("
        - "new ProcessBuilder("
        - "getOutputStream("
        - "getInputStream("

      steps:
        - "定位Socket创建和网络连接"
        - "检查是否存在Runtime.exec执行Shell命令"
