        - "createQuery("
        - "createNativeQuery("
        - "Statement.execute("
        - "executeQuery("
        - "execute("
        - "executeUpdate("
        - "createStatement()"

      steps:
        - "定位SQL执行函数"
        - "检查参数构造方式"
        - "判断是否使用参数化查询"

      safety_conditions:
        - "使用 setParameter"
        - "使用 PreparedStatement"

    remediation:
      principle: "使用参数化查询，禁止字符串拼接SQL"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
