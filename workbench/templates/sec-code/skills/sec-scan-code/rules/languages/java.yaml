      - pattern: "logger\\..*\\(.*request\\.getParameter"
        description: "日志记录用户输入可能导致注入"
      - pattern: "log\\..*\\(.*\\+.*request"
        description: "日志拼接用户输入"
      - pattern: "System\\.out\\.println\\(.*request"
        description: "System.out 输出用户输入"

    safe_patterns:
      - "sanitize"
      - "validate_input"
      - "validate"

  - category: sensitive-comment
    owasp: A09
    severity: LOW

    description: |
