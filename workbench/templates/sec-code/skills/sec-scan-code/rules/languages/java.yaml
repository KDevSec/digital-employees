  # ===== A09 - Security Logging and Monitoring Failures =====
  - category: missing-logging
    owasp: A09
    severity: MEDIUM

    description: |
      日志缺失：异常被静默捕获未记录。
      可能错过安全事件。

    detection:
      taint_sinks:
        - "catch.*{"
        - "catch.*Exception"

      steps:
        - "定位异常处理代码"
        - "检查是否有日志记录"

      safety_conditions:
        - "使用 logger 记录异常"

    remediation:
      principle: "异常必须记录日志"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "添加日志记录"

    patterns:
      - pattern: "catch.*\\{\\s*\\}"
        description: "Empty catch block (swallowed exception)"
      - pattern: "catch.*Exception.*\\{[^}]*\\}"
        description: "Broad exception catch without logging"

    safe_patterns:
      - "logger\\."
      - "log\\."

  - category: sensitive-in-log
    owasp: A09
    severity: MEDIUM

    description: |
      日志中记录敏感信息：密码、令牌等输出到日志。
      导致敏感信息泄露。

    detection:
      taint_sinks:
        - "logger."
        - "log."
        - "log.info("
        - "log.debug("
        - "log.error("

      steps:
        - "定位日志输出"
        - "检查是否包含敏感信息"

      safety_conditions:
        - "脱敏处理"

    remediation:
      principle: "日志中不记录敏感信息"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "移除敏感信息的日志输出"

    patterns:
      - pattern: "logger\\..*password|log\\..*password|System\\.out.*password"
        description: "Password in log output"
      - pattern: "logger\\..*token|log\\..*token"
        description: "Token in log output"
      - pattern: "log\\..*password"
        description: "日志中记录密码"
      - pattern: "log\\..*token"
        description: "日志中记录令牌"
      - pattern: "log\\..*secret"
        description: "日志中记录密钥"

    safe_patterns:
      - "sanitize"
      - "mask"
      - "redact"
      - "\\*\\*\\*"

  - category: missing-alert
    owasp: A09
    severity: MEDIUM

    description: |
