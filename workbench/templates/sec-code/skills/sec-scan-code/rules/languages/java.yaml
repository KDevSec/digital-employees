      steps:
        - "定位文件写入代码"
        - "检查是否有哈希验证"

      safety_conditions:
        - "验证哈希值"

    remediation:
      principle: "写入下载内容前验证哈希"

      output_requirements:
        - "必须输出修复后的完整代码片段"
        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "写入前验证哈希值"

    patterns:
      - pattern: "FileOutputStream\\(.*URL|Files\\.write\\(.*download"
        description: "Writing downloaded content without hash check"

    safe_patterns:
      - "MessageDigest"
