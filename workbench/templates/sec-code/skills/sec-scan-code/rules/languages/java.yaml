        - "修复代码必须保持原有业务逻辑"
        - "修复代码必须可直接替换原代码"

      requirements:
        - "验证用户输入"

    patterns:
      - pattern: "session\\.setAttribute\\(.*request|session\\.putValue\\(.*request"
        description: "Session data from request without validation"

    safe_patterns:
