server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 100m;

  location /api/ { proxy_pass http://platform-api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /auth/callback {
    access_log off;
    proxy_pass http://platform-api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /auth/ { proxy_pass http://platform-api:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health/ { proxy_pass http://platform-api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
